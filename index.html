<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0755b8">
<title>KINSHASA BUSINESS 🇨🇩</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --blue:#0755b8;
  --yellow:#ffcc00;
  --red:#d71920;
  --white:#ffffff;
  --bg:#f2f5fa;
  --green:#16864a;
  --text:#17243a;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select { font:inherit }
button { cursor:pointer }
header {
  background:var(--blue);
  color:white;
  padding:17px 15px;
  border-bottom:5px solid var(--yellow);
}
.brand { font-size:20px;font-weight:900 }
.subtitle { font-size:12px;margin-top:5px }
main {
  width:100%;
  max-width:650px;
  margin:auto;
  padding:14px 13px 100px;
}
.hidden { display:none!important }
.card {
  background:white;
  border-radius:15px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 3px 12px #1020400d;
}
.hero {
  background:linear-gradient(135deg,#0755b8,#073675);
  color:white;
  border-bottom:5px solid var(--yellow);
}
.money { font-size:27px;font-weight:900;margin:13px 0 }
.banknotes {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:14px;
}
.note {
  min-height:62px;
  border-radius:9px;
  padding:10px 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:900;
  font-size:13px;
  border:2px solid white;
  box-shadow:0 3px 8px #0002;
}
.note:nth-child(1) { background:#16864a;color:white }
.note:nth-child(2) { background:var(--yellow);color:#222 }
.note:nth-child(3) { background:var(--red);color:white }
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.tile {
  border:0;
  border-radius:14px;
  background:white;
  padding:18px 8px;
  color:var(--blue);
  font-weight:800;
  box-shadow:0 3px 12px #1020400d;
}
.tile span { display:block;font-size:27px;margin-bottom:8px }
h2 { font-size:19px;margin:18px 0 12px }
h3 { margin-top:0 }
label {
  display:block;
  margin:10px 0 5px;
  font-size:13px;
  font-weight:bold;
}
input,select {
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  background:white;
}
.btn {
  border:0;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  margin-top:9px;
}
.primary { background:var(--blue);color:white }
.yellow { background:var(--yellow);color:#222 }
.green { background:var(--green);color:white }
.red { background:var(--red);color:white }
.gray { background:#e8edf5;color:#17243a }
.full { width:100% }
.muted { color:#69758a;font-size:13px }
.notice {
  padding:12px;
  border-radius:10px;
  background:#e8f1ff;
  border-left:4px solid var(--blue);
  margin:10px 0;
  font-size:13px;
}
.plan { border-top:4px solid var(--yellow) }
.price { font-size:22px;font-weight:900;color:var(--blue) }
.gain { font-weight:bold;color:var(--green);margin:10px 0 }
.pill {
  display:inline-block;
  background:#e8f1ff;
  padding:5px 8px;
  border-radius:20px;
  font-size:12px;
  margin:3px;
}
.item {
  padding:12px 0;
  border-bottom:1px solid #e5eaf2;
  overflow-wrap:anywhere;
}
.item:last-child { border-bottom:0 }
.status { font-weight:bold }
.pending { color:#a86600 }
.approved { color:var(--green) }
.rejected { color:var(--red) }
.nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:650px;
  background:white;
  border-top:1px solid #dce3ed;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px 3px calc(7px + env(safe-area-inset-bottom));
  z-index:10;
}
.nav button {
  background:white;
  color:#536179;
  border:0;
  font-size:11px;
  padding:5px 1px;
  font-weight:bold;
}
.nav button span { display:block;font-size:22px;margin-bottom:4px }
.nav button.active { color:var(--blue) }
.auth-wrap {
  max-width:440px;
  margin:35px auto;
  padding:15px;
}
.error {
  color:var(--red);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}
.ok { color:var(--green) }
.admin { border-top:5px solid var(--red) }
footer { text-align:center;color:#78849a;font-size:11px;padding:15px }
@media(min-width:480px) {
  main { padding-left:18px;padding-right:18px }
}
</style>
</head>

<body>

<header>
  <div class="brand">🇨🇩 KINSHASA BUSINESS</div>
  <div class="subtitle">La plateforme congolaise · Franc congolais (FC)</div>
</header>

<section id="authSection" class="auth-wrap">
  <div class="card">
    <h2 id="authTitle">Connexion</h2>
    <div id="authMessage"></div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Nom complet</label>
        <input id="fullName" autocomplete="name">
      </div>

      <label for="phone">Téléphone congolais</label>
      <input id="phone" type="tel" placeholder="+243XXXXXXXXX">

      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Mot de passe</label>
      <input id="password" type="password" required minlength="6"
             autocomplete="current-password">

      <label id="refLabel" for="refCode">Code de parrainage (facultatif)</label>
      <input id="refCode" placeholder="Code du parrain">

      <button class="btn primary full" id="authSubmit" type="submit">
        Se connecter
      </button>
    </form>

    <button class="btn gray full" id="toggleAuth" type="button">
      Créer un compte
    </button>
  </div>
</section>

<div id="app" class="hidden">
  <main id="content"></main>

  <nav class="nav">
    <button id="nav-home" class="active" onclick="page('home')">
      <span>⌂</span>ACCUEIL
    </button>
    <button id="nav-products" onclick="page('products')">
      <span>★</span>VIP/INVESTIR
    </button>
    <button id="nav-team" onclick="page('team')">
      <span>♧</span>ÉQUIPE
    </button>
    <button id="nav-profile" onclick="page('profile')">
      <span>●</span>MOI
    </button>
  </nav>
</div>

<footer>KINSHASA BUSINESS · République démocratique du Congo</footer>

<script>
"use strict";

/* CONFIGURATION SUPABASE EXISTANTE */
const SUPABASE_URL = "https://uewceocdzvekuopgsmpg.supabase.co";
const SUPABASE_KEY = "sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";
const ADMIN_EMAIL = "angenabukuze@gmail.com";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* PARAMÈTRES DE LA PLATEFORME */
const MIN_DEPOSIT = 15000;
const MIN_WITHDRAWAL = 2000;
const WITHDRAWAL_FEE = 0.10;
const SIGNUP_BONUS = 2000;

const PAYMENTS = [
  {name:"AIRTEL MONEY",number:"0973087965",beneficiary:"BASHIMBE"},
  {name:"ORANGE MONEY",number:"899532643",beneficiary:"JEANCQUELLINE"},
  {name:"M-PESA",number:"0861823718",beneficiary:"REGINA"}
];

const PLANS = [
  {id:"KIN1",price:15000,daily:2000,days:60,max:1},
  {id:"KIN2",price:30000,daily:4400,days:60,max:2},
  {id:"KIN3",price:80000,daily:12300,days:60,max:3},
  {id:"KIN4",price:150000,daily:24000,days:60,max:3},
  {id:"KIN5",price:300000,daily:52000,days:60,max:5},
  {id:"KIN6",price:600000,daily:120000,days:60,max:2},
  {id:"KIN7",price:1500000,daily:330000,days:60,max:2}
];

let user = null;
let profile = null;
let isAdmin = false;
let authMode = "login";
let currentPage = "home";

const $ = id => document.getElementById(id);
const money = value =>
  Number(value || 0).toLocaleString("fr-FR") + " FC";

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showMessage(element,text,isError=false) {
  $(element).innerHTML =
    `<div class="${isError ? "error" : "ok"}">${escapeHTML(text)}</div>`;
}

function getBalance() {
  return Number(profile?.balance ?? profile?.solde ?? 0);
}

function getName() {
  return profile?.full_name ||
         profile?.name ||
         user?.user_metadata?.name ||
         "Membre";
}

/* INSCRIPTION / CONNEXION */
function setAuthMode(mode) {
  authMode = mode;
  $("authTitle").textContent =
    mode === "signup" ? "Créer mon compte" : "Connexion";
  $("nameField").classList.toggle("hidden",mode !== "signup");
  $("refLabel").classList.toggle("hidden",mode !== "signup");
  $("refCode").classList.toggle("hidden",mode !== "signup");
  $("authSubmit").textContent =
    mode === "signup" ? "Créer mon compte" : "Se connecter";
  $("toggleAuth").textContent =
    mode === "signup" ? "J'ai déjà un compte" : "Créer un compte";
  $("authMessage").innerHTML = "";
}

$("toggleAuth").addEventListener("click",() => {
  setAuthMode(authMode === "login" ? "signup" : "login");
});

$("authForm").addEventListener("submit",async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;
  const phone = $("phone").value.trim();
  const name = $("fullName").value.trim();
  const referral = $("refCode").value.trim();

  if (!email || !password) {
    showMessage("authMessage","Veuillez remplir l'e-mail et le mot de passe.",true);
    return;
  }

  if (authMode === "signup" && !/^\+243\d{9}$/.test(phone)) {
    showMessage(
      "authMessage",
      "Utilisez le format congolais : +243 suivi de 9 chiffres.",
      true
    );
    return;
  }

  $("authSubmit").disabled = true;

  try {
    if (authMode === "signup") {
      const {data,error} = await sb.auth.signUp({
        email,
        password,
        options:{
          data:{
            name,
            phone,
            referral_code:referral
          }
        }
      });

      if (error) throw error;

      if (data.session) {
        await initializeUser(data.user);
      } else {
        showMessage(
          "authMessage",
          "Compte créé. Si la confirmation e-mail est activée dans Supabase, confirmez votre adresse puis connectez-vous."
        );
      }
    } else {
      const {data,error} = await sb.auth.signInWithPassword({
        email,password
      });

      if (error) throw error;
      await initializeUser(data.user);
    }
  } catch(error) {
    showMessage("authMessage",error.message || "Une erreur est survenue.",true);
  } finally {
    $("authSubmit").disabled = false;
  }
});

/* CHARGEMENT DU PROFIL ET VÉRIFICATION ADMIN */
async function initializeUser(authUser) {
  user = authUser;

  const adminResult = await sb
    .from("kb_admins")
    .select("*")
    .eq("user_id",user.id)
    .limit(1);

  if (adminResult.error) {
    console.error("Vérification administrateur:",adminResult.error.message);
  }

  isAdmin =
    user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase() &&
    !adminResult.error &&
    Array.isArray(adminResult.data) &&
    adminResult.data.length > 0;

  await loadProfile();

  $("authSection").classList.add("hidden");
  $("app").classList.remove("hidden");

  page("home");
}

async function loadProfile() {
  if (!user) return;

  const result = await sb
    .from("kb_profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if (result.error) {
    throw new Error(
      "Impossible de charger le profil : " + result.error.message
    );
  }

  profile = result.data;

  if (!profile) {
    throw new Error(
      "Aucun profil trouvé pour ce compte dans kb_profiles. Vérifiez le déclencheur de création du profil déjà configuré dans Supabase."
    );
  }
}

async function refreshData() {
  await loadProfile();
}

/* NAVIGATION */
function page(name) {
  currentPage = name;

  if (name === "admin" && !isAdmin) {
    name = "profile";
  }

  document.querySelectorAll(".nav button").forEach(button => {
    button.classList.toggle("active",button.id === "nav-" + name);
  });

  if (name === "home") renderHome();
  else if (name === "products") renderProducts();
  else if (name === "team") renderTeam();
  else if (name === "profile") renderProfile();
  else if (name === "history") renderHistory();
  else if (name === "admin") renderAdmin();
}

/* ACCUEIL */
function renderHome() {
  $("content").innerHTML = `
    <div class="banknotes">
      <div class="note">🇨🇩 FRANC CONGOLAIS</div>
      <div class="note">KINSHASA BUSINESS</div>
      <div class="note">FC · RDC</div>
    </div>

    <section class="card hero">
      <h2>Bienvenue, ${escapeHTML(getName())} !</h2>
      <div>Mon solde</div>
      <div class="money">${money(getBalance())}</div>
      <div>Devise : Franc congolais (FC)</div>
    </section>

    <div class="grid">
      <button class="tile" onclick="openDeposit()">
        <span>💰</span>DÉPÔT
      </button>
      <button class="tile" onclick="openWithdraw()">
        <span>💸</span>RETRAIT
      </button>
      <button class="tile" onclick="page('products')">
        <span>🎁</span>MES PRODUITS
      </button>
      <button class="tile" onclick="page('history')">
        <span>📋</span>HISTORIQUES DES TRANSACTIONS
      </button>
    </div>

    <h2>Produits VIP</h2>
    ${PLANS.slice(0,2).map(planCard).join("")}

    <button class="btn primary full" onclick="page('products')">
      Voir tous les produits VIP
    </button>

    <section class="card">
      <h3>Compte à rebours</h3>
      <div id="countdown" class="money">00jrs:00h:00min:00 secondes</div>
    </section>

    ${isAdmin ? `
      <button class="btn red full" onclick="page('admin')">
        ⚙ OUVRIR L'ADMINISTRATION
      </button>
    ` : ""}
  `;

  startCountdown();
}

function planCard(plan) {
  return `
    <section class="card plan">
      <div class="row">
        <h3>${escapeHTML(plan.id)}</h3>
        <div class="price">${money(plan.price)}</div>
      </div>
      <div class="gain">${money(plan.daily)} / jour · Paramètre affiché</div>
      <span class="pill">${plan.days} jours</span>
      <span class="pill">Maximum ${plan.max}</span>
      <button class="btn primary full" onclick="requestPlan('${plan.id}')">
        Voir ${escapeHTML(plan.id)}
      </button>
    </section>
  `;
}

/* PRODUITS VIP */
function renderProducts() {
  $("content").innerHTML = `
    <h2>MES PRODUITS VIP</h2>
    <div class="notice">
      Choisissez un produit pour consulter ses paramètres et soumettre votre demande.
    </div>
    ${PLANS.map(planCard).join("")}
  `;
}

async function requestPlan(planId) {
  const plan = PLANS.find(item => item.id === planId);
  if (!plan) return;

  alert(
    plan.id + "\n" +
    "Prix : " + money(plan.price) + "\n" +
    "Gain journalier configuré : " + money(plan.daily) + "\n" +
    "Durée : " + plan.days + " jours\n\n" +
    "L'achat réel nécessite la table de commandes VIP et la procédure de débit déjà prévues dans votre backend Supabase."
  );
}

/* DÉPÔTS */
function openDeposit() {
  $("content").innerHTML = `
    <h2>💰 Effectuer un dépôt</h2>
    <section class="card">
      <div class="notice">Dépôt minimum : ${money(MIN_DEPOSIT)}</div>

      <form id="depositForm">
        <label>Montant (FC)</label>
        <input id="depositAmount" type="number" min="${MIN_DEPOSIT}" required>

        <label>Opérateur de paiement</label>
        <select id="depositOperator">
          ${PAYMENTS.map((p,i)=>`
            <option value="${i}">${escapeHTML(p.name)}</option>
          `).join("")}
        </select>

        <div id="depositPaymentInfo"></div>

        <label>Référence du transfert</label>
        <input id="depositReference" required placeholder="Référence de transaction">

        <button class="btn primary full" type="submit">
          Envoyer ma demande
        </button>
      </form>
    </section>

    <button class="btn gray full" onclick="page('home')">Retour à l'accueil</button>
  `;

  const updatePaymentInfo = () => {
    const p = PAYMENTS[Number($("depositOperator").value)];
    $("depositPaymentInfo").innerHTML = `
      <div class="notice">
        <b>${escapeHTML(p.name)}</b><br>
        Numéro : <b>${escapeHTML(p.number)}</b><br>
        Bénéficiaire : <b>${escapeHTML(p.beneficiary)}</b>
        <button class="btn yellow full" type="button"
          onclick="copyValue('${p.number}')">Copier le numéro</button>
      </div>
    `;
  };

  $("depositOperator").addEventListener("change",updatePaymentInfo);
  updatePaymentInfo();

  $("depositForm").addEventListener("submit",submitDeposit);
}

async function submitDeposit(event) {
  event.preventDefault();

  const amount = Number($("depositAmount").value);
  const reference = $("depositReference").value.trim();
  const payment = PAYMENTS[Number($("depositOperator").value)];

  if (amount < MIN_DEPOSIT) {
    alert("Le dépôt minimum est de " + money(MIN_DEPOSIT));
    return;
  }

  try {
    const {error} = await sb
      .from("kb_deposits")
      .insert({
        user_id:user.id,
        amount,
        payment_method:payment.name,
        payment_reference:reference,
        status:"pending"
      });

    if (error) throw error;

    alert("Demande de dépôt envoyée. Elle est en attente de décision de l'administration.");
    page("history");
  } catch(error) {
    alert("Erreur lors de l'envoi : " + error.message);
  }
}

/* RETRAITS */
function openWithdraw() {
  $("content").innerHTML = `
    <h2>💸 Effectuer un retrait</h2>
    <section class="card">
      <div>Solde actuel : <b>${money(getBalance())}</b></div>
      <div class="notice">
        Minimum : ${money(MIN_WITHDRAWAL)}<br>
        Frais configurés : 10 %
      </div>

      <form id="withdrawForm">
        <label>Montant brut demandé (FC)</label>
        <input id="withdrawAmount" type="number" min="${MIN_WITHDRAWAL}" required>

        <label>Opérateur</label>
        <select id="withdrawOperator">
          ${PAYMENTS.map(p=>`
            <option value="${escapeHTML(p.name)}">${escapeHTML(p.name)}</option>
          `).join("")}
        </select>

        <label>Numéro de réception +243</label>
        <input id="withdrawPhone" type="tel" placeholder="+243XXXXXXXXX" required>

        <button class="btn primary full" type="submit">
          Envoyer ma demande
        </button>
      </form>
    </section>
    <button class="btn gray full" onclick="page('home')">Retour à l'accueil</button>
  `;

  $("withdrawForm").addEventListener("submit",submitWithdraw);
}

async function submitWithdraw(event) {
  event.preventDefault();

  const amount = Number($("withdrawAmount").value);
  const operator = $("withdrawOperator").value;
  const phone = $("withdrawPhone").value.trim();

  if (amount < MIN_WITHDRAWAL) {
    alert("Le retrait minimum est de " + money(MIN_WITHDRAWAL));
    return;
  }

  if (amount > getBalance()) {
    alert("Votre solde affiché est insuffisant.");
    return;
  }

  if (!/^\+243\d{9}$/.test(phone)) {
    alert("Utilisez le format +243 suivi de 9 chiffres.");
    return;
  }

  try {
    const {error} = await sb
      .from("kb_withdrawals")
      .insert({
        user_id:user.id,
        amount,
        payment_method:operator,
        phone_number:phone,
        status:"pending"
      });

    if (error) throw error;

    alert("Demande envoyée. L'administration pourra l'approuver ou la rejeter.");
    page("history");
  } catch(error) {
    alert("Erreur lors de la demande : " + error.message);
  }
}

/* HISTORIQUE */
async function renderHistory() {
  $("content").innerHTML = `
    <h2>Historiques des transactions</h2>
    <section class="card" id="historyBox">Chargement...</section>
    <button class="btn gray full" onclick="page('home')">Retour</button>
  `;

  const result = await sb
    .from("kb_transactions")
    .select("*")
    .eq("user_id",user.id)
    .order("created_at",{ascending:false})
    .limit(100);

  if (result.error) {
    $("historyBox").innerHTML =
      `<div class="error">${escapeHTML(result.error.message)}</div>`;
    return;
  }

  const rows = result.data || [];

  $("historyBox").innerHTML = rows.length ? rows.map(row => `
    <div class="item">
      <b>${escapeHTML(row.type || row.transaction_type || "Transaction")}</b><br>
      Montant : ${money(row.amount)}<br>
      Statut : <span class="status">${escapeHTML(row.status || "enregistré")}</span><br>
      <small>${escapeHTML(row.created_at || "")}</small>
    </div>
  `).join("") : "<p>Aucune transaction enregistrée.</p>";
}

/* ÉQUIPE */
function renderTeam() {
  const referralCode = "KB" + user.id.replaceAll("-","").slice(0,10).toUpperCase();
  const link = location.origin + location.pathname + "?ref=" + referralCode;

  $("content").innerHTML = `
    <h2>Mon équipe</h2>

    <section class="card">
      <h3>Mon code de parrainage</h3>
      <div class="money">${referralCode}</div>
      <button class="btn primary full" onclick="copyValue('${referralCode}')">
        Copier mon code
      </button>
    </section>

    <section class="card">
      <h3>Mon lien d'inscription</h3>
      <input id="referralLink" readonly value="${escapeHTML(link)}">
      <button class="btn yellow full" onclick="copyValue($('referralLink').value)">
        Copier mon lien
      </button>
    </section>

    <section class="card">

<style>
:root{

 --red2:#ff303a;
 --black:#09090b;
 --dark:#141417;
 --dark2:#1d1d22;
 --white:#fff;

 --line:#303038;
 --green:#19c37d;
 --yellow:#f5c542;

}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--black);
 color:var(--white);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{

 margin:auto;
 padding-bottom:90px;
}
header{

 top:0;

 backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);
 padding:14px 16px;
}
.logo{
 display:flex;
 align-items:center;
 gap:10px;
}
.flag{font-size:30px}
.logo strong{font-size:19px}
.logo small{
 display:block;
 color:var(--gray);

}
main{padding:15px}

h2{font-size:21px;margin:18px 0 11px}
h3{margin:0 0 9px}
p{line-height:1.45}
.muted{color:var(--gray)}
.small{font-size:12px}

.card{
 background:var(--dark);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 margin-bottom:14px;
}
.hero{
 background:linear-gradient(145deg,#300307,#111116 65%);
 border:1px solid #65151b;
 border-radius:22px;
 padding:20px;

}
.hero h1{margin:0 0 7px;font-size:27px}
.hero p{margin:0;color:#d2d2d7}
.balance{

}
.notice{

 background:#18181c;
 padding:12px;
 border-radius:12px;
 margin-bottom:14px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}
.action{
 background:var(--dark);
 border:1px solid var(--line);
 border-radius:16px;
 padding:16px 10px;
 color:white;
 text-align:center;
}
.action b{display:block;margin-top:7px}
.action span{font-size:25px}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.plan{
 background:var(--dark);
 border:1px solid var(--line);
 border-radius:18px;
 padding:17px;
 margin-bottom:12px;
}
.plan-top{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.kin{
 font-size:22px;
 font-weight:900;
}
.price{
 font-size:21px;
 font-weight:900;
}
.gain{
 color:var(--green);
 font-weight:800;
 margin:9px 0;
}
.tag{
 display:inline-block;
 background:#2a2a30;
 color:#ddd;
 border-radius:20px;
 padding:5px 9px;
 font-size:12px;
 margin:3px 3px 0 0;
}

.btn{
 width:100%;

 border-radius:13px;
 padding:13px;
 font-weight:800;
 margin-top:9px;
}
.btn-red{background:var(--red);color:#fff}
.btn-dark{background:#29292f;color:#fff;border:1px solid #3a3a42}
.btn-green{background:var(--green);color:#06150f}
.btn-blue{background:var(--blue);color:white}
.btn-yellow{background:var(--yellow);color:#171200}
.btn-danger{background:#471016;color:#ffb8bd}
.btn-small{
 width:auto;

 margin:4px 3px 0 0;

}

input,select,textarea{

 background:#0f0f12;
 color:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px;
 outline:none;
 margin:5px 0 9px;
}
textarea{min-height:90px}
label{
 display:block;
 font-size:13px;
 color:#c9c9cf;
 margin-top:8px;
}

.pay{

 padding:13px;

}

.stat{

.status{

}
.member-head{

 justify-content:space-between;
 gap:10px;

}
.member-actions{

}

.admin-title{

}
.admin-menu{

 grid-template-columns:repeat(2,1fr);
 gap:8px;

}
.admin-menu button{
 background:#1b1b20;
 border:1px solid var(--line);
 color:#fff;
 border-radius:13px;
 padding:12px 5px;
 font-size:12px;
 font-weight:800;
}
.admin-menu button.active{
 background:var(--red);
 border-color:var(--red);
}

.table-card{

}
.request{

 border-radius:15px;
 padding:13px;
 margin:9px 0;
}
.request strong{

.auth{

.auth-logo .flag{font-size:45px}

}
.tabs button{
 border:0;

}
.tabs button.active{

.msg{

 margin:8px 0;

}
.msg.ok{background:#103c2b;color:#8ff0c4}
.msg.err{background:#42151a;color:#ffb9be}

.nav{
 position:fixed;
 z-index:30;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(700px,100%);
 background:#111114;
 border-top:1px solid var(--line);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 padding:8px 5px calc(8px + env(safe-area-inset-bottom));
}
.nav button{
 background:none;
 border:0;
 color:#9999a2;
 font-size:11px;
 padding:6px 2px;
}
.nav button.active{color:#fff}
.nav span{
 display:block;
 font-size:21px;
 margin-bottom:2px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.80);
 z-index:50;
 display:flex;
 align-items:flex-end;
 justify-content:center;
}
.modal-box{
 width:min(700px,100%);
 background:#151519;
 border-radius:22px 22px 0 0;
 padding:18px;
 max-height:92vh;
 overflow:auto;
}
.close{
 float:right;
 background:#29292f;
 color:#fff;
 border:0;
 border-radius:50%;
 width:35px;
 height:35px;
 font-size:20px;
}

.center{text-align:center}
hr{
 border:0;
 border-top:1px solid var(--line);
 margin:16px 0;
}

@media(min-width:601px){
 .nav{border-radius:18px 18px 0 0}
}
</style>
</head>

<div id="auth" class="auth">
 <div class="auth-box">

<script>

const SUPABASE_URL =
"https://uewceocdzvekuopgsmpg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Bl_nhA00AQTBVBu7EFFQ_GhPUvtq9";

const sb =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const ADMIN_EMAIL =
"angenabukuze@gmail.com";


const PAYMENTS = [

 {
  operator:"AIRTEL MONEY",
  number:"973087965",
  name:"YVETTE",
  active:true
 },

 {
  operator:"ORANGE MONEY",
  number:"899532643",
  name:"JEANCQUELINE",
  active:true
 },

 {
  operator:"M-PESA",
  number:"0861823718",
  name:"REGINA",
  active:true
 }

];


const PLANS = [

 {
  id:"KIN1",
  price:15000,
  gain:2000,
  days:60,
  max:1
 },

 {
  id:"KIN2",
  price:30000,
  gain:4400,
  days:60,
  max:2
 },

 {
  id:"KIN3",
  price:80000,
  gain:12300,
  days:60,
  max:3
 },

 {
  id:"KIN4",
  price:150000,
  gain:24000,
  days:60,
  max:3
 },

 {
  id:"KIN5",
  price:300000,
  gain:52000,
  days:60,
  max:5
 },

 {
  id:"KIN6",
  price:600000,
  gain:120000,
  days:60,
  max:2
 },

 {
  id:"KIN7",
  price:1500000,
  gain:330000,
  days:60,
  max:2
 }

];


let user=null;
let profile=null;
let wallet=null;
let currentPage="home";
let isAdmin=false;
let adminTab="dashboard";


function money(n){
 return Number(n||0)
 .toLocaleString("fr-FR")+" FC";
}


function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}


function msg(text,type="ok"){
 return `<div class="msg ${type}">${esc(text)}</div>`;
}


function statusLabel(s){

 if(s==="pending")
  return `<span class="status pending">EN ATTENTE</span>`;

 if(s==="approved"||s==="validated")
  return `<span class="status approved">VALIDÉ</span>`;

 if(s==="rejected")
  return `<span class="status rejected">REJETÉ</span>`;

 if(s==="blocked")
  return `<span class="status blocked">BLOQUÉ</span>`;

 return `<span class="status active">${esc(s||"ACTIF")}</span>`;
}


function dateTime(v){

 if(!v)return "—";

 try{
  return new Date(v).toLocaleString(
   "fr-FR",
   {
    dateStyle:"short",
    timeStyle:"short"
   }
  );
 }catch(e){
  return v;
 }
}


function showAuth(type){

 const login=type==="login";

 document
 .getElementById("loginTab")
 .classList.toggle("active",login);

 document
 .getElementById("signupTab")
 .classList.toggle("active",!login);

 document
 .getElementById("signupFields")
 .classList.toggle("hidden",login);

 document
 .getElementById("authBtn")
 .textContent=
 login
 ? "Se connecter"
 : "Créer mon compte";

 document.getElementById("authMsg").innerHTML="";
}


async function submitAuth(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 const name=
 document.getElementById("name").value.trim();

 const referral=
 document.getElementById("referral")
 ?.value.trim()
 .toUpperCase() || "";

 const signup=
 !document
 .getElementById("signupFields")
 .classList.contains("hidden");

 if(!email||!password){

  document.getElementById("authMsg").innerHTML=
  msg(
   "Email et mot de passe obligatoires",
   "err"
  );

  return;
 }

 document.getElementById("authBtn").disabled=true;

 try{

  if(signup){

   const result=
   await sb.auth.signUp({
    email,
    password,
    options:{
     data:{
      name
     }
    }
   });

   if(result.error)
    throw result.error;

   const u=result.data.user;

   if(u){

    const profileData={
     id:u.id,
     full_name:name||"Membre",
     role:"member"
    };

    if(referral)
     profileData.referred_by_code=referral;

    const pr=
    await sb
    .from("profiles")
    .upsert(profileData);

    if(pr.error)
     console.warn(pr.error);

    await sb
    .from("kin_wallets")
    .upsert({
     user_id:u.id,
     balance:2000,
     total_earnings:0
    });

    document.getElementById("authMsg").innerHTML=
    msg(
     "Inscription réussie ! Vous pouvez maintenant utiliser votre compte."
    );
   }

  }else{

   const result=
   await sb.auth.signInWithPassword({
    email,
    password
   });

   if(result.error)
    throw result.error;
  }

 }catch(e){

  document.getElementById("authMsg").innerHTML=
  msg(
   e.message||"Erreur",
   "err"
  );

 }finally{

  document.getElementById("authBtn").disabled=false;

 }
}


async function githubLogin(){

 const {error}=
 await sb.auth.signInWithOAuth({
  provider:"github",
  options:{
   redirectTo:location.href
  }
 });

 if(error)
 document.getElementById("authMsg").innerHTML=
 msg(error.message,"err");
}


async function loadUser(){

 const {data}=
 await sb.auth.getUser();

 user=data.user;

 if(!user){

  document.getElementById("auth")
  .classList.remove("hidden");

  document.getElementById("app")
  .classList.add("hidden");

  return;
 }

 await loadData();

 document.getElementById("auth")
 .classList.add("hidden");

 document.getElementById("app")
 .classList.remove("hidden");

 page("home");
}


async function loadData(){

 if(!user)return;

 const p=
 await sb
 .from("profiles")
 .select("*")
 .eq("id",user.id)
 .maybeSingle();

 profile=
 p.data||{
  id:user.id,
  full_name:
   user.user_metadata?.name||"Membre",
  role:"member"
 };

 isAdmin=
 profile.role==="admin"||
 user.email?.toLowerCase()===
 ADMIN_EMAIL.toLowerCase();

 const w=
 await sb
 .from("kin_wallets")
 .select("*")
 .eq("user_id",user.id)
 .maybeSingle();

 wallet=
 w.data||{
  balance:2000,
  total_earnings:0
 };
}


function navActive(name){

 document
 .querySelectorAll(".nav button")
 .forEach(x=>
  x.classList.remove("active")
 );

 const el=
 document.getElementById("nav-"+name);

 if(el)el.classList.add("active");
}


function page(name){

 currentPage=name;

 if(name==="admin"&&!isAdmin)
  name="profile";

 navActive(
  name==="products"?"products":
  name==="tasks"?"tasks":
  name==="team"?"team":
  name==="profile"?"profile":
  "home"
 );

 if(name==="home")renderHome();
 if(name==="products")renderProducts();
 if(name==="tasks")renderTasks();
 if(name==="team")renderTeam();
 if(name==="profile")renderProfile();
 if(name==="admin")renderAdmin();
}


function renderHome(){

 document.getElementById("content").innerHTML=`

 <section class="hero">

  <h1>Bienvenue 🇨🇩</h1>

  <p>
   ${esc(profile?.full_name||"Membre")}
   · KINSHASA BUSINESS
  </p>

  <div class="balance">
   ${money(wallet?.balance)}
  </div>

  <div class="muted">
   Solde disponible
  </div>

  <div class="row" style="margin-top:15px">

   <div>
    <small class="muted">
     Gains cumulés
    </small>

    <div>
     <b>${money(wallet?.total_earnings)}</b>
    </div>
   </div>

   <div>🇨🇩</div>

  </div>

 </section>


 <div class="notice">

  📢 Bienvenue sur
  <b>KINSHASA BUSINESS</b>.

  Les montants de gains affichés
  correspondent aux paramètres déclarés
  des produits.

 </div>


 <div class="grid">

  <button class="action"
   onclick="openDeposit()">

   <span>＋</span>
   <b>Dépôt</b>

  </button>


  <button class="action"
   onclick="openWithdraw()">

   <span>↗</span>

  </button>


  <button class="action"
   onclick="page('tasks')">

  </button>


  <button class="action"
   onclick="page('team')">

   <span>♧</span>
   <b>Équipe</b>

  </button>

 </div>


 <h2>Nos KIN</h2>

 <button class="btn btn-red"
  onclick="page('products')">

 </button>

 `;
}


function planMini(p){

 return `

 <div class="plan">

  <div class="plan-top">

   <div class="kin">
    ${p.id}
   </div>

   <div class="price">
    ${money(p.price)}
   </div>

  </div>

  <div class="gain">
   Gain affiché :

  </div>

  </span>

 document.getElementById("content").innerHTML=`

 <h2>Produits KIN</h2>

 <div class="notice">

  Les montants affichés sont les paramètres
  déclarés des produits.

 </div>

 ${PLANS.map(p=>`

function requestKin(id){

 const p=PLANS.find(x=>x.id===id);

 if(!p)return;

 showModal(`

  <button class="close"
   onclick="closeModal()">×</button>

  <h2>${p.id}</h2>

  <p>
   Prix :
   <b>${money(p.price)}</b>
  </p>

  <p>
   Gain affiché :
   <b>${money(p.gain)}/jour</b>
  </p>

  <button class="btn btn-red"
   onclick="closeModal()">

   Fermer

  </button>

 `);
}

 document.getElementById("content").innerHTML=`

 <h2>Tâches & Pointage</h2>

 <div class="card center">

  <div style="font-size:45px">
   ✓
  </div>

  <h3>

async function checkin(){

 const today=
 new Date().toISOString().slice(0,10);

 const {error}=
 await sb
 .from("kin_daily_checkins")
 .insert({
  user_id:user.id,
  checkin_date:today,
  reward:20
 });

 if(error){

async function submitWithdraw(){

 const amount=
 Number(
  document.getElementById("wdAmount").value
 );

 const operator=
 PAYMENTS[
  Number(
   document.getElementById("wdOperator").value
  )
 ];

 const number=
 document.getElementById("wdNumber")
 .value.trim();

 if(amount<2000){

  alert(
   "Le retrait minimum est de 2 000 FC."
  );

  return;
 }

 if(
  amount>
  Number(wallet?.balance||0)
 ){

  alert("Solde insuffisant.");
  return;
 }

 if(!number){

  alert(
   "Entrez votre numéro de réception."
  );

  return;
 }

 const fee=amount*0.10;
 const net=amount-fee;

 const {error}=
 await sb
 .from("kin_withdrawal_requests")
 .insert({
  user_id:user.id,
  amount,
  fee,
  net_amount:net,
  operator:operator.operator,
  payment_number:number,
  status:"pending"
 });

 if(error){

  alert(
   "Impossible d'envoyer : "+
   error.message
  );

  return;
 }

 closeModal();

 alert(
  "Demande de retrait envoyée.\n\n"+
  "Montant : "+money(amount)+"\n"+
  "Frais : "+money(fee)+"\n"+
  "Net : "+money(net)
 );
}

async function toggleMember(id,blocked){

  blocked

  "admin_set_member_status",
  {

   r.error.message

 }

async function adminWithdrawals(){

 const panel=
 document.getElementById("adminPanel");

 panel.innerHTML=
 `<div class="card">Chargement des retraits...</div>`;

 const r=
 await sb
 .from("kin_withdrawal_requests")
 .select("*")
 .order(
  "created_at",
  {ascending:false}
 );

 if(r.error){

  panel.innerHTML=
  msg(r.error.message,"err");

  return;
 }

 const rows=r.data||[];

 panel.innerHTML=`

 <div class="notice">
  Tous les retraits sont affichés.
 </div>

 ${rows.map(withdrawCard).join("")||

 `<div class="card muted">
  Aucun retrait.
 </div>`}

 `;
}


function withdrawCard(x){

 return `

 <div class="request">

  <div class="row">

   <strong>
    ${money(x.amount)}
   </strong>

   ${statusLabel(x.status)}

  </div>

  <p class="small">
   Date :
   <b>${dateTime(x.created_at)}</b>
  </p>

  <p class="small">
   Utilisateur :
   <b>${esc(x.user_id)}</b>
  </p>

  <p class="small">
   Opérateur :
   <b>${esc(x.operator||"—")}</b>
  </p>

  <p class="small">
   Numéro réception :
   <b>${esc(x.payment_number||"—")}</b>
  </p>

  <p class="small">
   Montant :
   <b>${money(x.amount)}</b>
  </p>

  <p class="small">
   Frais :
   <b>${money(x.fee)}</b>
  </p>

  <p class="small">
   Net :
   <b>${money(x.net_amount)}</b>
  </p>

  ${
   x.status==="pending"
   ?
   `
   <button class="btn btn-green"
    onclick="validateWithdrawal('${x.id}')">
    ✅ VALIDER LE RETRAIT
   </button>

   <button class="btn btn-danger"
    onclick="rejectWithdrawal('${x.id}')">
    ❌ REJETER LE RETRAIT
   </button>
   `
   :
   ""
  }

 </div>

 `;
}


async function validateWithdrawal(id){

 const note=
 prompt(
  "Note de validation :",
  "Retrait validé par l'administration"
 );

 if(note===null)return;

 const r=
 await sb.rpc(
  "admin_validate_withdrawal",
  {
   p_request_id:id,
   p_note:note
  }
 );

 if(r.error){

  alert(
   "Validation refusée par Supabase :\n"+
   r.error.message
  );

  return;
 }

 alert("Retrait validé.");
 adminWithdrawals();
}


async function rejectWithdrawal(id){

 const note=
 prompt(
  "Motif du rejet :"
 );

 if(note===null||!note.trim()){

  alert("Le motif est obligatoire.");
  return;
 }

 const r=
 await sb.rpc(
  "admin_reject_withdrawal",
  {
   p_request_id:id,
   p_note:note
  }
 );

 if(r.error){

  alert(
   "Rejet refusé :\n"+
   r.error.message
  );

  return;
 }

 alert("Retrait rejeté.");
 adminWithdrawals();
}


/* PAIEMENTS */

function adminPayments(){

 const panel=
 document.getElementById("adminPanel");

 panel.innerHTML=`

 <h3>
  📱 Moyens de paiement
 </h3>

 <div class="notice">
  Vous pouvez modifier les coordonnées
  de paiement affichées aux membres.
 </div>

 ${PAYMENTS.map((p,i)=>`

 <div class="pay">

  <strong>
   ${p.operator}
  </strong>

  <div class="number">
   ${p.number}
  </div>

  <p class="small">
   Bénéficiaire :
   <b>${p.name}</b>
  </p>

  <p>
   Statut :
   ${p.active
    ?statusLabel("active")
    :statusLabel("blocked")}
  </p>

  <button class="btn btn-dark"
   onclick="editPayment(${i})">

   Modifier

  </button>

  <button class="btn ${
   p.active
   ?"btn-danger"
   :"btn-green"
  }"
   onclick="togglePayment(${i})">

   ${p.active
    ?"Désactiver"
    :"Activer"}

  </button>

 </div>

 `).join("")}

 <button class="btn btn-red"
  onclick="addPayment()">

  ＋ Ajouter un opérateur

 </button>

 `;
}


function editPayment(i){

 const p=PAYMENTS[i];

 const number=
 prompt(
  "Numéro de paiement :",
  p.number
 );

 if(number===null)return;

 const name=
 prompt(
  "Nom du bénéficiaire :",
  p.name
 );

 if(name===null)return;

 const operator=
 prompt(
  "Nom de l'opérateur :",
  p.operator
 );

 if(operator===null)return;

 PAYMENTS[i]={
  ...p,
  number,
  name,
  operator
 };

 alert(
  "Coordonnées modifiées dans cette interface."
 );

 adminPayments();
}


function togglePayment(i){

 PAYMENTS[i].active=
 !PAYMENTS[i].active;

 adminPayments();
}


function addPayment(){

 const operator=
 prompt("Nom de l'opérateur :");

 if(!operator)return;

 const number=
 prompt("Numéro de paiement :");

 if(!number)return;

 const name=
 prompt("Nom du bénéficiaire :");

 if(!name)return;

 PAYMENTS.push({
  operator,
  number,
  name,
  active:true
 });

 adminPayments();
}

function showModal(html){

 .innerHTML=`

 <div class="modal"

   if(event.target===this)
   closeModal()
  ">

  <div class="modal-box">
   ${html}
  </div>

function closeModal(){

 document.getElementById("modal")
 .innerHTML="";
}


async function copyText(text){

 try{

  await navigator.clipboard
  .writeText(text);

  alert("Copié !");

 }catch(e){

  alert(text);

 }
}


async function logout(){

 await sb.auth.signOut();

 user=null;
 profile=null;
 wallet=null;

 document.getElementById("app")
 .classList.add("hidden");

 document.getElementById("auth")
 .classList.remove("hidden");
}


sb.auth.onAuthStateChange(
 async(event,session)=>{

  if(
   event==="SIGNED_IN"&&
   session
  ){

   setTimeout(
    loadUser,
    100
   );

  }

  if(event==="SIGNED_OUT"){

   document.getElementById("app")
   .classList.add("hidden");

   document.getElementById("auth")
   .classList.remove("hidden");

  }

 }
);


loadUser();

</script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://uewceocdzvekuopgsmpg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   CONFIGURATION
===================================================== */

const ADMIN_EMAIL =
  "angenabukuze@gmail.com";

const PAYMENTS = [
  {
    operator:"AIRTEL MONEY",
    number:"973087965",
    name:"YVETTE"
  },
  {
    operator:"ORANGE MONEY",
    number:"899532643",
    name:"JEANCQUELINE"
  },
  {
    operator:"M-PESA",
    number:"0861823718",
    name:"REGINA"
  }
];

const PLANS = [

  {
    id:"suw6v7",
    name:"KIN1",
    price:15000,
    daily:2000,
    days:60,
    max:1
  },

  {
    id:"kin2",
    name:"KIN2",
    price:30000,
    daily:4400,
    days:60,
    max:2
  },

  {
    id:"kin3",
    name:"KIN3",
    price:80000,
    daily:12300,
    days:60,
    max:3
  },

  {
    id:"kin4",
    name:"KIN4",
    price:150000,
    daily:24000,
    days:60,
    max:3
  },

  {
    id:"kin5",
    name:"KIN5",
    price:300000,
    daily:52000,
    days:60,
    max:5
  },

  {
    id:"kin6",
    name:"KIN6",
    price:600000,
    daily:120000,
    days:60,
    max:2
  },

  {
    id:"kin7",
    name:"KIN7",
    price:1500000,
    daily:330000,
    days:60,
    max:2
  }

];


/* =====================================================
   VARIABLES
===================================================== */

let user = null;
let profile = null;
let wallet = null;
let isAdmin = false;
let currentPage = "home";
let authMode = "login";


/* =====================================================
   OUTILS
===================================================== */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function money(value){

  return Number(value || 0)
    .toLocaleString("fr-FR") + " FC";

}

function shortCode(id){

  return "KIN" +
    id
      .replaceAll("-","")
      .slice(0,8)
      .toUpperCase();

}

function showMessage(text,type="err"){

  document.getElementById("authMsg").innerHTML =
    `<div class="msg ${type}">${esc(text)}</div>`;

}

function appMessage(text,type="ok"){

  return `<div class="msg ${type}">${esc(text)}</div>`;

}


/* =====================================================
   AUTH MODE
===================================================== */

function showAuth(mode){

  authMode = mode;

  document
    .getElementById("loginTab")
    .classList.toggle("active",mode==="login");

  document
    .getElementById("signupTab")
    .classList.toggle("active",mode==="signup");

  const fields =
    document.getElementById("signupFields");

  fields.classList.toggle(
    "hidden",
    mode !== "signup"
  );

  document.getElementById("authBtn").textContent =
    mode === "login"
      ? "Se connecter"
      : "S'inscrire";

  document.getElementById("authMsg").innerHTML = "";

}


/* =====================================================
   INSCRIPTION / CONNEXION
===================================================== */

async function submitAuth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    showMessage(
      "Veuillez remplir votre email et votre mot de passe."
    );

    return;
  }


  if(authMode === "login"){

    await login(email,password);

  }else{

    await signup(email,password);

  }

}


async function login(email,password){

  showMessage("Connexion en cours...","ok");

  const result =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if(result.error){

    showMessage(
      "Connexion impossible : " +
      result.error.message
    );

    return;
  }

  await loadUser();

}


async function signup(email,password){

  const name =
    document.getElementById("name")
      .value.trim();

  const phone =
    document.getElementById("phone")
      .value.trim();

  const password2 =
    document.getElementById("password2")
      .value;

  const referral =
    document.getElementById("referral")
      .value.trim()
      .toUpperCase();


  if(!name || !phone){

    showMessage(
      "Veuillez remplir votre nom et votre numéro."
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return;
  }

  if(password !== password2){

    showMessage(
      "Les deux mots de passe sont différents."
    );

    return;
  }


  showMessage(
    "Création du compte...",
    "ok"
  );


  const result =
    await sb.auth.signUp({

      email,

      password,

      options:{
        data:{
          name:name,
          phone:phone
        }
      }

    });


  if(result.error){

    showMessage(
      "Inscription impossible : " +
      result.error.message
    );

    return;
  }


  if(!result.data.user){

    showMessage(
      "Le compte n'a pas pu être créé."
    );

    return;
  }


  const uid =
    result.data.user.id;

  const code =
    shortCode(uid);


  /*
     Le profil est créé séparément.
     Si une colonne optionnelle n'existe pas,
     on tente d'abord la version complète,
     puis une version minimale.
  */

  let profileResult =
    await sb
      .from("profiles")
      .upsert({

        id:uid,

        full_name:name,

        phone:phone,

        referral_code:code,

        referred_by_code:
          referral || null,

        role:"member"

      },{
        onConflict:"id"
      });


  if(profileResult.error){

    profileResult =
      await sb
        .from("profiles")
        .upsert({

          id:uid,

          full_name:name,

          phone:phone,

          role:"member"

        },{
          onConflict:"id"
        });

  }


  /*
     Création du portefeuille.
     Si le wallet existe déjà, rien n'est supprimé.
  */

  await sb
    .from("kin_wallets")
    .upsert({

      user_id:uid,

      balance:2000,

      total_earnings:0

    },{
      onConflict:"user_id"
    });


  showMessage(
    "Inscription réussie ! Vous pouvez maintenant vous connecter.",
    "ok"
  );

  setTimeout(()=>{

    showAuth("login");

    document.getElementById("password").value = "";

  },1200);

}


/* =====================================================
   MOT DE PASSE OUBLIÉ
===================================================== */

async function forgotPassword(){

  const email =
    document.getElementById("email")
      .value.trim();

  if(!email){

    showMessage(
      "Entrez d'abord votre adresse email."
    );

    return;
  }

  const result =
    await sb.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin
      }
    );

  if(result.error){

    showMessage(
      "Impossible d'envoyer le lien : " +
      result.error.message
    );

    return;
  }

  showMessage(
    "Un lien sécurisé de réinitialisation a été envoyé à votre email.",
    "ok"
  );

}


/* =====================================================
   CHARGEMENT UTILISATEUR
===================================================== */

async function loadUser(){

  const session =
    await sb.auth.getSession();

  if(!session.data.session){

    document
      .getElementById("auth")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

    return;
  }

  user =
    session.data.session.user;


  const p =
    await sb
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();


  profile =
    p.data || {

      id:user.id,

      full_name:
        user.user_metadata?.name ||
        "Membre",

      role:"member"

    };


  isAdmin =
    profile.role === "admin" ||
    user.email?.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase();


  const w =
    await sb
      .from("kin_wallets")
      .select("*")
      .eq("user_id",user.id)
      .maybeSingle();


  wallet =
    w.data || {

      balance:2000,

      total_earnings:0

    };


  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  page("home");

}


/* =====================================================
   NAVIGATION
===================================================== */

function page(name){

  currentPage = name;

  document
    .querySelectorAll(".nav button")
    .forEach(b =>
      b.classList.remove("active")
    );


  const nav =
    document.getElementById(
      "nav-" + name
    );

  if(nav)
    nav.classList.add("active");


  if(name==="home")
    renderHome();

  else if(name==="products")
    renderProducts();

  else if(name==="tasks")
    renderTasks();

  else if(name==="team")
    renderTeam();

  else if(name==="profile")
    renderProfile();

  else if(name==="admin")
    renderAdmin();

}

   ACCUEIL
===================================================== */

/* =====================================================
   PRODUITS
===================================================== */

function renderProducts(){

  const c =
    document.getElementById("content");

  c.innerHTML = `

    <h2>📦 Produits KIN</h2>

    <div class="notice">

      Choisissez un produit.
      L'achat réel doit être validé

      id="depAmount"
      type="number"

      placeholder="15000">

      class="btn btn-red"

  `);

async function submitDeposit(){

  const amount =
    Number(
      document.getElementById(
        "depAmount"
      ).value
    );


  const ref =
    document.getElementById(
      "depRef"
    ).value.trim();


  const operator =
    PAYMENTS[
      Number(
        document.getElementById(
          "depOperator"
        ).value
      )
    ];


  if(amount < 15000){

    alert(
      "Le dépôt minimum est de 15 000 FC."
    );

    return;

  }


  const result =
    await sb
      .from("kin_deposit_requests")
      .insert({

        user_id:user.id,

        amount:amount,

        operator:operator.operator,

        payment_number:operator.number,

        payment_name:operator.name,

        reference:ref || null,

        status:"pending"

      });


  if(result.error){

    alert(
      "Impossible d'envoyer le dépôt : " +
      result.error.message
    );

    return;

  }


  closeModal();

  alert(
    "Demande de dépôt envoyée. Elle sera vérifiée par l'administration."
  );

}

async function submitWithdraw(){

  const amount =
    Number(
      document.getElementById(
        "wdAmount"
      ).value
    );


  const operator =
    PAYMENTS[
      Number(
        document.getElementById(
          "wdOperator"
        ).value
      )
    ];


  const number =
    document.getElementById(
      "wdNumber"
    ).value.trim();


  if(amount < 2000){

    alert(
      "Le retrait minimum est de 2 000 FC."
    );

    return;

  }


  if(
    amount >
    Number(wallet?.balance || 0)
  ){

    alert(
      "Solde insuffisant."
    );

    return;

  }


  if(!number){

    alert(
      "Entrez votre numéro de réception."
    );

    return;

  }


  const fee =
    amount * 0.10;

  const net =
    amount - fee;


  const result =
    await sb
      .from(
        "kin_withdrawal_requests"
      )
      .insert({

        user_id:user.id,

        amount:amount,

        fee:fee,

        net_amount:net,

        operator:
          operator.operator,

        payment_number:number,

        status:"pending"

      });


  if(result.error){

    alert(
      "Impossible d'envoyer le retrait : " +
      result.error.message
    );

    return;

  }


  closeModal();

  alert(
    "Demande de retrait envoyée.\n\n" +
    "Montant : " +
    money(amount) +
    "\nFrais 10% : " +
    money(fee) +
    "\nNet indicatif : " +
    money(net)
  );

}

function showModal(html){

  document.getElementById(
    "modal"
  ).innerHTML = `

    <div
      class="modal"
      onclick="
        if(event.target===this)
        closeModal()
      ">

      <div class="modal-box">
        ${html}
      </div>

}


function closeModal(){

  document.getElementById(

}


/* =====================================================
   COPIE
===================================================== */

async function copyText(text){

  try{

    await navigator.clipboard
      .writeText(text);

    alert("Copié !");

  }catch(e){

    alert(text);

  }

}

===================================================== */

async function logout(){

  await sb.auth.signOut();

  user = null;
  profile = null;
  wallet = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("auth")
    .classList.remove("hidden");

  showAuth("login");

}


/* =====================================================
   AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      event === "SIGNED_IN" &&
      session
    ){

      setTimeout(
        loadUser,
        100
      );

    }


    if(
      event === "SIGNED_OUT"
    ){

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("auth")
        .classList.remove("hidden");

    }

  }
);

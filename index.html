
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINSHASA BUSINESS 🇨🇩</title>
<style>
:root {
  --bleu:#007fff;
  --jaune:#ffce00;
  --rouge:#ce1021;
  --fond:#f1f5f9;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--fond);color:#172033}
.drapeau{height:7px;background:linear-gradient(to bottom,#007fff 33%,#ffce00 33% 66%,#ce1021 66%)}
header{background:var(--bleu);color:white;text-align:center;padding:22px 10px;border-bottom:5px solid var(--jaune)}
header h1{font-size:25px;margin:0}
header p{margin:8px 0 0}
main{max-width:600px;margin:18px auto;padding:0 12px 100px}
.carte{background:white;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #00000010}
h2{font-size:21px;margin-top:0}
input{width:100%;padding:13px;margin:6px 0 13px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
label{font-size:14px;font-weight:bold}
button{border:0;border-radius:9px;padding:13px;font-size:15px;font-weight:bold;cursor:pointer}
.bleu{background:var(--bleu);color:white}
.jaune{background:var(--jaune);color:#172033}
.rouge{background:var(--rouge);color:white}
.large{width:100%}
.ligne{display:flex;gap:9px;margin-bottom:17px}
.ligne button{flex:1}
.cache{display:none!important}
.message{padding:12px;border-radius:8px;margin-top:12px;font-size:14px}
.erreur{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.succes{background:#dcfce7;color:#166534}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -3px 12px #0002;padding:6px 2px}
nav button{background:white;color:#172033;font-size:11px;padding:7px 1px}
nav span{display:block;font-size:21px;margin-bottom:4px}
nav button.actif{color:var(--bleu);background:#eaf4ff}
.stat{background:#eaf4ff;padding:15px;border-radius:9px;margin:10px 0}
</style>
</head>
<body>
<div class="drapeau"></div>
<header>
<h1>🇨🇩 KINSHASA BUSINESS</h1>
<p>République démocratique du Congo</p>
</header>

<main>
<section class="carte" id="auth">
<div class="ligne">
<button class="bleu" id="btnConnexion" onclick="changerMode('connexion')">Connexion</button>
<button class="jaune" id="btnInscription" onclick="changerMode('inscription')">Inscription</button>
</div>

<h2 id="titreAuth">Connexion</h2>
<form id="formAuth">
<div id="champNom" class="cache">
<label>Nom complet</label>
<input id="nom" placeholder="Votre nom complet">
</div>

<label>Email</label>
<input id="email" type="email" placeholder="Votre adresse email" required>

<label>Téléphone RDC (+243)</label>
<input id="telephone" type="tel" placeholder="+243..." required>

<div id="champParrain" class="cache">
<label>Code de parrainage (facultatif)</label>
<input id="parrain" placeholder="Code du parrain">
</div>

<label>Mot de passe</label>
<input id="motDePasse" type="password" minlength="6" placeholder="6 caractères minimum" required>

<div id="champConfirmation" class="cache">
<label>Confirmer le mot de passe</label>
<input id="confirmation" type="password" minlength="6" placeholder="Répéter le mot de passe">
</div>

<button class="bleu large" id="btnEnvoyer" type="submit">Se connecter</button>
</form>

<p style="text-align:center">
<a href="#" id="motOublie">Mot de passe oublié ?</a>
</p>
<div id="message" class="cache"></div>
</section>

<section id="espace" class="cache">
<div class="carte">
<h2 id="titrePage">🏠 Accueil</h2>
<p id="bienvenue">Bienvenue sur KINSHASA BUSINESS 🇨🇩</p>
<div class="stat">💰 Solde : <strong>0 Fc</strong></div>
<div id="contenuPage">Bienvenue dans votre espace membre.</div>
</div>
<div class="carte">
<button class="rouge large" onclick="deconnexion()">Déconnexion</button>
</div>
</section>
</main>

<nav id="menu" class="cache">
<button class="actif" onclick="ouvrirPage('Accueil',this)"><span>🏠</span>Accueil</button>
<button onclick="ouvrirPage('KIN',this)"><span>🧴</span>KIN</button>
<button onclick="ouvrirPage('Pointage',this)"><span>✓</span>Pointage</button>
<button onclick="ouvrirPage('Menu',this)"><span>☰</span>Menu</button>
</nav>

<script>
let mode="connexion";
let utilisateur=null;

const el=id=>document.getElementById(id);

function afficherMessage(texte,type="info"){
 const m=el("message");
 m.textContent=texte;
 m.className="message "+type;
}

function changerMode(nouveauMode){
 mode=nouveauMode;
 const inscription=mode==="inscription";

 el("titreAuth").textContent=inscription?"Créer un compte":"Connexion";
 el("champNom").classList.toggle("cache",!inscription);
 el("champParrain").classList.toggle("cache",!inscription);
 el("champConfirmation").classList.toggle("cache",!inscription);
 el("nom").required=inscription;
 el("confirmation").required=inscription;
 el("btnEnvoyer").textContent=inscription?"S'inscrire":"Se connecter";
 el("btnConnexion").className=inscription?"jaune":"bleu";
 el("btnInscription").className=inscription?"bleu":"jaune";
 el("message").className="cache";
}

el("formAuth").addEventListener("submit",function(e){
 e.preventDefault();

 const nom=el("nom").value.trim();
 const email=el("email").value.trim();
 const telephone=el("telephone").value.trim();
 const motDePasse=el("motDePasse").value;

 if(!/^\+243[0-9]{9}$/.test(telephone.replace(/[\s-]/g,""))){
  afficherMessage("Entrez un numéro RDC valide au format +243 suivi de 9 chiffres.","erreur");
  return;
 }

 if(mode==="inscription"){
  if(!nom){
   afficherMessage("Entrez votre nom complet.","erreur");
   return;
  }
  if(motDePasse.length<6){
   afficherMessage("Le mot de passe doit contenir au moins 6 caractères.","erreur");
   return;
  }
  if(motDePasse!==el("confirmation").value){
   afficherMessage("Les deux mots de passe ne correspondent pas.","erreur");
   return;
  }

  afficherMessage("Le formulaire est valide. Pour enregistrer réellement le compte, connectez le site à Supabase.","info");
  return;
 }

 afficherMessage("La connexion réelle n'est pas encore activée. Il faut relier l'authentification à Supabase.","info");
});

el("motOublie").addEventListener("click",function(e){
 e.preventDefault();
 afficherMessage("La récupération du mot de passe doit être configurée dans le service d'authentification.","info");
});

function ouvrirPage(page,bouton){
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("actif"));
 if(bouton) bouton.classList.add("actif");

 el("titrePage").textContent=({
  Accueil:"🏠 Accueil",
  KIN:"🧴 KIN",
  Pointage:"✓ Pointage",
  Equipe:"👥 Équipe",
  Historique:"📜 Historique",
  Profil:"👤 Profil",
  Admin:"⚙️ Administration",
  Menu:"☰ Menu"
 })[page]||page;

 const contenu=el("contenuPage");

 if(page==="Menu"){
  contenu.innerHTML=
   '<button class="jaune large" onclick="ouvrirPage(\'Equipe\')">👥 Équipe</button><br><br>'+
   '<button class="jaune large" onclick="ouvrirPage(\'Historique\')">📜 Historique</button><br><br>'+
   '<button class="jaune large" onclick="ouvrirPage(\'Profil\')">👤 Profil</button><br><br>'+
   '<button class="bleu large" onclick="ouvrirPage(\'Admin\')">⚙️ Administration</button>';
 }else if(page==="KIN"){
  contenu.textContent="Les plans KIN seront affichés ici après configuration.";
 }else if(page==="Pointage"){
  contenu.textContent="Votre pointage journalier apparaîtra ici après connexion à la base de données.";
 }else if(page==="Equipe"){
  contenu.textContent="Les membres parrainés apparaîtront ici.";
 }else if(page==="Historique"){
  contenu.textContent="L'historique des dépôts, retraits et opérations apparaîtra ici.";
 }else if(page==="Profil"){
  contenu.textContent=utilisateur?"Compte : "+utilisateur.email:"Informations du profil.";
 }else if(page==="Admin"){
  contenu.textContent="Espace administrateur à sécuriser côté serveur. Ne pas laisser les autorisations administrateur accessibles à tous les membres.";
 }else{
  contenu.textContent="Bienvenue sur KINSHASA BUSINESS 🇨🇩";
 }
}

function deconnexion(){
 utilisateur=null;
 el("espace").classList.add("cache");
 el("menu").classList.add("cache");
 el("auth").classList.remove("cache");
 changerMode("connexion");
}

</script>
</body>
</html>

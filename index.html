<style>
.tx-admin-box{
  margin:14px 0;
  padding:14px;
  background:#111115;
  border:1px solid #29292f;
  border-radius:16px;
}

.tx-admin-btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  margin:8px 0;
  background:#c8102e;
  color:#fff;
  font-weight:900;
  font-size:15px;
}

.tx-filter{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:10px 0;
}

.tx-filter button{
  border:1px solid #33333a;
  background:#1b1b20;
  color:#fff;
  border-radius:10px;
  padding:10px;
}

.tx-card{
  background:#18181d;
  border:1px solid #303038;
  border-radius:14px;
  padding:13px;
  margin:9px 0;
}

.tx-card .tx-title{
  font-weight:900;
  font-size:16px;
  margin-bottom:6px;
}

.tx-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:4px 0;
  font-size:13px;
}

.tx-label{
  color:#9999a3;
}

.tx-amount{
  font-weight:900;
  font-size:17px;
}

.tx-pending{
  color:#ffd166;
}

.tx-approved{
  color:#4ade80;
}

.tx-rejected{
  color:#ff5c67;
}

.tx-empty{
  text-align:center;
  padding:20px;
  color:#9999a3;
}
</style>

<script>
/* =========================================================
   TRANSACTIONS ADMIN
   ========================================================= */

let txCurrentFilter = "all";

/* Formater une transaction */
function transactionStatus(status){

  const s = String(status || "pending").toLowerCase();

  if(
    s === "approved" ||
    s === "validated" ||
    s === "completed" ||
    s === "success"
  ){
    return `<span class="tx-approved">VALIDÉE</span>`;
  }

  if(
    s === "rejected" ||
    s === "refused" ||
    s === "cancelled"
  ){
    return `<span class="tx-rejected">REJETÉE</span>`;
  }

  return `<span class="tx-pending">EN ATTENTE</span>`;
}

/* Déterminer le type de transaction */
function transactionType(x){

  const type = String(
    x.type ||
    x.transaction_type ||
    x.kind ||
    ""
  ).toLowerCase();

  if(type.includes("deposit") || type.includes("depot")){
    return "DÉPÔT";
  }

  if(type.includes("withdraw") || type.includes("retrait")){
    return "RETRAIT";
  }

  if(type.includes("earning") || type.includes("gain")){
    return "GAIN";
  }

  if(type.includes("bonus")){
    return "BONUS";
  }

  if(type.includes("commission")){
    return "COMMISSION";
  }

  if(type.includes("purchase") || type.includes("kin")){
    return "ACHAT KIN";
  }

  return x.type || x.transaction_type || "TRANSACTION";
}

/* Affichage date/heure */
function transactionDate(x){

  const value =
    x.created_at ||
    x.date ||
    x.transaction_date ||
    x.updated_at;

  if(!value) return "Date inconnue";

  try{
    return new Date(value).toLocaleString("fr-FR",{
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });
  }catch(e){
    return value;
  }
}

/* Page Transactions */
async function renderTransactions(){

  if(!isAdmin){
    page("profile");
    return;
  }

  const c = document.getElementById("content");

  c.innerHTML = `
    <div class="tx-admin-box">

      <h2 class="admin-title">
        💳 Transactions
      </h2>

      <p class="muted">
        Historique des opérations enregistrées sur la plateforme.
      </p>

      <button
        class="tx-admin-btn"
        onclick="page('admin')">
        ← Retour administration
      </button>

      <div class="tx-filter">

        <button onclick="loadTransactions('all')">
          Toutes
        </button>

        <button onclick="loadTransactions('deposit')">
          Dépôts
        </button>

        <button onclick="loadTransactions('withdrawal')">
          Retraits
        </button>

        <button onclick="loadTransactions('earning')">
          Gains
        </button>

      </div>

      <div id="transactionsList">
        Chargement des transactions...
      </div>

    </div>
  `;

  await loadTransactions("all");
}


/* Charger les transactions */
async function loadTransactions(filter){

  txCurrentFilter = filter || "all";

  const box =
    document.getElementById("transactionsList");

  if(!box) return;

  box.innerHTML =
    `<div class="tx-empty">Chargement...</div>`;

  let query = sb
    .from("kin_transactions")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(200);

  const result = await query;

  if(result.error){

    box.innerHTML = `
      <div class="tx-card">
        <div class="tx-rejected">
          Impossible de charger les transactions.
        </div>

        <div class="small muted">
          ${esc(result.error.message)}
        </div>
      </div>
    `;

    return;
  }

  let rows = result.data || [];

  /* Filtrage côté interface */
  if(filter !== "all"){

    rows = rows.filter(x => {

      const type = String(
        x.type ||
        x.transaction_type ||
        x.kind ||
        ""
      ).toLowerCase();

      if(filter === "deposit"){
        return type.includes("deposit") ||
               type.includes("depot");
      }

      if(filter === "withdrawal"){
        return type.includes("withdraw") ||
               type.includes("retrait");
      }

      if(filter === "earning"){
        return type.includes("earning") ||
               type.includes("gain");
      }

      return true;
    });
  }

  if(!rows.length){

    box.innerHTML = `
      <div class="tx-empty">
        Aucune transaction trouvée.
      </div>
    `;

    return;
  }

  box.innerHTML = rows.map(x => {

    const amount =
      Number(
        x.amount ||
        x.value ||
        x.total ||
        0
      );

    const type = transactionType(x);

    const status = transactionStatus(
      x.status
    );

    const userId =
      x.user_id ||
      x.member_id ||
      x.profile_id ||
      "—";

    const operator =
      x.operator ||
      x.payment_operator ||
      "—";

    const reference =
      x.reference ||
      x.transaction_id ||
      x.id ||
      "—";

    return `
      <div class="tx-card">

        <div class="tx-title">
          ${esc(type)}
        </div>

        <div class="tx-row">
          <span class="tx-label">
            Montant
          </span>

          <span class="tx-amount">
            ${money(amount)}
          </span>
        </div>

        <div class="tx-row">
          <span class="tx-label">
            Statut
          </span>

          <span>
            ${status}
          </span>
        </div>

        <div class="tx-row">
          <span class="tx-label">
            Opérateur
          </span>

          <span>
            ${esc(operator)}
          </span>
        </div>

        <div class="tx-row">
          <span class="tx-label">
            Membre
          </span>

          <span class="small">
            ${esc(userId)}
          </span>
        </div>

        <div class="tx-row">
          <span class="tx-label">
            Référence
          </span>

          <span class="small">
            ${esc(reference)}
          </span>
        </div>

        <div class="tx-row">
          <span class="tx-label">
            Date
          </span>

          <span class="small">
            ${esc(transactionDate(x))}
          </span>
        </div>

      </div>
    `;

  }).join("");
}


/* =========================================================
   AJOUT DU BOUTON TRANSACTIONS DANS ADMINISTRATION
   ========================================================= */

const ancienRenderAdmin =
  typeof renderAdmin === "function"
    ? renderAdmin
    : null;

if(ancienRenderAdmin){

  renderAdmin = async function(){

    await ancienRenderAdmin();

    if(!isAdmin) return;

    const content =
      document.getElementById("content");

    if(!content) return;

    /* Ne pas ajouter deux fois le bouton */
    if(
      document.getElementById(
        "adminTransactionsButton"
      )
    ){
      return;
    }

    const box =
      document.createElement("div");

    box.className =
      "tx-admin-box";

    box.innerHTML = `
      <h3>
        💳 Gestion des transactions
      </h3>

      <p class="muted">
        Consultez l'historique des dépôts,
        retraits, gains et autres opérations.
      </p>

      <button
        id="adminTransactionsButton"
        class="tx-admin-btn"
        onclick="renderTransactions()">

        💳 Ouvrir les transactions

      </button>
    `;

    content.appendChild(box);
  };
}

/* =========================================================
   FIN RUBRIQUE TRANSACTIONS
   ========================================================= */
</script>

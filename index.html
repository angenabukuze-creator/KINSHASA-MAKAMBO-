<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090b">
<title>KINSHASA BUSINESS 🇨🇩</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#e50914;
  --black:#09090b;
  --dark:#141417;
  --dark2:#1d1d22;
  --white:#fff;
  --gray:#a8a8b3;
  --line:#303038;
  --green:#19c37d;
  --yellow:#f5c542;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--black);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{
  max-width:600px;
  min-height:100vh;
  margin:auto;
  padding-bottom:82px;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,11,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.flag{font-size:30px}
.logo strong{font-size:19px}
.logo small{
  display:block;
  color:var(--gray);
  margin-top:3px;
}
main{padding:15px}
.hidden{display:none!important}

.card{
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}
.hero{
  background:linear-gradient(145deg,#260307,#111116 65%);
  border:1px solid #5c1117;
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
}
.hero h1{margin:0 0 7px;font-size:27px}
.hero p{margin:0;color:#d2d2d7}
.balance{
  font-size:30px;
  font-weight:800;
  margin:13px 0 4px;
}
.muted{color:var(--gray)}
.notice{
  border-left:4px solid var(--red);
  background:#18181c;
  padding:12px;
  border-radius:12px;
  margin-bottom:14px;
  color:#ddd;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.action{
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 10px;
  color:white;
  text-align:center;
}
.action b{display:block;margin-top:7px}
.action span{font-size:25px}
h2{font-size:20px;margin:18px 0 10px}
h3{margin:0 0 8px}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.plan{
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}
.plan-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.kin{
  font-size:22px;
  font-weight:900;
}
.price{
  color:#fff;
  font-size:21px;
  font-weight:800;
}
.gain{
  color:var(--green);
  font-weight:700;
  margin:9px 0;
}
.tag{
  display:inline-block;
  background:#2a2a30;
  color:#ddd;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  margin:3px 3px 0 0;
}
.btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  font-weight:800;
  margin-top:9px;
}
.btn-red{background:var(--red);color:white}
.btn-dark{background:#29292f;color:white;border:1px solid #3a3a42}
.btn-green{background:var(--green);color:#06150f}
.btn-danger{background:#471016;color:#ffb8bd}
.btn-yellow{background:var(--yellow);color:#111}
.btn:disabled{opacity:.45;cursor:not-allowed}

input,select{
  width:100%;
  background:#0f0f12;
  color:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  outline:none;
  margin:5px 0 9px;
}
textarea{
  width:100%;
  min-height:90px;
  background:#0f0f12;
  color:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  outline:none;
}
label{
  display:block;
  font-size:13px;
  color:#c9c9cf;
  margin-top:8px;
}
.pay{
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  margin:8px 0;
  background:#111115;
}
.pay strong{font-size:16px}
.pay .number{
  font-size:20px;
  font-weight:900;
  margin:5px 0;
}
.pay small{color:#aaa}

.nav{
  position:fixed;
  z-index:30;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(600px,100%);
  background:#111114;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
}
.nav button{
  background:none;
  border:0;
  color:#9999a2;
  font-size:11px;
  padding:6px 2px;
}
.nav button.active{color:white}
.nav span{display:block;font-size:21px;margin-bottom:2px}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.auth-box{
  width:100%;
  max-width:430px;
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
}
.auth-logo{text-align:center;margin-bottom:20px}
.auth-logo .flag{font-size:45px}
.auth-logo h1{margin:7px 0}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#0c0c0f;
  border-radius:12px;
  padding:4px;
  margin-bottom:15px;
}
.tabs button{
  border:0;
  background:none;
  color:#aaa;
  padding:10px;
  border-radius:9px;
}
.tabs button.active{background:var(--red);color:white}
.msg{
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  font-size:14px;
}
.msg.ok{background:#103c2b;color:#8ff0c4}
.msg.err{background:#42151a;color:#ffb9be}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal-box{
  width:min(600px,100%);
  background:#151519;
  border-radius:22px 22px 0 0;
  padding:18px;
  max-height:92vh;
  overflow:auto;
}
.close{
  float:right;
  background:#29292f;
  color:white;
  border:0;
  border-radius:50%;
  width:35px;
  height:35px;
}
.stat{
  background:#111115;
  border:1px solid var(--line);
  padding:13px;
  border-radius:14px;
}
.stat b{font-size:19px;display:block}
.admin-title{
  color:#ff5a62;
  font-weight:900;
}
.member{
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  margin:8px 0;
  background:#111115;
}
.small{font-size:12px}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
.status.pending{background:#4a3b0b;color:#ffd95c}
.status.approved{background:#103c2b;color:#8ff0c4}
.status.rejected{background:#42151a;color:#ffb9be}
.status.blocked{background:#42151a;color:#ffb9be}
.status.active{background:#103c2b;color:#8ff0c4}
.admin-tabs{
  display:flex;
  overflow:auto;
  gap:7px;
  padding:4px 0 10px;
}
.admin-tabs button{
  white-space:nowrap;
  background:#222229;
  color:#ddd;
  border:1px solid #373740;
  padding:9px 12px;
  border-radius:10px;
}
.admin-tabs button.active{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}
.danger-box{
  border:1px solid #64131a;
  background:#211013;
  border-radius:14px;
  padding:13px;
}
.success-box{
  border:1px solid #165f43;
  background:#0e251d;
  border-radius:14px;
  padding:13px;
}
@media(min-width:601px){
  .nav{border-radius:18px 18px 0 0}
}
</style>
</head>

<body>

<div id="auth" class="auth">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="flag">🇨🇩</div>
      <h1>KINSHASA BUSINESS</h1>
      <div class="muted">République démocratique du Congo</div>
    </div>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showAuth('login')">Connexion</button>
      <button id="signupTab" onclick="showAuth('signup')">Inscription</button>
    </div>

    <div id="authMsg"></div>

    <label>Email</label>
    <input id="email" type="email" placeholder="Votre adresse email">

    <label>Mot de passe</label>
    <input id="password" type="password" placeholder="Mot de passe">

    <div id="signupFields" class="hidden">
      <label>Nom</label>
      <input id="name" type="text" placeholder="Votre nom">
    </div>

    <button id="authBtn" class="btn btn-red" onclick="submitAuth()">
      Se connecter
    </button>

    <button class="btn btn-dark" onclick="githubLogin()">
      Continuer avec GitHub
    </button>
  </div>
</div>

<div id="app" class="app hidden">

<header>
  <div class="logo">
    <div class="flag">🇨🇩</div>
    <div>
      <strong>KINSHASA BUSINESS</strong>
      <small>République démocratique du Congo</small>
    </div>
  </div>
</header>

<main id="content"></main>

<nav class="nav">
  <button id="nav-home" onclick="page('home')">
    <span>⌂</span>Accueil
  </button>
  <button id="nav-products" onclick="page('products')">
    <span>▣</span>Produits
  </button>
  <button id="nav-tasks" onclick="page('tasks')">
    <span>✓</span>Tâches
  </button>
  <button id="nav-team" onclick="page('team')">
    <span>♧</span>Équipe
  </button>
  <button id="nav-profile" onclick="page('profile')">
    <span>●</span>Profil
  </button>
</nav>

</div>

<div id="modal"></div>

<script>
const SUPABASE_URL =
  "https://uewceocdzvekuopgsmpg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";

const sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ADMIN_EMAIL="angenabukuze@gmail.com";

const PAYMENTS=[
  {
    operator:"AIRTEL MONEY",
    number:"973087965",
    name:"YVETTE"
  },
  {
    operator:"ORANGE MONEY",
    number:"899532643",
    name:"JEANCQUELINE"
  },
  {
    operator:"M-PESA",
    number:"0861823718",
    name:"REGINA"
  }
];

const PLANS=[
  {id:"KIN1",price:15000,gain:2000,days:60,max:1},
  {id:"KIN2",price:30000,gain:4400,days:60,max:2},
  {id:"KIN3",price:80000,gain:12300,days:60,max:3},
  {id:"KIN4",price:150000,gain:24000,days:60,max:3},
  {id:"KIN5",price:300000,gain:52000,days:60,max:5},
  {id:"KIN6",price:600000,gain:120000,days:60,max:2},
  {id:"KIN7",price:1500000,gain:330000,days:60,max:2}
];

let user=null;
let profile=null;
let wallet=null;
let currentPage="home";
let isAdmin=false;
let adminSection="overview";

const money=n=>
  Number(n||0).toLocaleString("fr-FR")+" FC";

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function msg(text,type="ok"){
  return `<div class="msg ${type}">${esc(text)}</div>`;
}

function showAuth(type){
  const login=type==="login";

  document.getElementById("loginTab")
    .classList.toggle("active",login);

  document.getElementById("signupTab")
    .classList.toggle("active",!login);

  document.getElementById("signupFields")
    .classList.toggle("hidden",login);

  document.getElementById("authBtn").textContent=
    login?"Se connecter":"Créer mon compte";

  document.getElementById("authMsg").innerHTML="";
}

async function submitAuth(){

  const email=
    document.getElementById("email").value.trim();

  const password=
    document.getElementById("password").value;

  const name=
    document.getElementById("name").value.trim();

  if(!email||!password){
    document.getElementById("authMsg").innerHTML=
      msg("Email et mot de passe obligatoires","err");
    return;
  }

  const signup=
    !document.getElementById("signupFields")
    .classList.contains("hidden");

  document.getElementById("authBtn").disabled=true;

  try{

    if(signup){

      const {data,error}=
        await sb.auth.signUp({
          email,
          password,
          options:{
            data:{name}
          }
        });

      if(error)throw error;

      if(data.user){

        await sb.from("profiles").upsert({
          id:data.user.id,
          full_name:name||"Membre",
          role:"member"
        });

        await sb.from("kin_wallets").upsert({
          user_id:data.user.id,
          balance:2000,
          total_earnings:0
        });

        document.getElementById("authMsg").innerHTML=
          msg(
            "Inscription réussie ! Vous pouvez maintenant utiliser votre compte."
          );
      }

    }else{

      const {error}=
        await sb.auth.signInWithPassword({
          email,
          password
        });

      if(error)throw error;
    }

  }catch(e){

    document.getElementById("authMsg").innerHTML=
      msg(
        e.message||"Une erreur est survenue",
        "err"
      );

  }finally{

    document.getElementById("authBtn").disabled=false;
  }
}

async function githubLogin(){

  const {error}=
    await sb.auth.signInWithOAuth({
      provider:"github",
      options:{
        redirectTo:location.href
      }
    });

  if(error){
    document.getElementById("authMsg").innerHTML=
      msg(error.message,"err");
  }
}

async function loadUser(){

  const {data}=await sb.auth.getUser();

  user=data.user;

  if(!user){

    document.getElementById("auth")
      .classList.remove("hidden");

    document.getElementById("app")
      .classList.add("hidden");

    return;
  }

  await loadData();

  document.getElementById("auth")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  page("home");
}

async function loadData(){

  if(!user)return;

  const p=await sb
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  profile=p.data||{
    id:user.id,
    full_name:user.user_metadata?.name||"Membre",
    role:"member"
  };

  isAdmin=
    profile.role==="admin"||
    user.email?.toLowerCase()===
    ADMIN_EMAIL.toLowerCase();

  const w=await sb
    .from("kin_wallets")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();

  wallet=w.data||{
    balance:2000,
    total_earnings:0
  };
}

function navActive(name){

  document.querySelectorAll(".nav button")
    .forEach(x=>x.classList.remove("active"));

  const el=
    document.getElementById("nav-"+name);

  if(el)el.classList.add("active");
}

function page(name){

  currentPage=name;

  if(name==="admin"&&!isAdmin){
    name="profile";
  }

  navActive(
    name==="products"?"products":
    name==="tasks"?"tasks":
    name==="team"?"team":
    name==="profile"?"profile":"home"
  );

  if(name==="home")renderHome();
  if(name==="products")renderProducts();
  if(name==="tasks")renderTasks();
  if(name==="team")renderTeam();
  if(name==="profile")renderProfile();
  if(name==="admin")renderAdmin();
}

function renderHome(){

  const c=
    document.getElementById("content");

  c.innerHTML=`

    <section class="hero">

      <h1>Bienvenue 🇨🇩</h1>

      <p>
        ${esc(profile?.full_name||"Membre")}
        · KINSHASA BUSINESS
      </p>

      <div class="balance">
        ${money(wallet?.balance)}
      </div>

      <div class="muted">
        Solde disponible
      </div>

      <div class="row" style="margin-top:15px">

        <div>
          <small class="muted">
            Gains cumulés
          </small>

          <div>
            <b>${money(wallet?.total_earnings)}</b>
          </div>
        </div>

        <div>🇨🇩</div>

      </div>

    </section>

    <div class="notice">
      📢 Bienvenue sur
      <b>KINSHASA BUSINESS</b>.
      Les montants affichés sont les paramètres déclarés
      des produits et ne constituent pas une garantie.
    </div>

    <div class="grid">

      <button class="action"
        onclick="openDeposit()">
        <span>＋</span>
        <b>Dépôt</b>
      </button>

      <button class="action"
        onclick="openWithdraw()">
        <span>↗</span>
        <b>Retrait</b>
      </button>

      <button class="action"
        onclick="page('tasks')">
        <span>✓</span>
        <b>Pointage</b>
      </button>

      <button class="action"
        onclick="page('team')">
        <span>♧</span>
        <b>Équipe</b>
      </button>

    </div>

    <h2>Nos KIN</h2>

    ${PLANS.slice(0,3)
      .map(planMini)
      .join("")}

    <button class="btn btn-red"
      onclick="page('products')">
      Voir tous les KIN
    </button>
  `;
}

function planMini(p){

  return `
  <div class="plan">

    <div class="plan-top">
      <div class="kin">${p.id}</div>
      <div class="price">
        ${money(p.price)}
      </div>
    </div>

    <div class="gain">
      Gain affiché :
      ${money(p.gain)} / jour
    </div>

    <span class="tag">
      ${p.days} jours
    </span>

    <span class="tag">
      Maximum : ${p.max}
    </span>

  </div>`;
}

function renderProducts(){

  document.getElementById("content")
    .innerHTML=`

    <h2>Produits KIN</h2>

    <div class="notice">
      Les montants sont les paramètres déclarés
      des produits.
    </div>

    ${PLANS.map(p=>`

      <div class="plan">

        <div class="plan-top">
          <div class="kin">${p.id}</div>
          <div class="price">
            ${money(p.price)}
          </div>
        </div>

        <div class="gain">
          Gain affiché :
          ${money(p.gain)} / jour
        </div>

        <span class="tag">
          ${p.days} jours
        </span>

        <span class="tag">
          Maximum ${p.max}
        </span>

        <button class="btn btn-red"
          onclick="requestKin('${p.id}')">
          Demander ${p.id}
        </button>

      </div>

    `).join("")}
  `;
}

async function requestKin(id){

  const p=PLANS.find(x=>x.id===id);

  if(!p)return;

  showModal(`

    <button class="close"
      onclick="closeModal()">×</button>

    <h2>Demande ${p.id}</h2>

    <p>
      Prix :
      <b>${money(p.price)}</b>
    </p>

    <p>
      Gain affiché/jour :
      <b>${money(p.gain)}</b>
    </p>

    <p class="muted">
      L'attribution définitive doit être
      validée par l'administration.
    </p>

    <button class="btn btn-red"
      onclick="closeModal()">
      Fermer
    </button>

  `);
}

function renderTasks(){

  document.getElementById("content")
    .innerHTML=`

    <h2>Tâches & Pointage</h2>

    <div class="card center">

      <div style="font-size:45px">
        ✓
      </div>

      <h3>
        Pointage quotidien
      </h3>

      <p class="muted">
        1 pointage maximum par jour.
      </p>

      <p>
        Récompense déclarée :
        <b style="color:var(--green)">
          20 FC
        </b>
      </p>

      <button class="btn btn-red"
        onclick="checkin()">
        Faire mon pointage
      </button>

    </div>

    <div class="card">

      <h3>Horaires</h3>

      <p class="muted">
        Lundi à dimanche
      </p>

      <b>
        08:00 – 19:00
      </b>

    </div>
  `;
}

async function checkin(){

  const today=
    new Date().toISOString().slice(0,10);

  try{

    const {error}=
      await sb
      .from("kin_daily_checkins")
      .insert({
        user_id:user.id,
        checkin_date:today,
        reward:20
      });

    if(error){

      if(error.code==="23505"){
        alert(
          "Vous avez déjà effectué votre pointage aujourd'hui."
        );
      }else{
        alert(error.message);
      }

      return;
    }

    alert(
      "Pointage enregistré."
    );

  }catch(e){

    alert(e.message);
  }
}

function renderTeam(){

  const code=
    "KIN"+
    user.id
      .replaceAll("-","")
      .slice(0,8)
      .toUpperCase();

  const link=
    location.origin+
    location.pathname+
    "?ref="+code;

  document.getElementById("content")
    .innerHTML=`

    <h2>Mon équipe</h2>

    <div class="card">

      <h3>
        Mon code de parrainage
      </h3>

      <div style="
        font-size:24px;
        font-weight:900;
        margin:12px 0">
        ${code}
      </div>

      <button class="btn btn-red"
        onclick="copyText('${code}')">

async function submitDeposit(){

  const amount=
    Number(
      document.getElementById("depAmount").value
    );

  const ref=
    document.getElementById("depRef")
    .value.trim();

  const operator=
    PAYMENTS[
      Number(
        document.getElementById("depOperator").value
      )
    ];

  if(amount<15000){

    alert(
      "Le dépôt minimum est de 15 000 FC."
    );

    return;
  }

  try{

    const {error}=
      await sb
      .from("kin_deposit_requests")
      .insert({
        user_id:user.id,
        amount,
        operator:operator.operator,
        payment_number:operator.number,
        payment_name:operator.name,
        reference:ref||null,
        status:"pending"
      });

    if(error)throw error;

    closeModal();

    alert(
      "Demande de dépôt envoyée."
    );

  }catch(e){

    alert(
      "Impossible d'envoyer la demande : "+
      e.message
    );
  }
}

async function submitWithdraw(){

  const amount=
    Number(
      document.getElementById("wdAmount").value
    );

  const operator=
    PAYMENTS[
      Number(
        document.getElementById("wdOperator").value
      )
    ];

  const number=
    document.getElementById("wdNumber")
    .value.trim();

  if(amount<2000){

    alert(
      "Le retrait minimum est de 2 000 FC."
    );

    return;
  }

  if(amount>
    Number(wallet?.balance||0)){

    alert("Solde insuffisant.");

    return;
  }

  if(!number){

    alert(
      "Entrez votre numéro de réception."
    );

    return;
  }

  const fee=amount*0.10;
  const net=amount-fee;

  try{

    const {error}=
      await sb
      .from("kin_withdrawal_requests")
      .insert({
        user_id:user.id,
        amount,
        fee,
        net_amount:net,
        operator:operator.operator,
        payment_number:number,
        status:"pending"
      });

    if(error)throw error;

    closeModal();

    alert(
      "Demande envoyée.\n\n"+
      "Montant : "+money(amount)+
      "\nFrais 10% : "+money(fee)+
      "\nNet : "+money(net)
    );

  }catch(e){

    alert(
      "Impossible d'envoyer la demande : "+
      e.message
    );
  }
}

function statusBadge(status){

  const s=
    String(status||"pending")
    .toLowerCase();

  let cls="pending";

  if(
    s==="approved"||
    s==="validated"||
    s==="valid"
  )cls="approved";

  if(
    s==="rejected"||
    s==="refused"
  )cls="rejected";

  return `
    <span class="status ${cls}">
      ${esc(status||"pending")}
    </span>
  `;
}

function formatDate(v){

  if(!v)return"—";

  try{

    return new Date(v)
      .toLocaleString(
        "fr-FR",
        {
          dateStyle:"short",
          timeStyle:"short"
        }
      );

  }catch(e){

    return String(v);
  }
}

function showModal(html){

  document.getElementById("modal")

}

function closeModal(){

}

async function copyText(text){

  try{

    await navigator.clipboard
      .writeText(text);

    alert("Copié !");

  }catch(e){

    alert(text);
  }
}

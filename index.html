<style>

*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:600px;min-height:100vh;margin:auto;padding-bottom:82px}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
.logo{display:flex;align-items:center;gap:10px}

.card{background:var(--dark);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(145deg,#260307,#111116 65%);border:1px solid #5c1117;border-radius:22px;padding:20px;margin-bottom:14px}

.hero p{margin:0;color:#d2d2d7}
.balance{font-size:30px;font-weight:800;margin:13px 0 4px}

.notice{border-left:4px solid var(--red);background:#18181c;padding:12px;border-radius:12px;margin-bottom:14px;color:#ddd}

input,select{width:100%;background:#0f0f12;color:white;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;margin:5px 0 9px}
label{display:block;font-size:13px;color:#c9c9cf;margin-top:8px}

.pay .number{font-size:20px;font-weight:900;margin:5px 0;color:#fff}

</style>

<script>

const SUPABASE_KEY="sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="angenabukuze@gmail.com";

const PAYMENTS=[

 {operator:"M-PESA",number:"0861823718",name:"REGINA"}

let user=null,profile=null,wallet=null,currentPage="home",isAdmin=false;

function esc(v){
 return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
 .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function msg(text,type="ok"){return `<div class="msg ${type}">${esc(text)}</div>`}

function showAuth(type){
 const login=type==="login";
 document.getElementById("loginTab").classList.toggle("active",login);
 document.getElementById("signupTab").classList.toggle("active",!login);
 document.getElementById("signupFields").classList.toggle("hidden",login);
 document.getElementById("authBtn").textContent=login?"Se connecter":"Créer mon compte";
 document.getElementById("authMsg").innerHTML="";
}

async function submitAuth(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const name=document.getElementById("name").value.trim();
 if(!email||!password){
  document.getElementById("authMsg").innerHTML=msg("Email et mot de passe obligatoires","err");return;
 }
 const signup=!document.getElementById("signupFields").classList.contains("hidden");
 document.getElementById("authBtn").disabled=true;
 try{
  if(signup){
   const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});
   if(error)throw error;
   if(data.user){
    const p=await sb.from("profiles").upsert({id:data.user.id,full_name:name||"Membre",role:"member"});
    if(p.error)throw p.error;
    const w=await sb.from("kin_wallets").upsert({user_id:data.user.id,balance:2000,total_earnings:0});
    if(w.error)throw w.error;
    document.getElementById("authMsg").innerHTML=msg("Inscription réussie ! Vous pouvez maintenant utiliser votre compte.");
   }
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error;
  }
 }catch(e){
  document.getElementById("authMsg").innerHTML=msg(e.message||"Une erreur est survenue","err");
 }finally{document.getElementById("authBtn").disabled=false}
}

async function githubLogin(){
 const {error}=await sb.auth.signInWithOAuth({provider:"github",options:{redirectTo:location.href}});
 if(error)document.getElementById("authMsg").innerHTML=msg(error.message,"err");
}

async function loadUser(){
 const {data}=await sb.auth.getUser();
 user=data.user;
 if(!user){
  document.getElementById("auth").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");return;
 }
 await loadData();
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 page("home");
}

async function loadData(){
 if(!user)return;
 const p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 profile=p.data||{id:user.id,full_name:user.user_metadata?.name||"Membre",role:"member"};
 isAdmin=profile.role==="admin"||user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();
 const w=await sb.from("kin_wallets").select("*").eq("user_id",user.id).maybeSingle();
 wallet=w.data||{balance:2000,total_earnings:0};
}

function navActive(name){
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 const el=document.getElementById("nav-"+name);if(el)el.classList.add("active");
}

function page(name){
 currentPage=name;
 if(name==="admin"&&!isAdmin)name="profile";
 navActive(name==="products"?"products":name==="tasks"?"tasks":name==="team"?"team":name==="history"?"history":name==="profile"?"profile":"home");

 if(name==="tasks")renderTasks();
 if(name==="team")renderTeam();
 if(name==="history")renderHistory();

}

/* HISTORIQUE DES TRANSACTIONS DU MEMBRE */
function historyDate(row){
 const raw=row.created_at||row.createdAt||row.transaction_date||row.date||row.updated_at;
 if(!raw)return "Date non disponible";
 const d=new Date(raw);
 if(Number.isNaN(d.getTime()))return esc(raw);
 return d.toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
}
function historyStatus(row){
 const s=String(row.status||row.state||"enregistré").toLowerCase();
 if(["approved","validated","validé","completed","success","paid"].includes(s))return "Validé";
 if(["rejected","refused","rejeté","cancelled","canceled"].includes(s))return "Rejeté";
 if(["pending","en attente","processing","en_cours"].includes(s))return "En attente";
 return s;
}
function historyKind(row,fallback){
 const raw=String(row.type||row.transaction_type||row.kind||row.category||row.reason||fallback||"transaction").toLowerCase();
 if(raw.includes("deposit")||raw.includes("dépôt")||raw.includes("depot"))return "Dépôt";
 if(raw.includes("withdraw")||raw.includes("retrait"))return "Retrait";
 if(raw.includes("commission"))return "Commission";
 if(raw.includes("bonus")||raw.includes("signup"))return "Bonus";
 if(raw.includes("revenue")||raw.includes("revenu")||raw.includes("earning")||raw.includes("gain"))return "Revenu";
 if(raw.includes("checkin")||raw.includes("pointage"))return "Pointage";
 if(raw.includes("kin")||raw.includes("invest"))return "Achat KIN";
 return raw.charAt(0).toUpperCase()+raw.slice(1);
}
async function renderHistory(){
 if(!user){page("profile");return}
 const c=document.getElementById("content");
 c.innerHTML=`<h2>📚 Historique des transactions</h2>
 <div class="notice">Toutes les opérations disponibles de votre compte : dépôts, retraits, revenus, commissions, bonus et pointages. La date, l'heure, le montant et le statut sont affichés lorsque ces informations sont enregistrées.</div>
 <div class="grid"><div class="stat"><span class="muted">Solde actuel</span><b>${money(wallet?.balance)}</b></div>
 <div class="stat"><span class="muted">Gains cumulés</span><b>${money(wallet?.total_earnings)}</b></div></div>
 <div id="historyList" class="card" style="margin-top:12px">Chargement de l'historique…</div>
 <button class="btn btn-dark" onclick="renderHistory()">↻ Actualiser l'historique</button>`;
 const tables=[
  {name:"kin_transactions",fallback:"transaction"},
  {name:"kin_deposit_requests",fallback:"deposit"},
  {name:"kin_withdrawal_requests",fallback:"withdrawal"},
  {name:"kin_daily_checkins",fallback:"checkin"}
 ];
 const all=[];
 for(const t of tables){
  try{
   const {data,error}=await sb.from(t.name).select("*").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100);
   if(!error&&Array.isArray(data))for(const row of data)all.push({...row,__source:t.name,__fallback:t.fallback});
  }catch(e){}
 }
 const list=document.getElementById("historyList");
 if(!list)return;
 if(!all.length){
  list.innerHTML=`<div class="center"><div style="font-size:36px">📭</div><b>Aucune transaction enregistrée</b>
  <p class="muted small">Les opérations apparaîtront ici lorsqu'elles seront enregistrées dans les tables de votre compte.</p></div>`;
  return;
 }
 all.sort((a,b)=>new Date(b.created_at||b.transaction_date||b.date||0)-new Date(a.created_at||a.transaction_date||a.date||0));
 list.innerHTML=all.map(row=>{
  const kind=historyKind(row,row.__fallback);
  const status=historyStatus(row);
  const amount=Number(row.amount??row.value??row.reward??row.daily_gain??0);
  const note=row.description||row.note||row.reference||row.payment_name||row.operator||row.plan_id||row.kin_id||"";
  const positive=["Commission","Bonus","Revenu","Pointage"].includes(kind);
  return `<div class="member">
   <div class="row"><b>${esc(kind)}</b><span class="tag">${esc(status)}</span></div>
   <div class="row" style="margin-top:8px"><strong style="color:${positive?'var(--green)':'white'}">${positive?"+":""}${money(amount)}</strong><span class="small muted">${historyDate(row)}</span></div>
   ${note?`<div class="small muted" style="margin-top:6px">${esc(note)}</div>`:""}
   <div class="small muted" style="margin-top:4px">Enregistrement : ${esc(row.__source)}</div>
  </div>`;
 }).join("");
}

async function openDeposit(){
 showModal(`<button class="close" onclick="closeModal()">×</button><h2>💰 Dépôt</h2>
 <div class="notice">Dépôt minimum : <b>15 000 FC</b></div>
 <label>Montant</label><input id="depAmount" type="number" min="15000" placeholder="Ex : 15000">
 <label>Opérateur</label><select id="depOperator">${PAYMENTS.map((p,i)=>`<option value="${i}">${p.operator} — ${p.number} — ${p.name}</option>`).join("")}</select>
 <div id="paymentInfo"></div><label>Référence du transfert</label><input id="depRef" placeholder="Référence ou nom du transfert">
 <button class="btn btn-red" onclick="submitDeposit()">Envoyer la demande</button>`);
 updatePaymentInfo();
 document.getElementById("depOperator").addEventListener("change",updatePaymentInfo);
}
function updatePaymentInfo(){
 const s=document.getElementById("depOperator"),box=document.getElementById("paymentInfo");
 if(!s||!box)return;
 const p=PAYMENTS[Number(s.value)];
 box.innerHTML=`<div class="pay"><strong>${p.operator}</strong><div class="number">${p.number}</div><small>Nom : ${p.name} · Transfert</small>
 <button class="btn btn-dark" onclick="copyText('${p.number}')">Copier le numéro</button></div>`;
}
async function submitDeposit(){
 const amount=Number(document.getElementById("depAmount").value);
 const ref=document.getElementById("depRef").value.trim();
 const operator=PAYMENTS[Number(document.getElementById("depOperator").value)];
 if(amount<15000){alert("Le dépôt minimum est de 15 000 FC.");return}
 try{
  const {error}=await sb.from("kin_deposit_requests").insert({user_id:user.id,amount,operator:operator.operator,payment_number:operator.number,payment_name:operator.name,reference:ref||null,status:"pending"});
  if(error)throw error;
  closeModal();alert("Demande de dépôt envoyée. La validation sera effectuée par l'administration.");
  page("history");
 }catch(e){alert("Impossible d'envoyer la demande : "+e.message)}
}

async function openWithdraw(){
 showModal(`<button class="close" onclick="closeModal()">×</button><h2>💸 Retrait</h2>
 <div class="notice">Retrait minimum : <b>2 000 FC</b>. Frais affichés : 10 %.</div>
 <label>Montant</label><input id="wdAmount" type="number" min="2000" placeholder="Montant en FC">
 <label>Opérateur de réception</label><select id="wdOperator">${PAYMENTS.map((p,i)=>`<option value="${i}">${p.operator}</option>`).join("")}</select>
 <label>Votre numéro de réception</label><input id="wdNumber" placeholder="Numéro où recevoir le retrait">
 <button class="btn btn-red" onclick="submitWithdraw()">Envoyer la demande</button>`);
}
async function submitWithdraw(){
 const amount=Number(document.getElementById("wdAmount").value);
 const operator=PAYMENTS[Number(document.getElementById("wdOperator").value)];
 const number=document.getElementById("wdNumber").value.trim();
 if(amount<2000){alert("Le retrait minimum est de 2 000 FC.");return}
 if(amount>Number(wallet?.balance||0)){alert("Solde insuffisant.");return}
 if(!number){alert("Entrez votre numéro de réception.");return}
 const fee=amount*0.10,net=amount-fee;
 try{
  const {error}=await sb.from("kin_withdrawal_requests").insert({user_id:user.id,amount,fee,net_amount:net,operator:operator.operator,payment_number:number,status:"pending"});
  if(error)throw error;
  closeModal();
  alert("Demande de retrait envoyée.\nMontant : "+money(amount)+"\nFrais 10 % : "+money(fee)+"\nNet indicatif : "+money(net));
  page("history");
 }catch(e){alert("Impossible d'envoyer la demande : "+e.message)}
}

/* ESPACE ADMINISTRATEUR : consultation des membres et demandes */
async function renderAdmin(){
 if(!isAdmin){page("profile");return}
 document.getElementById("content").innerHTML=`<h2 class="admin-title">⚙ Administration</h2>
 <div class="notice">Les validations financières, blocages, changements de solde et réinitialisations de mot de passe nécessitent des fonctions serveur sécurisées. Ne valide pas une transaction simplement en modifiant le navigateur.</div>
 <div class="grid"><div class="stat"><span class="muted">Compte</span><b>ADMIN</b></div><div class="stat"><span class="muted">Email</span><b class="small">${esc(user.email)}</b></div></div>
 <h2>Membres</h2><div id="members">Chargement…</div>
 <h2>Dépôts en attente</h2><div id="deposits">Chargement…</div>
 <h2>Retraits en attente</h2><div id="withdrawals">Chargement…</div>
 <div class="card"><h3>Paramètres actuels</h3><p>Plateforme : <b>KINSHASA BUSINESS</b></p><p>Retrait minimum : <b>2 000 FC</b></p><p>Dépôt minimum : <b>15 000 FC</b></p><p>Pointage : <b>20 FC / jour</b></p>
 <p class="muted small">Les boutons de validation/rejet et les actions sur les comptes ne sont pas activés dans cette version, afin d'éviter des opérations financières non sécurisées.</p></div>`;
 await loadAdminData();
}
async function loadAdminData(){
 const members=document.getElementById("members"),deposits=document.getElementById("deposits"),withdrawals=document.getElementById("withdrawals");
 const m=await sb.from("profiles").select("*").order("created_at",{ascending:false});
 if(m.error)members.innerHTML=msg(m.error.message,"err");
 else members.innerHTML=(m.data||[]).map(x=>`<div class="member"><b>${esc(x.full_name||"Membre")}</b><div class="muted small">${esc(x.id)}</div><div>Rôle : <b>${esc(x.role||"member")}</b></div></div>`).join("")||`<div class="muted">Aucun membre trouvé.</div>`;
 const d=await sb.from("kin_deposit_requests").select("*").eq("status","pending").order("created_at",{ascending:false});
 if(d.error)deposits.innerHTML=msg(d.error.message,"err");
 else deposits.innerHTML=(d.data||[]).map(x=>`<div class="member"><b>${money(x.amount)}</b><div>${esc(x.operator||"")}</div><div class="small muted">Numéro : ${esc(x.payment_number||"")}</div><div class="small">Référence : ${esc(x.reference||"—")}</div><div class="small muted">${historyDate(x)}</div></div>`).join("")||`<div class="muted">Aucun dépôt en attente.</div>`;
 const w=await sb.from("kin_withdrawal_requests").select("*").eq("status","pending").order("created_at",{ascending:false});
 if(w.error)withdrawals.innerHTML=msg(w.error.message,"err");
 else withdrawals.innerHTML=(w.data||[]).map(x=>`<div class="member"><b>${money(x.amount)}</b><div>Net après frais : <b>${money(x.net_amount)}</b></div><div>${esc(x.operator||"")}</div><div>Numéro de réception : ${esc(x.payment_number||"")}</div><div class="small muted">${historyDate(x)}</div></div>`).join("")||`<div class="muted">Aucun retrait en attente.</div>`;
}

function showModal(html){
 document.getElementById("modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`;
}
function closeModal(){document.getElementById("modal").innerHTML=""}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);alert("Copié !")}
 catch(e){alert(text)}
}
async function logout(){
 await sb.auth.signOut();user=null;profile=null;wallet=null;
 document.getElementById("app").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
}
sb.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_IN"&&session)setTimeout(loadUser,100);
 if(event==="SIGNED_OUT"){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
 }
});
loadUser();
</script>

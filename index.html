<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#09090b">
<title>KINSHASA BUSINESS 🇨🇩</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --red:#e50914;
 --red2:#ff303a;
 --black:#09090b;
 --dark:#141417;
 --dark2:#1d1d22;
 --white:#fff;
 --gray:#aaaab4;
 --line:#303038;
 --green:#19c37d;
 --yellow:#f5c542;
 --blue:#248cff;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--black);
 color:var(--white);
 font-family:Arial,Helvetica,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:720px;min-height:100vh;margin:auto;padding-bottom:90px}
header{
 position:sticky;
 top:0;
 z-index:20;
 background:rgba(9,9,11,.97);
 backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);
 padding:13px 15px;
}
.logo{display:flex;align-items:center;gap:10px}
.flag{font-size:30px}
.logo strong{font-size:19px}
.logo small{display:block;color:var(--gray);margin-top:3px}
main{padding:15px}
h1,h2,h3{margin-top:0}
h2{font-size:21px;margin:18px 0 11px}
p{line-height:1.45}
.muted{color:var(--gray)}
.small{font-size:12px}
.card,.plan,.request,.member,.pay,.stat{
 background:var(--dark);
 border:1px solid var(--line);
 border-radius:17px;
 padding:15px;
 margin-bottom:12px;
}
.hero{
 background:linear-gradient(145deg,#380309,#111116 70%);
 border:1px solid #65151b;
 border-radius:22px;
 padding:20px;
 margin-bottom:14px;
}
.hero h1{font-size:27px;margin-bottom:6px}
.balance{font-size:31px;font-weight:900;margin:13px 0 3px}
.notice{
 border-left:4px solid var(--red);
 background:#18181c;
 padding:12px;
 border-radius:12px;
 margin-bottom:14px;
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{
 background:var(--dark);
 border:1px solid var(--line);
 border-radius:16px;
 padding:15px 8px;
 color:white;
 text-align:center;
}
.action span{font-size:25px}
.action b{display:block;margin-top:7px}
.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.plan-top,.member-head{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:10px;
}
.kin{font-size:22px;font-weight:900}
.price{font-size:20px;font-weight:900}
.gain{color:var(--green);font-weight:800;margin:8px 0}
.tag{
 display:inline-block;
 background:#292930;
 color:#ddd;
 border-radius:20px;
 padding:5px 9px;
 font-size:12px;
 margin:3px 3px 0 0;
}
.btn{
 width:100%;
 border:0;
 border-radius:13px;
 padding:13px;
 font-weight:800;
 margin-top:8px;
}
.btn-small{width:auto;padding:8px 10px;font-size:12px;margin:4px 3px 0 0}
.btn-red{background:var(--red);color:white}
.btn-dark{background:#29292f;color:white;border:1px solid #3a3a42}
.btn-green{background:var(--green);color:#06150f}
.btn-blue{background:var(--blue);color:white}
.btn-yellow{background:var(--yellow);color:#171200}
.btn-danger{background:#471016;color:#ffb8bd}
.btn:disabled{opacity:.45}
input,select,textarea{
 width:100%;
 background:#0f0f12;
 color:white;
 border:1px solid var(--line);
 border-radius:12px;
 padding:12px;
 margin:5px 0 9px;
 outline:none;
}
textarea{min-height:90px}
label{
 display:block;
 color:#ccc;
 font-size:13px;
 margin-top:8px;
}
.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 font-weight:800;
}
.status.pending{background:#493b0b;color:#ffe36d}
.status.approved{background:#103c2b;color:#8ff0c4}
.status.rejected,.status.blocked{background:#42151a;color:#ffb9be}
.status.active{background:#103c2b;color:#8ff0c4}
.msg{padding:10px;border-radius:10px;margin:8px 0;font-size:14px}
.msg.ok{background:#103c2b;color:#8ff0c4}
.msg.err{background:#42151a;color:#ffb9be}
.admin-title{font-size:25px;color:#ff5a62;font-weight:900}
.admin-menu{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 margin:12px 0;
}
.admin-menu button{
 background:#1b1b20;
 border:1px solid var(--line);
 color:white;
 border-radius:13px;
 padding:12px 5px;
 font-size:12px;
 font-weight:800;
}
.admin-menu button.active{background:var(--red);border-color:var(--red)}
.stat b{display:block;font-size:20px;margin-top:5px}
.nav{
 position:fixed;
 z-index:30;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(720px,100%);
 background:#111114;
 border-top:1px solid var(--line);
 display:grid;
 grid-template-columns:repeat(5,1fr);
 padding:8px 5px calc(8px + env(safe-area-inset-bottom));
}
.nav button{
 background:none;
 border:0;
 color:#9999a2;
 font-size:11px;
 padding:6px 2px;
}
.nav button.active{color:white}
.nav span{display:block;font-size:21px;margin-bottom:2px}
.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}
.auth-box{
 width:100%;
 max-width:430px;
 background:var(--dark);
 border:1px solid var(--line);
 border-radius:24px;
 padding:22px;
}
.auth-logo{text-align:center;margin-bottom:20px}
.auth-logo .flag{font-size:45px}
.tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 background:#0c0c0f;
 border-radius:12px;
 padding:4px;
 margin-bottom:15px;
}
.tabs button{
 border:0;
 background:none;
 color:#aaa;
 padding:10px;
 border-radius:9px;
}
.tabs button.active{background:var(--red);color:white}
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.82);
 z-index:50;
 display:flex;
 align-items:flex-end;
 justify-content:center;
}
.modal-box{
 width:min(720px,100%);
 max-height:94vh;
 overflow:auto;
 background:#151519;
 border-radius:22px 22px 0 0;
 padding:18px;
}
.close{
 float:right;
 background:#29292f;
 color:white;
 border:0;
 border-radius:50%;
 width:35px;
 height:35px;
 font-size:20px;
}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
a{color:white}
</style>
</head>

</nav>

</div>

<script>
const SUPABASE_URL="https://uewceocdzvekuopgsmpg.supabase.co";

const SUPABASE_KEY="sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_EMAIL="angenabukuze@gmail.com";

const DEFAULT_PAYMENTS=[
 {operator:"AIRTEL MONEY",number:"973087965",name:"YVETTE",active:true},
 {operator:"ORANGE MONEY",number:"899532643",name:"JEANCQUELINE",active:true},
 {operator:"M-PESA",number:"0861823718",name:"REGINA",active:true}
];

let PAYMENTS=[...DEFAULT_PAYMENTS];

const PLANS=[
 {id:"KIN1",price:15000,gain:2000,days:60,max:1},
 {id:"KIN2",price:30000,gain:4400,days:60,max:2},
 {id:"KIN3",price:80000,gain:12300,days:60,max:3},
 {id:"KIN4",price:150000,gain:24000,days:60,max:3},
 {id:"KIN5",price:300000,gain:52000,days:60,max:5},
 {id:"KIN6",price:600000,gain:120000,days:60,max:2},
 {id:"KIN7",price:1500000,gain:330000,days:60,max:2}
];

let user=null;
let profile=null;
let wallet=null;
let isAdmin=false;
let adminTab="dashboard";

function money(n){
 return Number(n||0).toLocaleString("fr-FR")+" FC";
}

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function dateTime(v){
 if(!v)return "—";
 try{
  return new Date(v).toLocaleString("fr-FR",{
   dateStyle:"short",
   timeStyle:"short"
  });
 }catch(e){return String(v)}
}

function statusLabel(s){
 s=String(s||"active").toLowerCase();

 if(s==="pending")
  return `<span class="status pending">EN ATTENTE</span>`;

 if(["approved","validated","active"].includes(s))
  return `<span class="status approved">VALIDÉ</span>`;

 if(["rejected","cancelled"].includes(s))
  return `<span class="status rejected">REJETÉ</span>`;

 if(["blocked","suspended"].includes(s))
  return `<span class="status blocked">BLOQUÉ</span>`;

 return `<span class="status active">${esc(s)}</span>`;
}

function showAuth(type){
 const login=type==="login";
 document.getElementById("loginTab").classList.toggle("active",login);
 document.getElementById("signupTab").classList.toggle("active",!login);
 document.getElementById("signupFields").classList.toggle("hidden",login);
 document.getElementById("authBtn").textContent=login?"Se connecter":"Créer mon compte";
 document.getElementById("authMsg").innerHTML="";
}

function localReferralCode(id){
 return "KIN"+String(id).replaceAll("-","").slice(0,8).toUpperCase();
}

function getReferralFromURL(){
 return new URLSearchParams(location.search).get("ref")?.trim().toUpperCase()||"";
}

const refFromURL=getReferralFromURL();
if(refFromURL){
 setTimeout(()=>{
  const x=document.getElementById("referral");
  if(x)x.value=refFromURL;
 },100);
}

async function submitAuth(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const name=document.getElementById("name").value.trim();
 const referral=document.getElementById("referral")?.value.trim().toUpperCase()||"";
 const signup=!document.getElementById("signupFields").classList.contains("hidden");

 if(!email||!password){
  document.getElementById("authMsg").innerHTML=
  `<div class="msg err">Email et mot de passe obligatoires.</div>`;
  return;
 }

 if(signup&&!name){
  document.getElementById("authMsg").innerHTML=
  `<div class="msg err">Votre nom est obligatoire.</div>`;
  return;
 }

 const btn=document.getElementById("authBtn");
 btn.disabled=true;

 try{

  if(signup){

   const r=await sb.auth.signUp({
    email,
    password,
    options:{data:{name}}
   });

   if(r.error)throw r.error;

   const u=r.data.user;

   if(!u)throw new Error("Compte non créé.");

   const code=localReferralCode(u.id);

   const data={
    id:u.id,
    full_name:name,
    role:"member",
    referral_code:code
   };

   if(referral)data.referred_by_code=referral;

   const p=await sb.from("profiles").upsert(data);

   if(p.error)console.warn(p.error);

   await sb.from("kin_wallets").upsert({
    user_id:u.id,
    balance:2000,
    total_earnings:0
   });

   document.getElementById("authMsg").innerHTML=
   `<div class="msg ok">Inscription réussie ! Votre compte est prêt.</div>`;

  }else{

   const r=await sb.auth.signInWithPassword({email,password});

   if(r.error)throw r.error;
  }

 }catch(e){

  document.getElementById("authMsg").innerHTML=
  `<div class="msg err">${esc(e.message||"Erreur")}</div>`;

 }finally{
  btn.disabled=false;
 }
}

async function githubLogin(){
 const r=await sb.auth.signInWithOAuth({
  provider:"github",
  options:{redirectTo:location.href}
 });
 if(r.error)
  document.getElementById("authMsg").innerHTML=
  `<div class="msg err">${esc(r.error.message)}</div>`;
}

async function loadUser(){

 const r=await sb.auth.getUser();
 user=r.data.user;

 if(!user){
  document.getElementById("auth").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  return;
 }

 await loadData();

 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");

 page("home");
}

async function loadData(){

 const p=await sb
 .from("profiles")
 .select("*")
 .eq("id",user.id)
 .maybeSingle();

 profile=p.data||{
  id:user.id,
  full_name:user.user_metadata?.name||"Membre",
  role:"member"
 };

 isAdmin=
 profile.role==="admin"||
 user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();

 const w=await sb
 .from("kin_wallets")
 .select("*")
 .eq("user_id",user.id)
 .maybeSingle();

 wallet=w.data||{balance:2000,total_earnings:0};
}

function page(name){

 if(name==="admin"&&!isAdmin)name="profile";

 document.querySelectorAll(".nav button")
 .forEach(x=>x.classList.remove("active"));

 const n=document.getElementById("nav-"+name);
 if(n)n.classList.add("active");

 if(name==="home")renderHome();
 if(name==="products")renderProducts();
 if(name==="tasks")renderTasks();
 if(name==="team")renderTeam();
 if(name==="profile")renderProfile();
 if(name==="admin")renderAdmin();
}

function renderHome(){

 document.getElementById("content").innerHTML=`

 <section class="hero">
  <h1>Bienvenue 🇨🇩</h1>
  <p>${esc(profile?.full_name||"Membre")} · KINSHASA BUSINESS</p>
  <div class="balance">${money(wallet?.balance)}</div>
  <div class="muted">Solde disponible</div>

  <div class="row" style="margin-top:15px">
   <div>
    <small class="muted">Gains cumulés</small>
    <div><b>${money(wallet?.total_earnings)}</b></div>
   </div>
   <div>🇨🇩</div>
  </div>
 </section>

 <div class="notice">
 📢 Les montants de gains affichés correspondent aux paramètres déclarés des produits.
 </div>

 <div class="grid">
  <button class="action" onclick="openDeposit()">
   <span>＋</span><b>Dépôt</b>
  </button>
  <button class="action" onclick="openWithdraw()">
   <span>↗</span><b>Retrait</b>
  </button>
  <button class="action" onclick="page('tasks')">
   <span>✓</span><b>Pointage</b>
  </button>
  <button class="action" onclick="page('team')">
   <span>♧</span><b>Équipe</b>
  </button>
 </div>

 <h2>Nos KIN</h2>
 ${PLANS.slice(0,3).map(planCard).join("")}

 <button class="btn btn-red" onclick="page('products')">
 Voir tous les KIN
 </button>
 `;
}

function planCard(p){
 return `
 <div class="plan">
  <div class="plan-top">
   <div class="kin">${p.id}</div>
   <div class="price">${money(p.price)}</div>
  </div>
  <div class="gain">Gain affiché : ${money(p.gain)} / jour</div>
  <span class="tag">${p.days} jours</span>
  <span class="tag">Maximum ${p.max}</span>
 </div>`;
}

function renderProducts(){
 document.getElementById("content").innerHTML=`
 <h2>Produits KIN</h2>
 <div class="notice">Les montants affichés sont les paramètres déclarés des produits.</div>
 ${PLANS.map(p=>`
  ${planCard(p)}
  <button class="btn btn-red" onclick="requestKin('${p.id}')">
   Demander ${p.id}
  </button>
 `).join("")}`;
}

function requestKin(id){
 const p=PLANS.find(x=>x.id===id);
 if(!p)return;

 showModal(`
 <button class="close" onclick="closeModal()">×</button>
 <h2>${p.id}</h2>
 <p>Prix : <b>${money(p.price)}</b></p>
 <p>Gain affiché : <b>${money(p.gain)}/jour</b></p>
 <p>Durée : <b>${p.days} jours</b></p>
 <button class="btn btn-red" onclick="closeModal()">Fermer</button>
 `);
}

 document.getElementById("content").innerHTML=`
 <h2>Tâches & Pointage</h2>
 <div class="card center">
  <div style="font-size:45px">✓</div>
  <h3>Pointage quotidien</h3>
  <p class="muted">Un pointage maximum par jour.</p>
  <p>Récompense : <b style="color:var(--green)">20 FC</b></p>

 <div class="card">
  <h3>Horaires</h3>
  <p class="muted">Lundi à dimanche</p>
  <b>08:00 – 19:00</b>

}

  checkin_date:today,
  reward:20
 });

  alert(r.error.code==="23505"
   ?"Vous avez déjà pointé aujourd'hui."
   :r.error.message);
  return;
 }

 alert("Pointage enregistré.");
 await loadData();
}

 </div>

  <a href="https://chat.whatsapp.com/DzKHiqrdBbPI22W7afe9ps" target="_blank">

/* =========================
   DÉPÔT
========================= */

async function openDeposit(){

 showModal(`
 <button class="close" onclick="closeModal()">×</button>
 <h2>💰 Dépôt</h2>

 <div class="notice">
  Minimum : <b>15 000 FC</b>
 </div>

 <label>Montant</label>
 <input id="depAmount" type="number" min="15000" placeholder="15000">

 <label>Opérateur</label>
 <select id="depOperator">
 ${PAYMENTS.filter(x=>x.active).map((p,i)=>`
  <option value="${i}">
   ${esc(p.operator)} — ${esc(p.number)}
  </option>`).join("")}
 </select>

 <div id="paymentInfo"></div>

 <label>Référence du transfert</label>

async function submitDeposit(){

 const ref=document.getElementById("depRef").value.trim();
 const active=PAYMENTS.filter(x=>x.active);
 const operator=active[Number(document.getElementById("depOperator").value)];

 if(amount<15000){
  alert("Le dépôt minimum est de 15 000 FC.");

 }

 if(!operator){
  alert("Aucun opérateur disponible.");
  return;

 const r=await sb.from("kin_deposit_requests").insert({
  user_id:user.id,
  amount,
  operator:operator.operator,

  payment_name:operator.name,
  reference:ref||null,
  status:"pending"
 });

 if(r.error){
  alert("Impossible d'envoyer : "+r.error.message);

 }

 closeModal();
 alert("Demande de dépôt envoyée.");

async function submitWithdraw(){

 const amount=Number(document.getElementById("wdAmount").value);
 const active=PAYMENTS.filter(x=>x.active);
 const operator=active[Number(document.getElementById("wdOperator").value)];
 const number=document.getElementById("wdNumber").value.trim();

 if(amount<2000){
  alert("Le retrait minimum est de 2 000 FC.");
  return;
 }

 if(amount>Number(wallet?.balance||0)){
  alert("Solde insuffisant.");
  return;

 if(!number){

  return;

 const fee=amount*.10;
 const net=amount-fee;

 const r=await sb.from("kin_withdrawal_requests").insert({
  user_id:user.id,
  amount,
  fee,
  net_amount:net,
  operator:operator?.operator||"",

  status:"pending"
 });

 if(r.error){
  alert("Impossible d'envoyer : "+r.error.message);
  return;
 }

 closeModal();

 alert(
  "Demande de retrait envoyée.\n\n"+

  "Net : "+money(net)

  <p>Gain affiché : <b>${money(p.gain)}/jour</b></p>
  <p>Durée : <b>${p.days} jours</b></p>
  <p>Maximum : <b>${p.max}</b></p>

  <button class="btn btn-dark" onclick="editPlan(${i})">
   ✏ Modifier ${p.id}
  </button>

 </div>

 `).join("")}
 `;
}

function editPlan(i){

 const p=PLANS[i];

 const price=prompt("Prix :",p.price);
 if(price===null)return;

 const gain=prompt("Gain affiché/jour :",p.gain);
 if(gain===null)return;

 const days=prompt("Durée :",p.days);
 if(days===null)return;

 const max=prompt("Maximum :",p.max);
 if(max===null)return;

 PLANS[i]={
  ...p,
  price:Number(price),
  gain:Number(gain),
  days:Number(days),
  max:Number(max)
 };

 alert("Paramètres modifiés dans l'interface.");
 adminPlans();
}

async function saveSettings(){

  min_deposit:Number(document.getElementById("minDeposit").value),
  min_withdraw:Number(document.getElementById("minWithdraw").value),

  referral_2:Number(document.getElementById("ref2").value),
  referral_3:Number(document.getElementById("ref3").value)
 };

 const r=await sb.from("kin_settings").upsert({
  key:"general",
  value
 });

 if(r.error){
  alert(r.error.message);
  return;
 }

 alert("Paramètres enregistrés.");
}

async function maintenanceToggle(){

 const reason=prompt("Motif de maintenance :");

 if(reason===null)return;

 const r=await sb.rpc("admin_toggle_maintenance",{
  p_reason:reason
 });

 if(r.error){
  alert("Action refusée :\n"+r.error.message);
  return;
 }

 alert("Mode maintenance modifié.");
}

/* JOURNAL */

async function adminAudit(){

 const panel=document.getElementById("adminPanel");

 const r=await sb
 .from("kin_admin_audit")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(100);

 if(r.error){
  panel.innerHTML=`
  <div class="card">
   <h3>🛡 Journal</h3>
   <p class="muted">
    Le journal n'est pas encore disponible :
   </p>
   <div class="msg err">${esc(r.error.message)}</div>
  </div>`;
  return;
 }

 const rows=r.data||[];

 panel.innerHTML=`

 <h3>🛡 Journal administratif</h3>

 ${rows.length
 ?rows.map(x=>`
  <div class="request">
   <b>${esc(x.action||"Action")}</b>
   <p class="small">${dateTime(x.created_at)}</p>
   <p class="small">${esc(x.reason||x.note||"")}</p>
  </div>
 `).join("")
 :`<div class="card muted">Aucune action enregistrée.</div>`}
 `;
}

/* MODAL */

function showModal(html){

 document.getElementById("modal").innerHTML=`
 <div class="modal"
  onclick="if(event.target===this)closeModal()">
  <div class="modal-box">${html}</div>
 </div>`;
}

function closeModal(){
 document.getElementById("modal").innerHTML="";
}

async function copyText(text){
 try{
  await navigator.clipboard.writeText(text);
  alert("Copié !");
 }catch(e){
  alert(text);
 }
}

async function logout(){

 await sb.auth.signOut();

 user=null;
 profile=null;
 wallet=null;

 document.getElementById("app").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
}

sb.auth.onAuthStateChange((event,session)=>{

 if(event==="SIGNED_IN"&&session){
  setTimeout(loadUser,100);
 }

 if(event==="SIGNED_OUT"){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
 }
});

loadUser();
</script>

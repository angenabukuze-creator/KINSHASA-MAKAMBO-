<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Administration - KINSHASA BUSINESS</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080808;
color:white;
padding:15px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
color:#ff3340;
}

.card{
background:#151515;
border:1px solid #333;
border-radius:16px;
padding:16px;
margin:12px 0;
}

button{
border:0;
border-radius:10px;
padding:12px;
font-weight:bold;
cursor:pointer;
margin:4px;
}

.red{background:#e50914;color:white}
.green{background:#159447;color:white}
.orange{background:#ff8c00;color:white}
.dark{background:#292929;color:white}

input,select{
width:100%;
padding:12px;
margin:6px 0;
border-radius:9px;
border:1px solid #444;
background:#101010;
color:white;
}

.status{
padding:10px;
border-radius:10px;
background:#102d1b;
color:#72e39a;
margin:10px 0;
}

.warning{
background:#382400;
color:#ffc766;
padding:12px;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

@media(max-width:500px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🇨🇩 KINSHASA BUSINESS</h1>

<div class="status">
✅ MODULE ADMINISTRATION — TEST
</div>

<div class="warning">
⚠️ Ceci est uniquement une interface de test.
Aucune opération réelle n'est effectuée.
</div>

<div class="card">

<h2>👥 Gestion des membres</h2>

<input
id="memberSearch"
placeholder="Rechercher un membre..."
>

<div class="grid">

<button class="green" onclick="test('Afficher tous les membres')">
👥 Tous les membres
</button>

<button class="orange" onclick="test('Afficher les membres en attente')">
⏳ En attente
</button>

<button class="red" onclick="test('Bloquer le membre')">
🚫 Bloquer
</button>

<button class="green" onclick="test('Débloquer le membre')">
🔓 Débloquer
</button>

<button class="dark" onclick="test('Réinitialiser le mot de passe')">
🔑 Réinitialiser mot de passe
</button>

<button class="orange" onclick="test('Modifier le code membre')">
✏️ Modifier code
</button>

</div>

</div>


<div class="card">

<h2>💰 Dépôts</h2>

<div class="grid">

<button class="green"
onclick="test('Valider le dépôt')">
✅ Valider
</button>

<button class="red"
onclick="test('Rejeter le dépôt')">
❌ Rejeter
</button>

<button class="dark"
onclick="test('Voir tous les dépôts')">
📋 Tous les dépôts
</button>

</div>

</div>


<div class="card">

<h2>💸 Retraits</h2>

<div class="grid">

<button class="green"
onclick="test('Valider le retrait')">
✅ Valider
</button>

<button class="red"
onclick="test('Rejeter le retrait')">
❌ Rejeter
</button>

<button class="dark"
onclick="test('Voir tous les retraits')">
📋 Tous les retraits
</button>

</div>

</div>


<div class="card">

<h2>📱 Moyens de paiement</h2>

<input
id="operator"
placeholder="Nom opérateur : Airtel Money"
>

<input
id="paymentNumber"
placeholder="Numéro de paiement"
>

<input
id="paymentName"
placeholder="Nom du bénéficiaire"
>

<button class="green"
onclick="testPayment()">
➕ Ajouter / modifier
</button>

</div>


<div class="card">

<h2>📢 Assistance</h2>

<input
id="whatsapp"
placeholder="Lien WhatsApp"
>

<input
id="telegram"
placeholder="Lien Telegram"
>

<input
id="support"
placeholder="Numéro service client"
>

<button class="green"
onclick="testSupport()">
💾 Enregistrer assistance
</button>

</div>


<div class="card">

<h2>⚙️ Paramètres</h2>

<label>Nom de la plateforme</label>

<input
value="KINSHASA BUSINESS"
>

<label>Minimum dépôt</label>

<input
value="15000"
type="number"
>

<label>Minimum retrait</label>

<input
value="2000"
type="number"
>

<label>Frais retrait (%)</label>

<input
value="10"
type="number"
>

<button class="green"
onclick="test('Enregistrer les paramètres')">
💾 Enregistrer
</button>

</div>


<div class="card">

<h2>🛡️ Sécurité</h2>

<button class="orange"
onclick="test('Activer maintenance')">
🔧 Mode maintenance
</button>

<button class="dark"
onclick="test('Afficher journal administrateur')">
📜 Journal des actions
</button>

</div>

</div>


<script>

function test(action){

alert(
"TEST ADMIN\n\n"+
"Action : "+action+
"\n\nLe bouton fonctionne."
);

}

function testPayment(){

const operator=
document.getElementById("operator").value;

const number=
document.getElementById("paymentNumber").value;

const name=
document.getElementById("paymentName").value;

alert(
"TEST PAIEMENT\n\n"+
"Opérateur : "+operator+
"\nNuméro : "+number+
"\nBénéficiaire : "+name+
"\n\nLe formulaire fonctionne."
);

}

function testSupport(){

const whatsapp=
document.getElementById("whatsapp").value;

const telegram=
document.getElementById("telegram").value;

const support=
document.getElementById("support").value;

alert(
"TEST ASSISTANCE\n\n"+
"WhatsApp : "+whatsapp+
"\nTelegram : "+telegram+
"\nService client : "+support+
"\n\nLe formulaire fonctionne."
);

}

</script>

</body>
</html>

<!-- =========================================================
     HISTORIQUE DES TRANSACTIONS — ESPACE MEMBRE UNIQUEMENT
     Ne modifie pas l'administration
     ========================================================= -->

<script>
(function(){

  function ajouterHistoriqueMembre(){

    /* Ne rien afficher dans l'administration */
    if(typeof isAdmin !== "undefined" && isAdmin) return;

    const grids = document.querySelectorAll(".grid");
    if(!grids.length) return;

    /* Évite les doublons */
    if(document.getElementById("btnHistoriqueMembre")) return;

    /* On ajoute le bouton dans le premier bloc d'actions membre */
    const grid = grids[0];

    const bouton = document.createElement("button");
    bouton.id = "btnHistoriqueMembre";
    bouton.className = "action";
    bouton.innerHTML = `
      <span>🧾</span>
      <b>Historique</b>
    `;

    bouton.onclick = afficherHistoriqueMembre;

    grid.appendChild(bouton);
  }


  async function afficherHistoriqueMembre(){

    if(typeof user === "undefined" || !user){
      alert("Veuillez vous connecter.");
      return;
    }

    let lignes = [];

    /* =====================================================
       1. TRANSACTIONS DU PORTEFEUILLE
       ===================================================== */

    try{

      const r = await sb
        .from("kin_transactions")
        .select("*")
        .eq("user_id",user.id)
        .order("created_at",{ascending:false});

      if(!r.error && Array.isArray(r.data)){

        r.data.forEach(x => {

          lignes.push({
            date:x.created_at,
            type:x.type || x.transaction_type || "Transaction",
            montant:Number(x.amount || 0),
            statut:x.status || "effectué",
            description:
              x.description ||
              x.note ||
              x.label ||
              "Transaction"
          });

        });

      }

    }catch(e){
      console.log("Historique transactions:",e);
    }


    /* =====================================================
       2. DÉPÔTS
       ===================================================== */

    try{

      const r = await sb
        .from("kin_deposit_requests")
        .select("*")
        .eq("user_id",user.id)
        .order("created_at",{ascending:false});

      if(!r.error && Array.isArray(r.data)){

        r.data.forEach(x => {

          lignes.push({
            date:x.created_at,
            type:"Dépôt",
            montant:Number(x.amount || 0),
            statut:x.status || "pending",
            description:
              "Dépôt " +
              (x.operator ? x.operator : "")
          });

        });

      }

    }catch(e){
      console.log("Historique dépôts:",e);
    }


    /* =====================================================
       3. RETRAITS
       ===================================================== */

    try{

      const r = await sb
        .from("kin_withdrawal_requests")
        .select("*")
        .eq("user_id",user.id)
        .order("created_at",{ascending:false});

      if(!r.error && Array.isArray(r.data)){

        r.data.forEach(x => {

          lignes.push({
            date:x.created_at,
            type:"Retrait",
            montant:Number(x.amount || 0),
            statut:x.status || "pending",
            description:
              "Retrait " +
              (x.operator ? x.operator : "")
          });

        });

      }

    }catch(e){
      console.log("Historique retraits:",e);
    }


    /* =====================================================
       TRI PAR DATE
       ===================================================== */

    lignes.sort(function(a,b){

      return new Date(b.date || 0) -
             new Date(a.date || 0);

    });


    /* =====================================================
       AFFICHAGE
       ===================================================== */

    let contenu = "";

    if(!lignes.length){

      contenu = `
        <div class="member" style="text-align:center;padding:25px">
          <div style="font-size:38px">🧾</div>
          <h3>Aucune transaction</h3>
          <p class="muted">
            Votre historique apparaîtra ici.
          </p>
        </div>
      `;

    }else{

      contenu = lignes.map(function(x){

        const montant =
          Number(x.montant || 0);

        let couleur = "#aaa";

        if(x.statut === "approved" ||
           x.statut === "validated" ||
           x.statut === "validé" ||
           x.statut === "completed" ||
           x.statut === "effectué"){

          couleur = "#52d68a";

        }

        if(x.statut === "rejected" ||
           x.statut === "refused" ||
           x.statut === "rejeté"){

          couleur = "#ff5964";

        }

        if(x.statut === "pending" ||
           x.statut === "en attente"){

          couleur = "#ffc857";

        }

        let signe = "";

        if(
          String(x.type).toLowerCase().includes("dépôt") ||
          String(x.type).toLowerCase().includes("gain") ||
          String(x.type).toLowerCase().includes("commission")
        ){

          signe = "+";

        }else if(
          String(x.type).toLowerCase().includes("retrait")
        ){

          signe = "-";

        }

        let dateTexte = "Date inconnue";

        if(x.date){

          try{

            dateTexte =
              new Date(x.date).toLocaleString(
                "fr-FR",
                {
                  day:"2-digit",
                  month:"2-digit",
                  year:"numeric",
                  hour:"2-digit",
                  minute:"2-digit"
                }
              );

          }catch(e){}

        }

        return `
          <div class="member"
               style="
                 margin:10px 0;
                 border-left:4px solid ${couleur};
               ">

            <div style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              gap:10px;
            ">

              <div>

                <b>
                  ${escapeHistorique(x.type)}
                </b>

                <div class="muted small">
                  ${escapeHistorique(x.description)}
                </div>

              </div>

              <div style="
                text-align:right;
                font-weight:900;
                color:${couleur};
              ">

                ${signe}${moneyHistorique(montant)}

              </div>

            </div>

            <div class="small muted"
                 style="margin-top:8px">

              📅 ${escapeHistorique(dateTexte)}

            </div>

            <div style="margin-top:6px">

              <span style="
                display:inline-block;
                padding:4px 9px;
                border-radius:20px;
                background:${couleur}22;
                color:${couleur};
                font-size:12px;
                font-weight:700;
              ">
                ${escapeHistorique(
                  traduireStatutHistorique(x.statut)
                )}
              </span>

            </div>

          </div>
        `;

      }).join("");

    }


    /* =====================================================
       MODALE
       ===================================================== */

    const modal =
      document.getElementById("modal");

    if(modal){

      modal.innerHTML = `
        <div class="modal"
             onclick="
               if(event.target===this)
               this.parentElement.innerHTML=''
             ">

          <div class="modal-box">

            <button
              class="close"
              onclick="
                document.getElementById('modal').innerHTML=''
              ">
              ×
            </button>

            <h2 style="
              color:#ff5964;
              margin-top:5px;
            ">
              🧾 Historique des transactions
            </h2>

            <p class="muted">
              Tous vos dépôts, retraits et transactions.
            </p>

            <hr>

            ${contenu}

          </div>

        </div>
      `;

    }

  }


  function traduireStatutHistorique(statut){

    const s = String(statut || "")
      .toLowerCase();

    if(
      s === "pending" ||
      s === "en attente"
    ){

      return "⏳ En attente";

    }

    if(
      s === "approved" ||
      s === "validated" ||
      s === "validé"
    ){

      return "✅ Validé";

    }

    if(
      s === "rejected" ||
      s === "refused" ||
      s === "rejeté"
    ){

      return "❌ Rejeté";

    }

    if(
      s === "completed" ||
      s === "effectué"
    ){

      return "✅ Effectué";

    }

    return statut || "Transaction";

  }


  function moneyHistorique(n){

    return Number(n || 0)
      .toLocaleString("fr-FR") + " FC";

  }


  function escapeHistorique(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =====================================================
     AJOUT AUTOMATIQUE DU BOUTON
     ===================================================== */

  const ancienPage = window.page;

  if(typeof ancienPage === "function"){

    window.page = function(name){

      const resultat = ancienPage.apply(this,arguments);

      setTimeout(function(){

        if(name !== "admin"){
          ajouterHistoriqueMembre();
        }

      },300);

      return resultat;

    };

  }


  /* Premier chargement */
  setTimeout(ajouterHistoriqueMembre,1500);


})();
</script>

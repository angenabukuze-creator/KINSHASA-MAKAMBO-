body{

header{

.action span{font-size:25px}

h2{

.row{

<script>

const SUPABASE_URL="https://uewceocdzvekuopgsmpg.supabase.co";

const SUPABASE_KEY="sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";

const sb=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const ADMIN_EMAIL="angenabukuze@gmail.com";


const PAYMENTS=[
{
operator:"AIRTEL MONEY",
number:"973087965",
name:"YVETTE"
},
{
operator:"ORANGE MONEY",
number:"899532643",
name:"JEANCQUELINE"
},
{
operator:"M-PESA",
number:"0861823718",
name:"REGINA"
}
];


const PLANS=[
{id:"KIN1",price:15000,gain:2000,days:60,max:1},
{id:"KIN2",price:30000,gain:4400,days:60,max:2},
{id:"KIN3",price:80000,gain:12300,days:60,max:3},
{id:"KIN4",price:150000,gain:24000,days:60,max:3},
{id:"KIN5",price:300000,gain:52000,days:60,max:5},
{id:"KIN6",price:600000,gain:120000,days:60,max:2},
{id:"KIN7",price:1500000,gain:330000,days:60,max:2}
];


let user=null;
let profile=null;
let wallet=null;
let isAdmin=false;
let currentPage="home";


const money=n=>
Number(n||0).toLocaleString("fr-FR")+" FC";


function esc(v){

return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function msg(t,type="ok"){

return `<div class="msg ${type}">${esc(t)}</div>`;

}


/* =========================================================
   PARRAINAGE
   ========================================================= */

function referralCode(){

if(!user)return "";

if(profile?.referral_code){
return String(profile.referral_code).toUpperCase();
}

return "KIN"+
user.id
.replaceAll("-","")
.slice(0,8)
.toUpperCase();

}


function referralLink(){

return "https://kinshasa-makambo.vercel.app/?ref="+
referralCode();

}


/* =========================================================
   AUTH
   ========================================================= */

function showAuth(type){

const login=type==="login";

document
.getElementById("loginTab")
.classList.toggle("active",login);

document
.getElementById("signupTab")
.classList.toggle("active",!login);

document
.getElementById("signupFields")
.classList.toggle("hidden",login);

document
.getElementById("authBtn")
.textContent=
login?"Se connecter":"Créer mon compte";

document.getElementById("authMsg").innerHTML="";

}


async function submitAuth(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

const name=
document.getElementById("name")
.value.trim();


if(!email||!password){

document.getElementById("authMsg").innerHTML=
msg(
"Email et mot de passe obligatoires",
"err"
);

return;

}


const signup=
!document
.getElementById("signupFields")
.classList
.contains("hidden");


document.getElementById("authBtn").disabled=true;


try{

if(signup){

/*
Récupération du code du parrain
présent dans l'URL.
Exemple :
?ref=KIN897AD457
*/

const ref=
new URLSearchParams(location.search)
.get("ref");


const cleanRef=
ref?
String(ref).trim().toUpperCase():
null;


const {data,error}=
await sb.auth.signUp({

email,
password,

options:{
data:{
name,
referral_code:cleanRef
}
}

});


if(error)throw error;


if(data.user){

/*
Code personnel unique du nouveau membre.
*/

const code=
"KIN"+
data.user.id
.replaceAll("-","")
.slice(0,8)
.toUpperCase();


/*
Création du profil avec le code
et le code du parrain.
*/

const r=
await sb
.from("profiles")
.upsert({

id:data.user.id,

full_name:
name||"Membre",

role:"member",

referral_code:code,

referred_by_code:cleanRef

},{
onConflict:"id"
});


if(r.error){

throw new Error(
"Impossible d'enregistrer le profil de parrainage : "+
r.error.message
);

}


/*
Création du portefeuille.
*/

const walletResult=
await sb
.from("kin_wallets")
.upsert({

user_id:data.user.id,

balance:2000,

total_earnings:0

},{
onConflict:"user_id"
});


if(walletResult.error){

console.warn(
"Portefeuille :",
walletResult.error.message
);

}


/*
Message de réussite.
*/

document.getElementById("authMsg").innerHTML=
msg(
"Inscription réussie ! Votre code de parrainage est "+
code+
". Vous pouvez maintenant vous connecter."
);

}

}else{

const {error}=
await sb.auth.signInWithPassword({

email,
password

});

if(error)throw error;

}

}catch(e){

document.getElementById("authMsg").innerHTML=
msg(
e.message||"Une erreur est survenue",
"err"
);

}finally{

document.getElementById("authBtn").disabled=false;

}

}


async function githubLogin(){

const {error}=
await sb.auth.signInWithOAuth({

provider:"github",

options:{
redirectTo:location.href
}

});

if(error){

document.getElementById("authMsg").innerHTML=
msg(error.message,"err");

}

}


/* =========================================================
   UTILISATEUR
   ========================================================= */

async function loadUser(){

const {data}=await sb.auth.getUser();

user=data.user;


if(!user){

document.getElementById("auth")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

return;

}


await loadData();


document.getElementById("auth")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

page("home");

}


async function loadData(){

if(!user)return;


const p=
await sb
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


profile=
p.data||
{
id:user.id,
full_name:user.user_metadata?.name||"Membre",
role:"member",
referral_code:
"KIN"+
user.id
.replaceAll("-","")
.slice(0,8)
.toUpperCase()
};


isAdmin=
profile.role==="admin"||
user.email?.toLowerCase()===
ADMIN_EMAIL.toLowerCase();


/*
Si le code de parrainage personnel
n'existe pas encore dans le profil,
on le crée.
*/

if(!profile.referral_code){

const code=
"KIN"+
user.id
.replaceAll("-","")
.slice(0,8)
.toUpperCase();


await sb
.from("profiles")
.update({
referral_code:code
})
.eq("id",user.id);


profile.referral_code=code;

}


const w=
await sb
.from("kin_wallets")
.select("*")
.eq("user_id",user.id)
.maybeSingle();


wallet=
w.data||
{
balance:2000,
total_earnings:0
};

}


function navActive(name){

document
.querySelectorAll(".nav button")
.forEach(x=>
x.classList.remove("active")
);


const e=
document.getElementById("nav-"+name);

if(e)e.classList.add("active");

}


function page(name){

currentPage=name;

if(name==="admin"&&!isAdmin)
name="profile";


navActive(
name==="products"?"products":
name==="tasks"?"tasks":
name==="team"?"team":
name==="profile"?"profile":
"home"
);


if(name==="home")renderHome();

if(name==="products")renderProducts();

if(name==="tasks")renderTasks();

if(name==="team")renderTeam();

if(name==="profile")renderProfile();

if(name==="admin")renderAdmin();

}

async function requestKin(id){

const p=
PLANS.find(x=>x.id===id);

if(!p)return;


showModal(`

<button class="close"
onclick="closeModal()">
×
</button>

<h2>
Demande ${p.id}
</h2>

<p>
Prix :
<b>${money(p.price)}</b>
</p>

par l'administration.

onclick="closeModal()">

`);

/*
IMPORTANT :
On ne lit plus directement tous les profils.

On utilise la fonction sécurisée
get_my_team_stats() créée dans Supabase.
*/

async function loadTeamStats(){

const box=
document.getElementById("teamMembers");


try{

const {data,error}=
await sb.rpc("get_my_team_stats");


if(error){

console.error(error);

box.innerHTML=`

<h3>
👥 Mon équipe
</h3>

<p class="muted">
Impossible de charger les statistiques
pour le moment.
</p>

<p class="small muted">
${esc(error.message)}
</p>

`;

return;

}


const result=data||{};


const code=
String(
result.code||
referralCode()
).toUpperCase();


/*
Mettre à jour le code affiché
avec celui réellement enregistré
dans Supabase.
*/

const codeElement=
document.querySelector(
".card.center div[style*='font-size:25px']"
);

if(codeElement){

codeElement.textContent=code;

}


document.getElementById("teamRegistered")
.textContent=
Number(result.registered||0);


document.getElementById("teamValidated")
.textContent=
Number(result.validated||0);


document.getElementById("teamCommission")
.textContent=
money(result.commission||0);


const members=
Array.isArray(result.members)?
result.members:
[];


if(!members.length){

box.innerHTML=`

<h3>
👥 Membres de mon équipe
</h3>

<p class="muted">
Aucun filleul enregistré avec votre code
pour le moment.
</p>

`;

return;

}


box.innerHTML=
`

<h3>
👥 Membres de mon équipe
</h3>

`+
members
.map(x=>`

<div class="member">

<b>
${esc(x.full_name||"Membre")}
</b>

<div class="small muted">

Statut :
${esc(x.status||"active")}

</div>

</div>

`)
.join("");


}catch(e){

console.error(e);

box.innerHTML=`

<h3>
👥 Mon équipe
</h3>

<p class="muted">
Statistiques indisponibles pour le moment.
</p>

`;

}

}

function updatePaymentInfo(){

const s=
document.getElementById("depOperator");

const box=
document.getElementById("paymentInfo");

if(!s||!box)return;


const p=
PAYMENTS[Number(s.value)];


box.innerHTML=`

<div class="pay">

<strong>
${p.operator}
</strong>

<div class="number">
${p.number}
</div>

<small>
Nom : ${p.name} · Transfert
</small>

<button class="btn btn-dark"
onclick="copyText('${p.number}')">

Copier le numéro

</button>

</div>

`;

}


async function submitDeposit(){

const amount=
Number(
document
.getElementById("depAmount")
.value
);

const ref=
document
.getElementById("depRef")
.value
.trim();


const operator=
PAYMENTS[
Number(
document
.getElementById("depOperator")
.value
)
];


if(amount<15000){

alert(
"Le dépôt minimum est de 15 000 FC."
);

return;

}


try{

const {error}=
await sb
.from("kin_deposit_requests")
.insert({

user_id:user.id,

amount,

operator:operator.operator,

payment_number:operator.number,

payment_name:operator.name,

reference:ref||null,

status:"pending"

});


if(error)throw error;


closeModal();


alert(
"Demande de dépôt envoyée. "+
"La validation sera effectuée par l'administration."
);


}catch(e){

alert(
"Impossible d'envoyer la demande : "+
e.message
);

}

}

async function submitWithdraw(){

const amount=
Number(
document
.getElementById("wdAmount")
.value
);

const number=
document
.getElementById("wdNumber")
.value
.trim();


if(!user){

alert("Veuillez vous connecter.");

return;

}


if(amount<2000){

alert(
"Le retrait minimum est de 2 000 FC."
);

return;

}


if(amount>
Number(wallet?.balance||0)){

alert("Solde insuffisant.");

return;

}


if(!number){

alert(
"Entrez votre numéro de réception."
);

return;

}


const fee=amount*0.10;

const net=amount-fee;


try{

const {error}=
await sb
.from("kin_withdrawal_requests")
.insert({

user_id:user.id,

amount:amount,

withdrawal_number:number,

status:"pending"

});


if(error)throw error;


closeModal();


alert(

"Demande de retrait envoyée.\n\n"+

"Montant : "+
money(amount)+

"\nFrais déclarés 10% : "+
money(fee)+

"\nNet indicatif : "+
money(net)+

"\n\nVotre demande sera vérifiée par l'administration."

);


}catch(e){

alert(

"Impossible d'envoyer la demande.\n\n"+
e.message

);

}

}

}

   ========================================================= */

sb.auth.onAuthStateChange(
async(event,session)=>{

if(event==="SIGNED_IN"&&session){

setTimeout(
loadUser,
100
);

}


if(event==="SIGNED_OUT"){

document
.getElementById("app")
.classList.add("hidden");

document
.getElementById("auth")
.classList.remove("hidden");

}

});


loadUser();

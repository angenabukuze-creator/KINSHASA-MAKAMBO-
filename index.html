<div id="launch-counter" style="
  background:#064b87;
  color:white;
  text-align:center;
  padding:15px 8px;
  border-bottom:4px solid #ffcc00;
">
  <strong>KINSHASA BUSINESS — NOTRE LANCEMENT</strong>
  <div id="launch-time" style="
    font-size:23px;
    font-weight:bold;
    margin-top:8px;
  ">000 jrs : 00 h : 00 min : 00 s</div>
  <small>Temps écoulé depuis le lancement</small>
</div>

<script>
(function () {
  // Modifiez cette date pour définir le lancement officiel.
  const launchDate = new Date("2026-10-14T00:00:00+02:00").getTime();

  function updateLaunchCounter() {
    const now = Date.now();
    const elapsed = Math.max(0, now - launchDate);

    const days = Math.floor(elapsed / 86400000);
    const hours = Math.floor((elapsed % 86400000) / 3600000);
    const minutes = Math.floor((elapsed % 3600000) / 60000);
    const seconds = Math.floor((elapsed % 60000) / 1000);

    document.getElementById("launch-time").textContent =
      String(days).padStart(3, "0") + " jrs : " +
      String(hours).padStart(2, "0") + " h : " +
      String(minutes).padStart(2, "0") + " min : " +
      String(seconds).padStart(2, "0") + " s";
  }

  updateLaunchCounter();
  setInterval(updateLaunchCounter, 1000);
})();
</script>

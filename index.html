button,input,select,textarea{font:inherit}

.app{max-width:650px;min-height:100vh;margin:auto;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px}
.logo{display:flex;align-items:center;gap:10px}
.flag{font-size:30px}.logo strong{font-size:19px}.logo small{display:block;color:var(--gray);margin-top:3px}
main{padding:15px}
.card,.member,.tx,.setting{background:var(--dark);border:1px solid var(--line);border-radius:17px;padding:15px;margin:9px 0}
.hero{background:linear-gradient(145deg,#350308,#111116 65%);border:1px solid #65121a;border-radius:22px;padding:20px;margin-bottom:14px}
.hero h1{margin:0 0 7px;font-size:27px}
.balance{font-size:30px;font-weight:900;margin:13px 0 4px}
.muted{color:var(--gray)}
.notice{border-left:4px solid var(--red);background:#18181c;padding:12px;border-radius:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.action{background:var(--dark);border:1px solid var(--line);border-radius:16px;padding:16px 10px;color:white;text-align:center}
.action span{font-size:25px}.action b{display:block;margin-top:7px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

.admin-title{color:#ff5a62;font-weight:900}

<script>
const SUPABASE_URL="https://uewceocdzvekuopgsmpg.supabase.co";
const SUPABASE_KEY="sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_EMAIL="angenabukuze@gmail.com";

const PAYMENTS=[
{operator:"AIRTEL MONEY",number:"973087965",name:"YVETTE"},
{operator:"ORANGE MONEY",number:"899532643",name:"JEANCQUELINE"},
{operator:"M-PESA",number:"0861823718",name:"REGINA"}
];

const PLANS=[
{id:"KIN1",price:15000,gain:2000,days:60,max:1},
{id:"KIN2",price:30000,gain:4400,days:60,max:2},
{id:"KIN3",price:80000,gain:12300,days:60,max:3},
{id:"KIN4",price:150000,gain:24000,days:60,max:3},
{id:"KIN5",price:300000,gain:52000,days:60,max:5},
{id:"KIN6",price:600000,gain:120000,days:60,max:2},
{id:"KIN7",price:1500000,gain:330000,days:60,max:2}
];

let user=null,profile=null,wallet=null,currentPage="home",isAdmin=false;
let adminTab="dashboard";

const money=n=>Number(n||0).toLocaleString("fr-FR")+" FC";

function esc(v){
return String(v??"")
.replaceAll("&","&amp;").replaceAll("<","&lt;")
.replaceAll(">","&gt;").replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function msg(t,type="ok"){return `<div class="msg ${type}">${esc(t)}</div>`}

function codeFor(id){
return "KIN"+String(id).replaceAll("-","").slice(0,8).toUpperCase();
}

function showAuth(type){
const login=type==="login";
loginTab.classList.toggle("active",login);
signupTab.classList.toggle("active",!login);
signupFields.classList.toggle("hidden",login);
authBtn.textContent=login?"Se connecter":"Créer mon compte";
authMsg.innerHTML="";
}

async function submitAuth(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const name=document.getElementById("name").value.trim();
const ref=document.getElementById("referralCode").value.trim().toUpperCase();
const signup=!signupFields.classList.contains("hidden");

if(!email||!password){
authMsg.innerHTML=msg("Email et mot de passe obligatoires","err");return;
}

authBtn.disabled=true;

try{
if(signup){
const {data,error}=await sb.auth.signUp({
email,password,options:{data:{name}}
});
if(error)throw error;

if(data.user){
await sb.from("profiles").upsert({
id:data.user.id,
full_name:name||"Membre",
role:"member",
referral_code:codeFor(data.user.id),
referred_by_code:ref||null
});

await sb.from("kin_wallets").upsert({
user_id:data.user.id,balance:2000,total_earnings:0
});

authMsg.innerHTML=msg("Inscription réussie ! Vous pouvez maintenant utiliser votre compte.");
}
}else{
const {error}=await sb.auth.signInWithPassword({email,password});
if(error)throw error;
}
}catch(e){
authMsg.innerHTML=msg(e.message||"Erreur","err");
}finally{authBtn.disabled=false}
}

async function githubLogin(){
const {error}=await sb.auth.signInWithOAuth({
provider:"github",options:{redirectTo:location.href}
});
if(error)authMsg.innerHTML=msg(error.message,"err");
}

async function loadUser(){
const {data}=await sb.auth.getUser();
user=data.user;

if(!user){
auth.classList.remove("hidden");
app.classList.add("hidden");
return;
}

await loadData();
auth.classList.add("hidden");
app.classList.remove("hidden");
page("home");
}

async function loadData(){
if(!user)return;

const p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();

profile=p.data||{
id:user.id,full_name:user.user_metadata?.name||"Membre",role:"member"
};

isAdmin=profile.role==="admin"||user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();

const w=await sb.from("kin_wallets").select("*").eq("user_id",user.id).maybeSingle();

wallet=w.data||{balance:2000,total_earnings:0};
}

function navActive(name){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
const e=document.getElementById("nav-"+name);
if(e)e.classList.add("active");
}

function page(name){
currentPage=name;
if(name==="admin"&&!isAdmin)name="profile";

navActive(
name==="products"?"products":
name==="tasks"?"tasks":
name==="team"?"team":
name==="profile"?"profile":"home"
);

if(name==="home")renderHome();
if(name==="products")renderProducts();
if(name==="tasks")renderTasks();
if(name==="team")renderTeam();
if(name==="profile")renderProfile();
if(name==="admin")renderAdmin();
}

content.innerHTML=`
<section class="hero">
<h1>Bienvenue 🇨🇩</h1>
<p>${esc(profile?.full_name||"Membre")} · KINSHASA BUSINESS</p>
<div class="balance">${money(wallet?.balance)}</div>
<div class="muted">Solde disponible</div>

<h2>${p.id}</h2>
<p>Prix : <b>${money(p.price)}</b></p>
<p>Gain affiché : <b>${money(p.gain)}/jour</b></p>
<div class="notice">La demande doit être validée par l'administration.</div>
<button class="btn btn-red" onclick="closeModal()">Fermer</button>`);
}

async function openDeposit(){
showModal(`
<button class="close" onclick="closeModal()">×</button>
<h2>💰 Dépôt</h2>
<div class="notice">Minimum : <b>15 000 FC</b></div>
<label>Montant</label>
<input id="depAmount" type="number" min="15000">
<label>Opérateur</label>
<select id="depOperator">${PAYMENTS.map((p,i)=>`<option value="${i}">${p.operator} — ${p.number} — ${p.name}</option>`).join("")}</select>
<div id="paymentInfo"></div>
<label>Référence</label>
<input id="depRef" placeholder="Référence du transfert">
<button class="btn btn-red" onclick="submitDeposit()">Envoyer la demande</button>`);
updatePaymentInfo();
depOperator.addEventListener("change",updatePaymentInfo);
}

function updatePaymentInfo(){
const s=document.getElementById("depOperator");
const box=document.getElementById("paymentInfo");
if(!s||!box)return;
const p=PAYMENTS[Number(s.value)];
box.innerHTML=`
<div class="card">
<b>${p.operator}</b>
<div style="font-size:20px;font-weight:900;margin:5px 0">${p.number}</div>
<div class="muted">Nom : ${p.name} · transfert</div>
<button class="btn btn-dark" onclick="copyText('${p.number}')">Copier</button>
</div>`;
}

async function submitDeposit(){
const amount=Number(document.getElementById("depAmount").value);
const ref=document.getElementById("depRef").value.trim();
const p=PAYMENTS[Number(document.getElementById("depOperator").value)];

if(amount<15000){alert("Minimum 15 000 FC.");return}

const {error}=await sb.from("kin_deposit_requests").insert({
user_id:user.id,amount,operator:p.operator,payment_number:p.number,
payment_name:p.name,reference:ref||null,status:"pending"
});

if(error){alert(error.message);return}
closeModal();
alert("Demande de dépôt envoyée.");
}

async function openWithdraw(){
showModal(`
<button class="close" onclick="closeModal()">×</button>
<h2>💸 Retrait</h2>
<div class="notice">Minimum : <b>2 000 FC</b> · Frais déclarés : <b>10%</b></div>
<label>Montant</label>
<input id="wdAmount" type="number" min="2000">
<label>Opérateur</label>
<select id="wdOperator">${PAYMENTS.map((p,i)=>`<option value="${i}">${p.operator}</option>`).join("")}</select>
<label>Numéro de réception</label>
<input id="wdNumber" placeholder="Numéro où recevoir le retrait">
<button class="btn btn-red" onclick="submitWithdraw()">Envoyer la demande</button>`);
}

async function submitWithdraw(){
const amount=Number(document.getElementById("wdAmount").value);
const number=document.getElementById("wdNumber").value.trim();
const p=PAYMENTS[Number(document.getElementById("wdOperator").value)];

if(amount<2000){alert("Le retrait minimum est de 2 000 FC.");return}
if(amount>Number(wallet?.balance||0)){alert("Solde insuffisant.");return}
if(!number){alert("Entrez le numéro de réception.");return}

const fee=amount*.10,net=amount-fee;

const {error}=await sb.from("kin_withdrawal_requests").insert({
user_id:user.id,amount,fee,net_amount:net,
operator:p.operator,payment_number:number,status:"pending"
});

if(error){alert(error.message);return}
closeModal();
alert("Demande de retrait envoyée.");
}

async function loadAdminTab(){
const a=document.getElementById("adminArea");
if(!a)return;

if(adminTab==="dashboard"){
a.innerHTML=`
<div class="card">
<h3>Centre de contrôle</h3>
<button class="btn btn-red" onclick="adminTab='members';renderAdmin()">👥 Gérer les membres</button>
<button class="btn btn-dark" onclick="adminTab='deposits';renderAdmin()">💰 Valider les dépôts</button>
<button class="btn btn-dark" onclick="adminTab='withdrawals';renderAdmin()">💸 Valider les retraits</button>
<button class="btn btn-dark" onclick="adminTab='transactions';renderAdmin()">🧾 Voir toutes les transactions</button>
<button class="btn btn-dark" onclick="adminTab='payments';renderAdmin()">📱 Gérer les opérateurs</button>
<button class="btn btn-dark" onclick="adminTab='groups';renderAdmin()">📢 Assistance / groupes</button>
<button class="btn btn-dark" onclick="adminTab='settings';renderAdmin()">⚙️ Configuration</button>
</div>`;
return;
}

if(adminTab==="members"){await adminMembers(a);return}
if(adminTab==="deposits"){await adminRequests(a,"kin_deposit_requests","Dépôts");return}
if(adminTab==="withdrawals"){await adminRequests(a,"kin_withdrawal_requests","Retraits");return}
if(adminTab==="transactions"){await adminTransactions(a);return}
if(adminTab==="payments"){adminPayments(a);return}
if(adminTab==="groups"){adminGroups(a);return}
if(adminTab==="settings"){adminSettings(a);return}
}

async function adminMembers(a){
const r=await sb.from("profiles").select("*").order("created_at",{ascending:false});

<input id="memberSearch" placeholder="Rechercher nom / code / téléphone" oninput="filterMembers()">
<div id="memberList"></div>`;

window.ADMIN_MEMBERS=r.data||[];
filterMembers();
}

function filterMembers(){
const q=(document.getElementById("memberSearch")?.value||"").toLowerCase();

const list=(window.ADMIN_MEMBERS||[]).filter(x=>
JSON.stringify(x).toLowerCase().includes(q)
);

document.getElementById("memberList").innerHTML=list.map(x=>`
<div class="member">
<div class="row">
<div><b>${esc(x.full_name||"Membre")}</b></div>
<div class="status ${x.status==="blocked"?"blocked":"active"}">
${x.status==="blocked"?"BLOQUÉ":"ACTIF"}
</div>
</div>

<div class="small muted">ID : ${esc(x.id)}</div>
<div>Email : ${esc(x.email||"Non disponible")}</div>
<div>Code : <b>${esc(x.referral_code||codeFor(x.id))}</b></div>
<div>Rôle : <b>${esc(x.role||"member")}</b></div>

<div class="grid" style="margin-top:8px">
<button class="btn btn-dark" onclick="adminMemberDetails('${x.id}')">Détails</button>
<button class="btn ${x.status==="blocked"?"btn-green":"btn-danger"}"
onclick="adminBlock('${x.id}',${x.status==="blocked"})">
${x.status==="blocked"?"Débloquer":"Bloquer"}
</button>
</div>

<button class="btn btn-yellow" onclick="adminResetPassword('${x.id}')">
🔑 Réinitialiser mot de passe
</button>

<button class="btn btn-blue" onclick="adminAdjust('${x.id}')">
💰 Ajuster le solde
</button>

<button class="btn btn-dark" onclick="adminAssignKin('${x.id}')">
⭐ Attribuer un KIN
</button>

<button class="btn btn-dark" onclick="adminBonus('${x.id}')">
🎁 Ajouter un bonus
</button>

<button class="btn btn-dark" onclick="adminIncome('${x.id}')">
📈 Ajouter un revenu
</button>

<button class="btn btn-dark" onclick="adminCommission('${x.id}')">
♧ Ajouter une commission
</button>
</div>`).join("")||`<div class="muted">Aucun membre.</div>`;
}

async function adminMemberDetails(id){
const m=(window.ADMIN_MEMBERS||[]).find(x=>x.id===id);
if(!m)return;

showModal(`
<button class="close" onclick="closeModal()">×</button>
<h2>👤 Membre</h2>

async function adminBlock(id,currentlyBlocked){
const fn=currentlyBlocked?"admin_unblock_member":"admin_block_member";
const {error}=await sb.rpc(fn,{p_user_id:id});
if(error){
alert("Action refusée : "+error.message);
return;
}
alert(currentlyBlocked?"Membre débloqué.":"Membre bloqué.");
adminTab="members";renderAdmin();
}

async function adminResetPassword(id){
const m=(window.ADMIN_MEMBERS||[]).find(x=>x.id===id);

if(!m?.email){
alert("L'email de ce membre n'est pas disponible dans le profil.");
return;
}

if(!confirm("Envoyer un lien sécurisé de réinitialisation à ce membre ?"))return;

const {error}=await sb.auth.resetPasswordForEmail(m.email,{
redirectTo:location.origin
});

if(error)alert(error.message);
else alert("Lien de réinitialisation envoyé.");
}

async function saveAdminTransaction(id,type){
const amount=Number(document.getElementById("bonusAmount").value);
const reason=document.getElementById("bonusReason").value.trim();

if(amount<=0||!reason){alert("Montant et motif obligatoires.");return}

const rpc={
bonus:"admin_add_bonus",
income:"admin_add_income",
commission:"admin_add_commission"
}[type];

const {error}=await sb.rpc(rpc,{
p_user_id:id,p_amount:amount,p_reason:reason
});

if(error){alert("Impossible : "+error.message);return}

closeModal();
alert("Transaction enregistrée.");
}

async function savePayment(i){
const operator=document.getElementById("payOp").value.trim();
const number=document.getElementById("payNum").value.trim();
const name=document.getElementById("payName").value.trim();

const {error}=await sb.rpc("admin_update_payment_method",{
p_id:i+1,p_operator:operator,p_number:number,p_name:name
});

if(error){
alert("Impossible : "+error.message);
return;
}

closeModal();
alert("Moyen de paiement modifié.");
}

async function saveNewPayment(){
const operator=document.getElementById("payOp").value.trim();
const number=document.getElementById("payNum").value.trim();
const name=document.getElementById("payName").value.trim();

if(!operator||!number||!name){alert("Tous les champs sont obligatoires.");return}

const {error}=await sb.rpc("admin_add_payment_method",{
p_operator:operator,p_number:number,p_name:name
});

if(error){
alert("Impossible : "+error.message);
return;
}

closeModal();
alert("Opérateur ajouté.");
}

function showModal(html){
modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`;
}

function closeModal(){modal.innerHTML=""}

async function copyText(text){
try{await navigator.clipboard.writeText(text);alert("Copié !")}
catch(e){alert(text)}
}

async function logout(){
await sb.auth.signOut();
user=null;profile=null;wallet=null;
app.classList.add("hidden");
auth.classList.remove("hidden");
}

sb.auth.onAuthStateChange((event,session)=>{
if(event==="SIGNED_IN"&&session)setTimeout(loadUser,100);
if(event==="SIGNED_OUT"){
app.classList.add("hidden");
auth.classList.remove("hidden");
}
});

loadUser();
</script>

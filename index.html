<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KINSHASA MAKAMBO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

header {
  background: #0756a3;
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 450px;
  margin: 35px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

h2 {
  text-align: center;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

input:focus {
  outline: none;
  border-color: #0756a3;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #0756a3;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #064784;
}

.secondary {
  background: #eee;
  color: #222;
}

.message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

footer {
  text-align: center;
  margin: 30px 0;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>KINSHASA MAKAMBO</h1>
  <p>Votre espace d'investissement</p>
</header>

<div class="container">

  <div class="card">

    <h2>Créer un compte</h2>

    <form id="signupForm">

      <label for="name">Nom</label>
      <input
        id="name"
        type="text"
        placeholder="Votre nom"
        required
      >

      <label for="phone">Numéro de téléphone</label>
      <input
        id="phone"
        type="tel"
        value="+243 "
        required
      >

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="Votre adresse email"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        required
        minlength="6"
      >

      <label for="confirmPassword">
        Confirmer le mot de passe
      </label>

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirmez votre mot de passe"
        required
        minlength="6"
      >

      <button type="submit">
        S'inscrire
      </button>

      <button
        type="button"
        class="secondary"
        id="loginButton"
      >
        Connexion
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

  </div>

</div>

<footer>
  © 2026 KINSHASA MAKAMBO
</footer>

<script>

const form = document.getElementById("signupForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {

  event.preventDefault();

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (!name || !phone || !email || !password || !confirmPassword) {
    message.style.color = "red";
    message.textContent =
      "Veuillez remplir tous les champs.";
    return;
  }

  if (password.length < 6) {
    message.style.color = "red";
    message.textContent =
      "Le mot de passe doit contenir au moins 6 caractères.";
    return;
  }

  if (password !== confirmPassword) {
    message.style.color = "red";
    message.textContent =
      "Les deux mots de passe ne correspondent pas.";
    return;
  }

  message.style.color = "green";
  message.textContent =
    "Formulaire correct. Votre inscription peut continuer.";

});

document.getElementById("loginButton")
  .addEventListener("click", function() {

    message.style.color = "#0756a3";
    message.textContent =
      "La connexion sera disponible après la connexion à la base de données.";

  });

</script>

</body>
</html>

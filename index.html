<!-- KINSHASA BUSINESS — index.html -->

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>KINSHASA BUSINESS 🇨🇩</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#e50914;--bg:#09090b;--card:#17171c;--line:#303038;--muted:#aaaab4;--green:#19c37d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;background:#101014;color:#fff;border:1px solid var(--line);border-radius:10px}
label{display:block;color:#ccc;font-size:13px}
header{position:sticky;top:0;background:#101014;padding:15px;border-bottom:1px solid var(--line);z-index:3}
h1{font-size:23px}h2{font-size:20px;margin-top:24px}
main{max-width:760px;margin:auto;padding:15px;padding-bottom:50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;overflow-wrap:anywhere}
.btn{display:inline-block;margin:4px 3px 4px 0;background:#303038;color:white}
.red{background:var(--red);color:white}.green{background:var(--green);color:#07150e}
.danger{background:#65141a;color:#fff}.muted{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:7px}.row>*{flex:1}
.badge{display:inline-block;border-radius:20px;padding:5px 8px;background:#333;font-size:12px}
.pending{background:#594311}.approved{background:#10472f}.rejected,.blocked{background:#65141a}
.hidden{display:none!important}.notice{padding:12px;border-left:4px solid var(--red);background:#202026;border-radius:8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
nav button{background:#25252b;color:white;flex:1;min-width:85px}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
</style>
</head>
<body>
<header><strong>🇨🇩 KINSHASA BUSINESS</strong></header>
<main>
<section id="auth">
<h1>Connexion administrateur / membre</h1>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Mot de passe</label><input id="password" type="password" autocomplete="current-password">
<div class="row">
<button class="red" onclick="login()">Connexion</button>
<button class="btn" onclick="signup()">Inscription</button>
</div>
<button class="btn" onclick="resetPassword()">Réinitialiser mon mot de passe</button>
<div id="authMessage" class="notice"></div>
</section>
<section id="app" class="hidden">
<div class="row">
<div><b id="memberName">Compte</b><div class="muted" id="memberEmail"></div></div>
<button class="btn" onclick="logout()">Déconnexion</button>
</div>
<nav>
<button onclick="showPage('home')">Accueil</button>
<button onclick="showPage('deposit')">Dépôt</button>
<button onclick="showPage('withdraw')">Retrait</button>
<button onclick="showPage('team')">Équipe</button>
<button onclick="showPage('profile')">Profil</button>
<button id="adminNav" class="red hidden" onclick="showPage('admin')">Administration</button>
</nav>
<div id="content"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://uewceocdzvekuopgsmpg.supabase.co";
const SUPABASE_KEY="sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="angenabukuze@gmail.com";
const PAYMENTS=[
 {operator:"AIRTEL MONEY",number:"973087965",name:"YVETTE"},
 {operator:"ORANGE MONEY",number:"899532643",name:"JEANCQUELINE"},
 {operator:"M-PESA",number:"0861823718",name:"REGINA"}
];
const PLANS=[
 {id:"KIN1",price:15000,gain:2000,days:60,max:1},
 {id:"KIN2",price:30000,gain:4400,days:60,max:2},
 {id:"KIN3",price:80000,gain:12300,days:60,max:3},
 {id:"KIN4",price:150000,gain:24000,days:60,max:3},
 {id:"KIN5",price:300000,gain:52000,days:60,max:5},
 {id:"KIN6",price:600000,gain:120000,days:60,max:2},
 {id:"KIN7",price:1500000,gain:330000,days:60,max:2}
];
let user=null,profile=null,wallet=null,isAdmin=false;
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString("fr-FR")+" FC";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(t){$("authMessage").textContent=t}
async function login(){
 const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error)return message(error.message);
 await loadUser();
}
async function signup(){
 const {data,error}=await sb.auth.signUp({email:$("email").value.trim(),password:$("password").value});
 if(error)return message(error.message);
 message("Inscription envoyée. Connectez-vous si votre compte est actif.");
}
async function resetPassword(){
 const email=$("email").value.trim();
 if(!email)return message("Entrez votre email.");
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
 message(error?error.message:"Si le compte existe, un lien de réinitialisation sera envoyé.");
}
async function logout(){await sb.auth.signOut();location.reload()}
async function loadUser(){
 const {data,error}=await sb.auth.getUser();
 if(error||!data.user)return;
 user=data.user;
 const p=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 profile=p.data||{id:user.id,full_name:user.user_metadata?.name||"Membre",role:"member"};
 isAdmin=profile.role==="admin"||user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase();
 const w=await sb.from("kin_wallets").select("*").eq("user_id",user.id).maybeSingle();
 wallet=w.data||{balance:0,total_earnings:0};
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");
 $("memberName").textContent=profile.full_name||"Membre";
 $("memberEmail").textContent=user.email||"";
 $("adminNav").classList.toggle("hidden",!isAdmin);
 showPage("home");
}
function showPage(p){
 if(p==="admin"&&!isAdmin)return alert("Accès administrateur refusé.");
 const c=$("content");
 if(p==="home")c.innerHTML=`<div class="card"><h2>Bienvenue 🇨🇩</h2><h1>${money(wallet?.balance)}</h1>Solde disponible<hr>Gains cumulés : ${money(wallet?.total_earnings)}</div><div class="notice">Les gains affichés ne constituent pas une garantie de rendement.</div><h2>Produits KIN</h2>${PLANS.map(x=>`<div class="card"><b>${x.id}</b><p>Prix : ${money(x.price)}</p><p>Gain affiché : ${money(x.gain)} / jour</p><p>${x.days} jours · maximum ${x.max}</p></div>`).join("")}`;
 if(p==="deposit")renderDeposit();
 if(p==="withdraw")renderWithdraw();
 if(p==="team")c.innerHTML=`<h2>Équipe et assistance</h2><div class="card">Votre code : <b>KIN${user.id.replaceAll("-","").slice(0,8).toUpperCase()}</b></div><div class="card"><a href="https://chat.whatsapp.com/DzKHiqrdBbPI22W7afe9ps" target="_blank"><button class="green">Groupe WhatsApp</button></a><a href="https://t.me/francscongolais" target="_blank"><button class="btn">Groupe Telegram</button></a></div>`;
 if(p==="profile")c.innerHTML=`<div class="card"><h2>Profil</h2>${esc(user.email)}<p>Rôle : ${isAdmin?"Administrateur":"Membre"}</p><button class="btn" onclick="resetPassword()">Envoyer un lien de réinitialisation</button></div>`;
 if(p==="admin")renderAdmin();
}
function renderDeposit(){
 $("content").innerHTML=`<h2>Demande de dépôt</h2><div class="notice">Minimum : 15 000 FC. La validation du transfert reste à confirmer par l'administration.</div><label>Montant FC</label><input id="depAmount" type="number" min="15000"><label>Opérateur</label><select id="depOperator">${PAYMENTS.map((p,i)=>`<option value="${i}">${p.operator} — ${p.number} — ${p.name}</option>`).join("")}</select><label>Référence du transfert</label><input id="depRef"><button class="red" onclick="submitDeposit()">Envoyer</button>`;
}
async function submitDeposit(){
 const amount=Number($("depAmount").value),p=PAYMENTS[Number($("depOperator").value)];
 if(amount<15000)return alert("Minimum 15 000 FC.");
 const {error}=await sb.from("kin_deposit_requests").insert({user_id:user.id,amount,operator:p.operator,payment_number:p.number,payment_name:p.name,reference:$("depRef").value.trim()||null,status:"pending"});
 alert(error?"Erreur : "+error.message:"Demande envoyée. Elle apparaîtra après actualisation.");
}
function renderWithdraw(){
 $("content").innerHTML=`<h2>Demande de retrait</h2><div class="notice">Minimum : 2 000 FC · frais indicatifs : 10 %.</div><label>Montant FC</label><input id="wdAmount" type="number" min="2000"><label>Opérateur de réception</label><select id="wdOperator">${PAYMENTS.map((p,i)=>`<option value="${i}">${p.operator}</option>`).join("")}</select><label>Votre numéro de réception</label><input id="wdNumber"><button class="red" onclick="submitWithdraw()">Envoyer la demande</button>`;
}
async function submitWithdraw(){
 const amount=Number($("wdAmount").value),number=$("wdNumber").value.trim(),p=PAYMENTS[Number($("wdOperator").value)];
 if(amount<2000)return alert("Minimum 2 000 FC.");
 if(amount>Number(wallet?.balance||0))return alert("Solde insuffisant.");
 if(!number)return alert("Entrez le numéro de réception.");
 const {error}=await sb.from("kin_withdrawal_requests").insert({user_id:user.id,amount,fee:amount*.1,net_amount:amount*.9,operator:p.operator,payment_number:number,status:"pending"});
 alert(error?"Erreur : "+error.message:"Demande envoyée à l'administration.");
}
async function renderAdmin(){
 $("content").innerHTML=`
 <h2>⚙ Administration complète</h2>
 <div class="notice">Les actions financières et les changements de statut doivent être autorisés par les fonctions sécurisées de Supabase. Les boutons affichent les erreurs si les fonctions ou permissions ne sont pas disponibles.</div>
 <nav><button onclick="loadAdmin('members')">Membres</button><button onclick="loadAdmin('deposits')">Dépôts</button><button onclick="loadAdmin('withdrawals')">Retraits</button><button onclick="loadAdmin('settings')">Configuration</button></nav>
 <div id="adminResults">Choisissez une section.</div>`;
}
async function loadAdmin(kind){
 if(!isAdmin)return alert("Accès refusé.");
 const box=$("adminResults");box.textContent="Chargement...";
 if(kind==="members"){
  const r=await sb.from("profiles").select("*").order("created_at",{ascending:false});
  if(r.error){box.textContent=r.error.message;return}
  box.innerHTML=(r.data||[]).map(m=>`<div class="card"><b>${esc(m.full_name||"Membre")}</b><p class="muted">${esc(m.id)}</p><p>Code : ${esc(m.referral_code||"—")}</p><p>Rôle : ${esc(m.role||"member")}</p><p>Statut : ${esc(m.status||"non défini")}</p><div class="row"><button class="btn" onclick="adminAction('admin_toggle_member_block',{p_user_id:'${m.id}',p_blocked:true})">Bloquer</button><button class="btn" onclick="adminAction('admin_toggle_member_block',{p_user_id:'${m.id}',p_blocked:false})">Débloquer</button></div><button class="btn" onclick="adminReset('${esc(user.email||"")}')">Réinitialiser mon mot de passe admin</button><button class="btn" onclick="adminAction('admin_adjust_balance',{p_user_id:'${m.id}',p_amount:Number(prompt('Montant signé : + pour créditer, - pour débiter')),p_reason:prompt('Motif obligatoire')})">Ajuster solde</button><button class="btn" onclick="adminAction('admin_assign_kin',{p_user_id:'${m.id}',p_kin_id:prompt('KIN1 à KIN7'),p_reason:prompt('Motif')})">Attribuer un KIN</button></div>`).join("")||"Aucun membre.";
 }
 if(kind==="deposits")await loadRequests("kin_deposit_requests",box,"deposit");
 if(kind==="withdrawals")await loadRequests("kin_withdrawal_requests",box,"withdrawal");
 if(kind==="settings"){
  box.innerHTML=`<div class="card"><h3>Liens d'assistance</h3><label>WhatsApp</label><input id="whatsapp" value="https://chat.whatsapp.com/DzKHiqrdBbPI22W7afe9ps"><label>Telegram</label><input id="telegram" value="https://t.me/francscongolais"><button class="red" onclick="saveSupport()">Enregistrer les liens</button><p class="muted">L'enregistrement nécessite une table de configuration accessible aux administrateurs.</p></div><div class="card"><h3>Opérateurs de paiement</h3><p>Les numéros de paiement peuvent être modifiés dans la configuration Supabase; ne modifiez pas les numéros avant de confirmer le bénéficiaire.</p>${PAYMENTS.map(p=>`<p>${esc(p.operator)} : ${esc(p.number)} — ${esc(p.name)}</p>`).join("")}</div>`;
 }
}
async function loadRequests(table,box,type){
 const r=await sb.from(table).select("*").order("created_at",{ascending:false});
 if(r.error){box.textContent=r.error.message;return}
 box.innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${money(x.amount)}</b><p>Statut : <span class="badge ${esc(x.status||"pending")}">${esc(x.status||"pending")}</span></p><p>Date : ${esc(x.created_at||"—")}</p><p>Opérateur : ${esc(x.operator||"—")}</p><p>Numéro : ${esc(x.payment_number||"—")}</p><p>Référence : ${esc(x.reference||"—")}</p><p>Net : ${money(x.net_amount)}</p><div class="row"><button class="green" onclick="reviewRequest('${type}','${x.id}','approved')">Valider</button><button class="danger" onclick="reviewRequest('${type}','${x.id}','rejected')">Rejeter</button></div></div>`).join("")||"Aucune demande.";
}
async function reviewRequest(type,id,status){
 if(!confirm(`Confirmer le statut ${status} ?`))return;
 const fn=type==="deposit"?"admin_review_deposit":"admin_review_withdrawal";
 const {error}=await sb.rpc(fn,{p_request_id:id,p_status:status,p_note:prompt("Motif ou note administrative")||""});
 if(error)return alert("Action non exécutée : "+error.message+" — vérifiez le nom et les permissions de la fonction Supabase.");
 alert("Statut envoyé à Supabase.");loadAdmin(type==="deposit"?"deposits":"withdrawals");
}
async function adminAction(fn,args){
 if(!isAdmin)return alert("Accès refusé.");
 if(Object.values(args).some(v=>v===null||v===undefined||v===""||(typeof v==="number"&&!Number.isFinite(v))))return alert("Action annulée : informations manquantes.");
 const {error}=await sb.rpc(fn,args);
 if(error)return alert("Action non exécutée : "+error.message+" — vérifiez la fonction Supabase.");
 alert("Action envoyée à Supabase.");loadAdmin("members");
}
async function adminReset(email){
 if(!email)return alert("Email manquant.");
 if(!confirm("Envoyer un lien de réinitialisation à votre compte administrateur ?"))return;
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
 alert(error?error.message:"Lien demandé. Vérifiez votre email.");
}
async function saveSupport(){
 const settings={whatsapp:$("whatsapp").value.trim(),telegram:$("telegram").value.trim()};
 const {error}=await sb.from("kin_settings").upsert([{key:"support_links",value:settings}],{onConflict:"key"});
 alert(error?"Enregistrement impossible : "+error.message:"Liens enregistrés.");
}
sb.auth.onAuthStateChange((event,session)=>{if(session)setTimeout(loadUser,100)});
loadUser();
</script>
</body>
</html>

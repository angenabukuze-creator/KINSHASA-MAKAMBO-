<!-- HISTORIQUE DES TRANSACTIONS DU MEMBRE -->
<section id="historySection" class="hidden">
  <div class="card">
    <h2>📜 Historique de mes transactions</h2>
    <p class="small">
      Retrouvez vos dépôts, retraits, revenus, commissions et bonus.
    </p>

    <label>Type d'opération</label>
    <select id="historyFilter" onchange="loadHistory()">
      <option value="all">Toutes les opérations</option>
      <option value="depot">Dépôts</option>
      <option value="retrait">Retraits</option>
      <option value="revenu">Revenus</option>
      <option value="commission">Commissions</option>
      <option value="bonus">Bonus</option>
    </select>

    <div id="historyList">
      <p class="small">Chargement de l'historique...</p>
    </div>
  </div>
</section>

<script>
async function loadHistory() {
  const box = document.getElementById("historyList");
  const filter = document.getElementById("historyFilter")?.value || "all";

  if (!box) return;

  if (!user?.id) {
    box.innerHTML = "<p>Connectez-vous pour voir vos transactions.</p>";
    return;
  }

  box.innerHTML = "<p>Chargement...</p>";

  const { data, error } = await sb
    .from("kin_transactions")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at", { ascending: false })
    .limit(200);

  if (error) {
    box.innerHTML =
      "<p>Historique indisponible pour le moment.</p>";
    return;
  }

  const rows = (data || []).filter(t => {
    if (filter === "all") return true;

    const type = String(t.type || "").toLowerCase();
    const description = String(t.description || "").toLowerCase();
    const value = type + " " + description;

    const keywords = {
      depot: ["depot", "dépôt", "recharge"],
      retrait: ["retrait", "withdraw"],
      revenu: ["revenu", "gain", "earning"],
      commission: ["commission", "parrainage"],
      bonus: ["bonus", "prime", "inscription"]
    };

    return (keywords[filter] || []).some(k => value.includes(k));
  });

  if (!rows.length) {
    box.innerHTML =
      "<p class='small'>Aucune transaction dans cette catégorie.</p>";
    return;
  }

  box.innerHTML = rows.map(t => {
    const amount = Number(t.amount || 0);
    const date = t.created_at
      ? new Date(t.created_at).toLocaleString("fr-FR")
      : "Date indisponible";

    const safe = value =>
      String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);

    return `
      <div class="tableItem">
        <b>${safe(t.type || "Transaction")}</b>
        <p class="small">${safe(t.description || "")}</p>
        <p>
          <strong class="${amount >= 0 ? "green" : "red"}">
            ${amount >= 0 ? "+" : ""}${amount.toLocaleString("fr-FR")} FC
          </strong>
        </p>
        <p class="small">Statut : ${safe(t.status || "Enregistré")}</p>
        <p class="small">📅 ${safe(date)}</p>
      </div>
    `;
  }).join("");
}
</script>

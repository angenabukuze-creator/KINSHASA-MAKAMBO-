<style>
:root{

}
*{box-sizing:border-box}

body{
  margin:0;
  background:var(--black);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,select,textarea{

}

button{

}

.hidden{
  display:none!important;
}

.app{
  max-width:650px;
  min-height:100vh;
  margin:auto;
  padding-bottom:90px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,11,.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.flag{
  font-size:30px;
}

.logo strong{
  font-size:19px;
}

.logo small{
  display:block;
  color:var(--gray);
  margin-top:3px;
}

main{
  padding:15px;
}

.card{
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}

.hero{
  background:linear-gradient(145deg,#260307,#111116 65%);
  border:1px solid #5c1117;
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
}

.hero h1{
  margin:0 0 7px;
  font-size:27px;
}

.hero p{
  margin:0;
  color:#d2d2d7;
}

.balance{
  font-size:30px;
  font-weight:900;

}

.muted{
  color:var(--gray);
}

.notice{
  border-left:4px solid var(--red);
  background:#18181c;
  padding:12px;
  border-radius:12px;
  margin-bottom:14px;
  color:#ddd;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.action{
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 10px;
  color:white;
  text-align:center;
}

.action b{
  display:block;

}

.action span{
  font-size:25px;
}

h2{
  font-size:20px;
  margin:18px 0 10px;
}

h3{
  margin:0 0 8px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.plan{
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}

.plan-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.kin{
  font-size:22px;
  font-weight:900;
}

.price{
  font-size:21px;
  font-weight:800;
}

.gain{
  color:var(--green);
  font-weight:700;
  margin:9px 0;
}

.tag{
  display:inline-block;
  background:#2a2a30;
  color:#ddd;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  margin:3px 3px 0 0;
}

.btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  font-weight:800;
  margin-top:9px;
}

.btn-red{
  background:var(--red);
  color:white;
}

.btn-dark{
  background:#29292f;
  color:white;
  border:1px solid #3a3a42;
}

.btn-green{
  background:var(--green);
  color:#06150f;
}

.btn-blue{
  background:var(--blue);
  color:white;
}

.btn-yellow{
  background:var(--yellow);
  color:#111;
}

.btn-danger{
  background:#471016;
  color:#ffb8bd;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

input,select,textarea{
  width:100%;
  background:#0f0f12;
  color:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  outline:none;
  margin:5px 0 9px;
}

textarea{
  min-height:90px;
}

label{
  display:block;
  font-size:13px;
  color:#c9c9cf;
  margin-top:8px;
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.auth-box{
  width:100%;
  max-width:430px;
  background:var(--dark);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
}

.auth-logo{
  text-align:center;
  margin-bottom:20px;
}

.auth-logo .flag{
  font-size:45px;
}

.auth-logo h1{
  margin:7px 0;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#0c0c0f;
  border-radius:12px;
  padding:4px;
  margin-bottom:15px;
}

.tabs button{

  background:none;
  color:#aaa;
  padding:10px;
  border-radius:9px;
}

.tabs button.active{
  background:var(--red);
  color:white;
}

.msg{

  border-radius:10px;
  margin:8px 0;
  font-size:14px;
}

.msg.ok{
  background:#103c2b;
  color:#8ff0c4;
}

.msg.err{
  background:#42151a;
  color:#ffb9be;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-box{
  width:min(650px,100%);
  background:#151519;
  border-radius:22px 22px 0 0;
  padding:18px;

  overflow:auto;
}

.close{
  float:right;
  background:#29292f;

  border-radius:50%;

  height:35px;
}

.stat{
  background:#111115;

}

.stat b{

}

.admin-title{

}

.member{

}

.status{

.status.pending{

}

.status.approved{

  color:#8ff0c4;
}

.status.rejected{

}

.status.blocked{
  background:#42151a;

}

.admin-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);

}

.admin-tabs button{

  color:#ddd;
  border-radius:10px;
  padding:10px 4px;
  font-size:12px;
}

.admin-tabs button.active{

}

.search{
  margin-bottom:12px;
}

.small{
  font-size:12px;
}

.center{
  text-align:center;
}

hr{
  border:0;

  margin:16px 0;

.nav{
  position:fixed;
  z-index:30;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(650px,100%);
  background:#111114;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 5px calc(8px + env(safe-area-inset-bottom));
}

.nav button{
  background:none;
  border:0;
  color:#9999a2;
  font-size:11px;
  padding:6px 2px;
}

.nav button.active{
  color:white;
}

.nav span{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

.admin-action-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

@media(max-width:380px){
  .admin-action-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

</div>

<script>

const SUPABASE_URL =
"https://uewceocdzvekuopgsmpg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const ADMIN_EMAIL =
"angenabukuze@gmail.com";


const PAYMENTS = [

  {
    operator:"AIRTEL MONEY",
    number:"973087965",
    name:"YVETTE"
  },

  {
    operator:"ORANGE MONEY",
    number:"899532643",
    name:"JEANCQUELINE"
  },

  {
    operator:"M-PESA",
    number:"0861823718",
    name:"REGINA"
  }

];


const PLANS = [

  {
    id:"KIN1",
    price:15000,
    gain:2000,
    days:60,
    max:1
  },

  {
    id:"KIN2",
    price:30000,
    gain:4400,
    days:60,
    max:2
  },

  {
    id:"KIN3",
    price:80000,
    gain:12300,
    days:60,
    max:3
  },

  {
    id:"KIN4",
    price:150000,
    gain:24000,
    days:60,
    max:3
  },

  {
    id:"KIN5",
    price:300000,
    gain:52000,
    days:60,
    max:5
  },

  {
    id:"KIN6",
    price:600000,
    gain:120000,
    days:60,
    max:2
  },

  {
    id:"KIN7",
    price:1500000,
    gain:330000,
    days:60,
    max:2
  }

];


let user=null;
let profile=null;
let wallet=null;
let currentPage="home";
let isAdmin=false;


const money=n =>
Number(n||0).toLocaleString("fr-FR")+" FC";


function esc(v){

  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function msg(text,type="ok"){

  return `
    <div class="msg ${type}">
      ${esc(text)}
    </div>
  `;

}


function showAuth(type){

  const login=type==="login";

  document
    .getElementById("loginTab")
    .classList.toggle("active",login);

  document
    .getElementById("signupTab")
    .classList.toggle("active",!login);

  document
    .getElementById("signupFields")
    .classList.toggle("hidden",login);

  document
    .getElementById("authBtn")
    .textContent=
      login
      ?"Se connecter"
      :"Créer mon compte";

  document
    .getElementById("authMsg")
    .innerHTML="";

}


async function submitAuth(){

  const email=
    document
      .getElementById("email")
      .value
      .trim();

  const password=
    document
      .getElementById("password")
      .value;

  const name=
    document
      .getElementById("name")
      .value
      .trim();

  if(!email||!password){

    document
      .getElementById("authMsg")
      .innerHTML=
        msg(
          "Email et mot de passe obligatoires",
          "err"
        );

    return;
  }

  const signup=
    !document
      .getElementById("signupFields")
      .classList
      .contains("hidden");

  document
    .getElementById("authBtn")
    .disabled=true;

  try{

    if(signup){

      const {data,error}=
        await sb.auth.signUp({

          email,

          password,

          options:{
            data:{
              name
            }
          }

        });

      if(error)throw error;

      if(data.user){

        await sb
          .from("profiles")
          .upsert({

            id:data.user.id,

            full_name:
              name||"Membre",

            role:"member"

          });

        await sb
          .from("kin_wallets")
          .upsert({

            user_id:data.user.id,

            balance:2000,

            total_earnings:0

          });

        document
          .getElementById("authMsg")
          .innerHTML=
            msg(
              "Inscription réussie ! Vous pouvez maintenant utiliser votre compte."
            );

      }

    }else{

      const {error}=
        await sb.auth.signInWithPassword({

          email,

          password

        });

      if(error)throw error;

    }

  }catch(e){

    document
      .getElementById("authMsg")
      .innerHTML=
        msg(
          e.message||
          "Une erreur est survenue",
          "err"
        );

  }finally{

    document
      .getElementById("authBtn")
      .disabled=false;

  }

}


async function githubLogin(){

  const {error}=
    await sb.auth.signInWithOAuth({

      provider:"github",

      options:{
        redirectTo:location.href
      }

    });

  if(error){

    document
      .getElementById("authMsg")
      .innerHTML=
        msg(error.message,"err");

  }

}


async function loadUser(){

  const {data}=
    await sb.auth.getUser();

  user=data.user;

  if(!user){

    document
      .getElementById("auth")
      .classList.remove("hidden");

    document
      .getElementById("app")
      .classList.add("hidden");

    return;
  }

  await loadData();

  document
    .getElementById("auth")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  page("home");

}


async function loadData(){

  if(!user)return;

  const p=
    await sb
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  profile=
    p.data||
    {
      id:user.id,

      full_name:
        user.user_metadata?.name||
        "Membre",

      role:"member"
    };

  isAdmin=
    profile.role==="admin"||
    user.email?.toLowerCase()===
      ADMIN_EMAIL.toLowerCase();

  const w=
    await sb
      .from("kin_wallets")
      .select("*")
      .eq("user_id",user.id)
      .maybeSingle();

  wallet=
    w.data||
    {
      balance:2000,
      total_earnings:0
    };

}


function navActive(name){

  document
    .querySelectorAll(".nav button")
    .forEach(x=>
      x.classList.remove("active")
    );

  const el=
    document.getElementById(
      "nav-"+name
    );

  if(el)
    el.classList.add("active");

}


function page(name){

  currentPage=name;

  if(name==="admin"&&!isAdmin){
    name="profile";
  }

  navActive(
    name==="products"
      ?"products"
      :name==="tasks"
      ?"tasks"
      :name==="team"
      ?"team"
      :name==="profile"
      ?"profile"
      :"home"
  );

  if(name==="home")
    renderHome();

  if(name==="products")
    renderProducts();

  if(name==="tasks")
    renderTasks();

  if(name==="team")
    renderTeam();

  if(name==="profile")
    renderProfile();

  if(name==="admin")
    renderAdmin();

}


function renderHome(){

  const c=
    document.getElementById("content");

  c.innerHTML=`

    <section class="hero">

      <h1>
        Bienvenue 🇨🇩
      </h1>

      <p>
        ${esc(
          profile?.full_name||
          "Membre"
        )}
        · KINSHASA BUSINESS
      </p>

      <div class="balance">
        ${money(wallet?.balance)}
      </div>

      <div class="muted">
        Solde disponible
      </div>

      <div
        class="row"
        style="margin-top:15px"
      >

        <div>

          <small class="muted">
            Gains cumulés
          </small>

          <div>
            <b>
              ${money(
                wallet?.total_earnings
              )}
            </b>
          </div>

        </div>

        <div>
          🇨🇩
        </div>

      </div>

    </section>


    <div class="notice">

      📢 Bienvenue sur
      <b>KINSHASA BUSINESS</b>.

      Les montants affichés sont
      les paramètres déclarés des produits
      et ne constituent pas une garantie
      de rendement.

    </div>


    <div class="grid">

      <button
        class="action"
        onclick="openDeposit()">

        <span>＋</span>

        <b>
          Dépôt
        </b>

      </button>


      <button
        class="action"
        onclick="openWithdraw()">

        <span>↗</span>

        <b>
          Retrait
        </b>

      </button>


      <button
        class="action"
        onclick="page('tasks')">

        <span>✓</span>

        <b>
          Pointage
        </b>

      </button>


      <button
        class="action"
        onclick="page('team')">

        <span>♧</span>

        <b>
          Équipe
        </b>

      </button>

    </div>


    <h2>
      Nos KIN
    </h2>


    ${PLANS
      .slice(0,3)
      .map(planMini)
      .join("")}


    <button
      class="btn btn-red"
      onclick="page('products')">

      Voir tous les KIN

    </button>

  `;

}


function planMini(p){

  return `

    <div class="plan">

      <div class="plan-top">

        <div class="kin">
          ${p.id}
        </div>

        <div class="price">
          ${money(p.price)}
        </div>

      </div>

      <div class="gain">
        Gain affiché :
        ${money(p.gain)}
        / jour
      </div>

      <span class="tag">
        ${p.days} jours
      </span>

      <span class="tag">
        Maximum :
        ${p.max}
      </span>

    </div>

  `;

}


function renderProducts(){

  document
    .getElementById("content")
    .innerHTML=`

      <h2>
        Produits KIN
      </h2>

      <div class="notice">

        Les montants sont les
        paramètres déclarés des produits.

      </div>

      ${PLANS.map(p=>`

        <div class="plan">

          <div class="plan-top">

            <div class="kin">
              ${p.id}
            </div>

            <div class="price">
              ${money(p.price)}
            </div>

          </div>

          <div class="gain">
            Gain affiché :
            ${money(p.gain)}
            / jour
          </div>

          <span class="tag">
            ${p.days} jours
          </span>

          <span class="tag">
            Maximum ${p.max}
          </span>

          <button
            class="btn btn-red"
            onclick="requestKin('${p.id}')">

            Acheter ${p.id}

          </button>

        </div>

      `).join("")}

  `;

}


/* =====================================================
   ACHAT KIN
   APPEL SERVEUR buy_kin
===================================================== */

async function requestKin(id){

  if(!user){

    alert(
      "Veuillez vous connecter."
    );

    return;
  }

  const p=
    PLANS.find(x=>x.id===id);

  if(!p)return;

  showModal(`

    <button
      class="close"
      onclick="closeModal()">
      ×
    </button>

    <h2>
      Acheter ${p.id}
    </h2>

    <p>
      Prix :
      <b>${money(p.price)}</b>
    </p>

    <p>
      Gain affiché :
      <b>${money(p.gain)} / jour</b>
    </p>

    <p>
      Durée :
      <b>${p.days} jours</b>
    </p>

    <p>
      Positions maximum :
      <b>${p.max}</b>

async function submitWithdraw(){

  const amount=
    Number(
      document
        .getElementById("wdAmount")
        .value
    );

  const operator=
    PAYMENTS[
      Number(
        document
          .getElementById(
            "wdOperator"
          ).value
      )
    ];

  const number=
    document
      .getElementById("wdNumber")
      .value
      .trim();

  if(amount<2000){

    alert(
      "Le retrait minimum est de 2 000 FC."
    );

    return;
  }

  if(
    amount>
    Number(wallet?.balance||0)
  ){

    alert(
      "Solde insuffisant."
    );

    return;
  }

  if(!number){

    alert(
      "Entrez votre numéro de réception."
    );

    return;
  }

  const fee=
    amount*0.10;

  const net=
    amount-fee;

  try{

    const {error}=
      await sb
        .from(
          "kin_withdrawal_requests"
        )
        .insert({

          user_id:user.id,

          amount,

          fee,

          net_amount:net,

          operator:
            operator.operator,

          payment_number:
            number,

          status:
            "pending"

        });

    if(error)
      throw error;

    closeModal();

    alert(
      "Demande envoyée.\n\n"+
      "Montant : "+
      money(amount)+
      "\nFrais 10% : "+
      money(fee)+
      "\nNet : "+
      money(net)
    );

  }catch(e){

    alert(
      "Impossible d'envoyer la demande : "+
      e.message
    );

  }

}

async function adminToggleMember(id){

  const value=
    prompt(
      "Tapez BLOQUER pour bloquer ce membre ou DEBLOQUER pour le réactiver :"
    );

  if(!value)return;

  const blocked=
    value
      .trim()
      .toUpperCase()
      ==="BLOQUER";

  const unblocked=
    value
      .trim()
      .toUpperCase()
      ==="DEBLOQUER";

  if(!blocked&&!unblocked){

    alert(
      "Réponse incorrecte."
    );

    return;
  }

  try{

    const {error}=
      await sb.rpc(
        "admin_set_member_status",
        {
          p_user_id:id,

          p_status:
            blocked
            ?"blocked"
            :"active"
        }
      );

    if(error)throw error;

    alert(
      blocked
      ?"Membre bloqué."
      :"Membre débloqué."
    );

    renderAdmin();

  }catch(e){

    alert(
      "Action non disponible côté serveur :\n\n"+
      e.message
    );

  }

}

            "—"
          )}
        </b>
      </div>

        ${esc(
          x.reference||
          "—"
        )}
      </div>

      <div class="small muted">

        Date :
        ${formatDate(x.created_at)}

      </div>

      <span
        class="status ${statusClass(status)}">

        ${statusLabel(status)}

      </span>


      ${
        status==="pending"
        ?`

          <button
            class="btn btn-green"
            onclick="adminFinanceAction(
              'deposit',
              '${x.id}',
              'approved'
            )">

            ✅ Valider le dépôt

          </button>


          <button
            class="btn btn-danger"
            onclick="adminFinanceAction(
              'deposit',
              '${x.id}',
              'rejected'
            )">

            ❌ Rejeter le dépôt

          </button>

        `
        :""
      }

    </div>

  `;

}


function adminWithdrawalCard(x){

  const status=
    x.status||
    "pending";

  return `

    <div class="member">

      <b>
        ${money(x.amount)}
      </b>

      <div>
        Frais :
        <b>
          ${money(x.fee)}
        </b>
      </div>

      <div>
        Net :
        <b>
          ${money(x.net_amount)}
        </b>
      </div>

      <div>
        Opérateur :
        ${esc(x.operator||"—")}
      </div>

      <div>
        Numéro :
        <b>
          ${esc(
            x.payment_number||
            "—"
          )}
        </b>
      </div>

      <div class="small muted">
        Date :
        ${formatDate(x.created_at)}
      </div>

      <span
        class="status ${statusClass(status)}">

        ${statusLabel(status)}

      </span>


      ${
        status==="pending"
        ?`

          <button
            class="btn btn-green"
            onclick="adminFinanceAction(
              'withdrawal',
              '${x.id}',
              'approved'
            )">

            ✅ Valider le retrait

          </button>


          <button
            class="btn btn-danger"
            onclick="adminFinanceAction(
              'withdrawal',
              '${x.id}',
              'rejected'
            )">

            ❌ Rejeter le retrait

          </button>

        `
        :""
      }

    </div>

  `;

}


function statusClass(status){

  if(status==="approved")
    return "approved";

  if(status==="rejected")
    return "rejected";

  return "pending";

}


function statusLabel(status){

  if(status==="approved")
    return "VALIDÉ";

  if(status==="rejected")
    return "REJETÉ";

  return "EN ATTENTE";

}


function formatDate(value){

  if(!value)
    return "—";

  try{

    return new Date(value)
      .toLocaleString("fr-FR");

  }catch(e){

    return value;

  }

}


/*
  Les validations appellent le serveur.
  Aucun crédit/débit financier n'est
  effectué directement par le navigateur.
*/

async function adminFinanceAction(
  type,
  id,
  status
){

  const note=
    prompt(
      status==="approved"
      ?"Note de validation (facultatif) :"
      :"Motif du rejet :"
    );

  if(
    status==="rejected" &&
    !note
  ){

    alert(
      "Le motif du rejet est obligatoire."
    );

    return;
  }

  try{

    const rpc=
      type==="deposit"
      ?"admin_set_deposit_status"
      :"admin_set_withdrawal_status";

    const {error}=
      await sb.rpc(
        rpc,
        {
          p_request_id:id,

          p_status:status,

          p_note:
            note||null
        }
      );

    if(error)throw error;

    alert(
      status==="approved"
      ?"Opération validée."
      :"Opération rejetée."
    );

    adminOpen("finance");

  }catch(e){

    alert(
      "Le serveur a refusé cette opération.\n\n"+
      e.message
    );

  }

}

function showModal(html){

        onclick="
          if(event.target===this)
          closeModal()
        ">

        <div class="modal-box">

      </div>

  `;

}


function closeModal(){

  document
    .getElementById("modal")
    .innerHTML="";

}


async function copyText(text){

  try{

    await navigator
      .clipboard
      .writeText(text);

    alert("Copié !");

  }catch(e){

    alert(text);

  }

}


async function logout(){

  await sb.auth.signOut();

  user=null;
  profile=null;
  wallet=null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("auth")
    .classList.remove("hidden");

}


sb.auth.onAuthStateChange(
  async(event,session)=>{

    if(
      event==="SIGNED_IN"&&
      session
    ){

      setTimeout(
        loadUser,
        100
      );

    }

    if(event==="SIGNED_OUT"){

      document
        .getElementById("app")
        .classList.add("hidden");

      document
        .getElementById("auth")
        .classList.remove("hidden");

    }

  }
);


loadUser();

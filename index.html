
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINSHASA BUSINESS 🇨🇩</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#007fff;--j:#ffce00;--r:#ce1021}
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
.drapeau{height:7px;background:linear-gradient(#007fff 33%,#ffce00 33% 66%,#ce1021 66%)}
header{background:var(--b);color:white;text-align:center;padding:22px 10px;border-bottom:5px solid var(--j)}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0}
main{max-width:600px;margin:18px auto;padding:0 12px 100px}
.carte{background:white;padding:18px;border-radius:14px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
h2{font-size:21px}
.ligne{display:flex;gap:9px;margin-bottom:18px}
button{border:0;border-radius:9px;padding:13px;font-size:15px;font-weight:bold;cursor:pointer}
.ligne button{flex:1}
.bleu{background:var(--b);color:white}
.jaune{background:var(--j);color:#172033}
.rouge{background:var(--r);color:white}
.large{width:100%}
label{font-size:14px;font-weight:bold}
input{width:100%;padding:13px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
.cache{display:none!important}
.message{padding:12px;border-radius:8px;margin-top:12px;overflow-wrap:anywhere}
.erreur{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.succes{background:#dcfce7;color:#166534}
.stat{padding:15px;background:#eaf4ff;border-radius:9px;margin:12px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -3px 12px #0002;padding:5px 2px}
nav button{background:white;font-size:11px;padding:7px 1px}
nav span{display:block;font-size:21px;margin-bottom:4px}
nav button.actif{color:var(--b);background:#eaf4ff}
a{color:var(--b)}
</style>
</head>
<body>
<div class="drapeau"></div>
<header>
<h1>🇨🇩 KINSHASA BUSINESS</h1>
<p>République démocratique du Congo</p>
</header>

<main>
<section id="auth" class="carte">
<div class="ligne">
<button id="tabConnexion" class="bleu" type="button" onclick="modeAuth('connexion')">Connexion</button>
<button id="tabInscription" class="jaune" type="button" onclick="modeAuth('inscription')">Inscription</button>
</div>
<h2 id="titre">Connexion</h2>

<form id="formAuth">
<div id="zoneNom" class="cache">
<label>Nom complet</label>
<input id="nom" autocomplete="name" placeholder="Votre nom complet">
</div>

<div id="zoneEmail" class="cache">
<label>Email</label>
<input id="email" type="email" autocomplete="email" placeholder="exemple@email.com">
</div>

<div id="zoneTelephone" class="cache">
<label>Téléphone RDC (+243)</label>
<input id="telephone" type="tel" autocomplete="tel" placeholder="+243XXXXXXXXX">
</div>

<div id="zoneIdentifiant">
<label>Email ou téléphone RDC (+243)</label>
<input id="identifiant" autocomplete="username" placeholder="Email ou +243XXXXXXXXX">
</div>

<div id="zoneParrain" class="cache">
<label>Code de parrainage (facultatif)</label>
<input id="parrain" placeholder="Code du parrain">
</div>

<label>Mot de passe</label>
<input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="Votre mot de passe">

<div id="zoneConfirmation" class="cache">
<label>Confirmer le mot de passe</label>
<input id="confirmation" type="password" minlength="6" autocomplete="new-password" placeholder="Répéter le mot de passe">
</div>

<button id="envoyer" class="bleu large" type="submit">Se connecter</button>
</form>

<p id="oubli" style="text-align:center"><a href="#" onclick="motDePasseOublie(event)">Mot de passe oublié ?</a></p>
<div id="message" class="cache"></div>
</section>

<section id="espace" class="cache">
<div class="carte">
<h2 id="titrePage">🏠 Accueil</h2>
<p id="bienvenue"></p>
<div class="stat">💰 Solde : <strong>0 Fc</strong></div>
<div id="contenu">Bienvenue sur KINSHASA BUSINESS 🇨🇩</div>
</div>
<div class="carte">
<button class="rouge large" onclick="deconnexion()">Déconnexion</button>
</div>
</section>
</main>

<nav id="menu" class="cache">
<button class="actif" onclick="ouvrirPage('Accueil',this)"><span>🏠</span>Accueil</button>
<button onclick="ouvrirPage('KIN',this)"><span>🧴</span>KIN</button>
<button onclick="ouvrirPage('Pointage',this)"><span>✓</span>Pointage</button>
<button onclick="ouvrirPage('Menu',this)"><span>☰</span>Menu</button>
</nav>

<script>
const SUPABASE_URL="https://uewceocdzvekuopgsmpg.supabase.co";
const SUPABASE_KEY="sb_publishable_Bl_nhA00AQTJPBVBu7EFFQ_GhPUvtq9";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let mode="connexion";
let utilisateur=null;

function afficherMessage(texte,type="info"){
  $("message").textContent=texte;
  $("message").className="message "+type;
}

function modeAuth(nouveau){
  mode=nouveau;
  const inscription=mode==="inscription";

  $("titre").textContent=inscription?"Créer un compte":"Connexion";
  $("tabConnexion").className=inscription?"jaune":"bleu";
  $("tabInscription").className=inscription?"bleu":"jaune";

  $("zoneNom").classList.toggle("cache",!inscription);
  $("zoneEmail").classList.toggle("cache",!inscription);
  $("zoneTelephone").classList.toggle("cache",!inscription);
  $("zoneIdentifiant").classList.toggle("cache",inscription);
  $("zoneParrain").classList.toggle("cache",!inscription);
  $("zoneConfirmation").classList.toggle("cache",!inscription);

  $("nom").required=inscription;
  $("email").required=inscription;
  $("telephone").required=inscription;
  $("identifiant").required=!inscription;
  $("confirmation").required=inscription;

  $("envoyer").textContent=inscription?"S'inscrire":"Se connecter";
  $("oubli").classList.toggle("cache",inscription);
  $("message").className="cache";
}

function normaliserTelephone(numero){
  return numero.replace(/[\s()-]/g,"");
}

function traduireErreur(texte){
  if(/Invalid login credentials/i.test(texte))
    return "Identifiants incorrects. Vérifiez votre e-mail ou téléphone et votre mot de passe.";
  if(/Email not confirmed/i.test(texte))
    return "Votre e-mail n'est pas confirmé. Vérifiez votre boîte mail ou les réglages Auth de Supabase.";
  if(/already registered/i.test(texte))
    return "Cet e-mail est déjà inscrit. Essayez de vous connecter.";
  if(/phone.*disabled|phone provider is disabled/i.test(texte))
    return "La connexion par téléphone n'est pas encore activée dans Supabase. Utilisez votre e-mail.";
  if(/rate limit/i.test(texte))
    return "Trop de tentatives. Attendez un peu puis réessayez.";
  return texte;
}

$("formAuth").addEventListener("submit",async function(e){
  e.preventDefault();
  $("envoyer").disabled=true;
  $("envoyer").textContent="Patientez...";

  try{
    const password=$("password").value;

    if(mode==="inscription"){
      const nom=$("nom").value.trim();
      const email=$("email").value.trim();
      const telephone=normaliserTelephone($("telephone").value);

      if(!nom) throw new Error("Entrez votre nom complet.");
      if(!/^\+243[0-9]{9}$/.test(telephone))
        throw new Error("Le téléphone doit commencer par +243 et contenir 9 chiffres après.");
      if(password.length<6)
        throw new Error("Le mot de passe doit contenir au moins 6 caractères.");
      if(password!==$("confirmation").value)
        throw new Error("Les mots de passe ne correspondent pas.");

      const {data,error}=await db.auth.signUp({
        email:email,
        password:password,
        options:{
          data:{
            full_name:nom,
            phone_number:telephone,
            referral_code:$("parrain").value.trim()
          }
        }
      });

      if(error) throw error;

      if(data.session){
        utilisateur=data.user;
        afficherEspace();
      }else{
        afficherMessage("Inscription envoyée. Si Supabase demande la confirmation par e-mail, confirmez votre adresse avant de vous connecter.","succes");
      }
    }else{
      const identifiant=$("identifiant").value.trim();
      let resultat;

      if(identifiant.includes("@")){
        resultat=await db.auth.signInWithPassword({
          email:identifiant,
          password:password
        });
      }else{
        const telephone=normaliserTelephone(identifiant);
        if(!/^\+243[0-9]{9}$/.test(telephone))
          throw new Error("Entrez un e-mail valide ou un numéro au format +243XXXXXXXXX.");

        resultat=await db.auth.signInWithPassword({
          phone:telephone,
          password:password
        });
      }

      if(resultat.error) throw resultat.error;
      utilisateur=resultat.data.user;
      afficherEspace();
    }
  }catch(err){
    afficherMessage(traduireErreur(err.message||"Une erreur est survenue."),"erreur");
  }finally{
    $("envoyer").disabled=false;
    $("envoyer").textContent=mode==="inscription"?"S'inscrire":"Se connecter";
  }
});

async function motDePasseOublie(e){
  e.preventDefault();
  const identifiant=$("identifiant").value.trim();

  if(!identifiant.includes("@")){
    afficherMessage("Pour réinitialiser le mot de passe, entrez l'adresse e-mail du compte dans Connexion.","info");
    return;
  }

  try{
    const {error}=await db.auth.resetPasswordForEmail(identifiant,{
      redirectTo:window.location.origin
    });
    if(error) throw error;
    afficherMessage("Si cette adresse est enregistrée, un e-mail de réinitialisation sera envoyé.","succes");
  }catch(err){
    afficherMessage(traduireErreur(err.message),"erreur");
  }
}

function afficherEspace(){
  $("auth").classList.add("cache");
  $("espace").classList.remove("cache");
  $("menu").classList.remove("cache");
  $("bienvenue").textContent="Bienvenue "+(utilisateur?.user_metadata?.full_name||utilisateur?.email||"sur votre espace")+" !";
  ouvrirPage("Accueil",document.querySelector("nav button"));
}

function ouvrirPage(page,bouton){
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("actif"));
  if(bouton) bouton.classList.add("actif");

  const titres={
    Accueil:"🏠 Accueil",KIN:"🧴 KIN",Pointage:"✓ Pointage",
    Equipe:"👥 Équipe",Historique:"📜 Historique",
    Profil:"👤 Profil",Admin:"⚙️ Administration",Menu:"☰ Menu"
  };
  $("titrePage").textContent=titres[page]||page;

  if(page==="Menu"){
    $("contenu").innerHTML=
      '<p><button class="jaune large" onclick="ouvrirPage(\'Equipe\')">👥 Équipe</button></p>'+
      '<p><button class="jaune large" onclick="ouvrirPage(\'Historique\')">📜 Historique</button></p>'+
      '<p><button class="jaune large" onclick="ouvrirPage(\'Profil\')">👤 Profil</button></p>'+
      '<p><button class="bleu large" onclick="ouvrirPage(\'Admin\')">⚙️ Administration</button></p>';
    return;
  }

  const contenus={
    Accueil:"Bienvenue sur KINSHASA BUSINESS 🇨🇩",
    KIN:"Les plans KIN seront affichés après leur configuration.",
    Pointage:"Le pointage journalier nécessite une base de données configurée.",
    Equipe:"Votre équipe et vos filleuls apparaîtront ici après configuration.",
    Historique:"Vos dépôts, retraits et opérations apparaîtront ici après configuration.",
    Profil:"E-mail : "+(utilisateur?.email||"Non disponible"),
    Admin:"Espace de démonstration. L'administration réelle doit être protégée par des autorisations côté serveur."
  };
  $("contenu").textContent=contenus[page]||"Bienvenue.";
}

async function deconnexion(){
  await db.auth.signOut();
  utilisateur=null;
  $("espace").classList.add("cache");
  $("menu").classList.add("cache");
  $("auth").classList.remove("cache");
  $("password").value="";
  modeAuth("connexion");
}

async function restaurerSession(){
  try{
    const {data,error}=await db.auth.getSession();
    if(!error&&data.session){
      utilisateur=data.session.user;
      afficherEspace();
    }
  }catch(e){
    console.error("Session non restaurée",e);
  }
}

restaurerSession();
modeAuth("connexion");
</script>
</body>
</html>
